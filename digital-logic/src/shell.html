  <style>

    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0f1218"></rect><path d="M30 35h12a15 15 0 0 1 0 30H30z" fill="none" stroke="#ffb02e" stroke-width="4"></path><path d="M22 42h8M22 58h8M57 50h12" stroke="#3ddc84" stroke-width="4"></path><circle cx="74" cy="50" r="5" fill="#3ddc84"></circle></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
/* Digital Logic Breadboard — loader runtime. The delivered file is this script plus four data islands written by
   build.py (manifest, ext_resources, page_order, template). On DOMContentLoaded it decodes every asset in the manifest
   to a blob: or data: URL, puts those URLs into the page template, swaps the template in as the document, and
   re-creates its scripts so they run in order. Held to the Code Quality Standards (principal ruling 2026-10-17 (5)).
   The nested-page relay and the external-resource map are generic bundle features; this tool ships no nested pages
   and no external resources (page_order and ext_resources are empty), so they stay inert (SEC-DL-011, -009). */
/* ============================================================
   TABLE OF CONTENTS
   1. Constants          — base64 chunk, relay cap, asset and uuid shapes, error banner
   2. Helpers            — status line, base64, message origin check
   3. Error sink         — a plain banner for the student, the detail to the console only (SEC-DL-007)
   4. Startup            — on DOMContentLoaded: read the islands, then 4.1 to 4.4
      4.1 Nested-page relay — page text for framed pages, over a strict parent-chain protocol
      4.2 Unpack          — decode every manifest asset to a blob: or data: URL
      4.3 Render          — put the URLs into the template, swap it in, resolve page frames
      4.4 Scripts         — re-create the template's scripts so they run, in order
   ============================================================ */
(function() {
// ── CONSTANTS ─────────────────────────────────────────────────
const B64_CHUNK = 0x8000;        // bytes per String.fromCharCode call when base64-encoding (keeps the argument list short)
const RELAY_MAX = 128;           // page uuids awaiting a relay at once; past this, new requests are dropped
const ERR_FILE_CHARS = 60;       // an error's file name is cut to this many characters in the console line
const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
// A frame src naming a nested page: about:blank#<uuid>, optionally followed by the page's own #fragment.
const FRAME_MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
const BABEL_TYPES = ['text/babel', 'text/jsx'];
const ERR_ID = '__bundler_err';
const ERR_STYLE = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999';
const ERR_TEXT = 'Something went wrong in this tool. Reload the page; if it happens again, tell your instructor what you were doing.';
// window.origin is the SERIALIZED SECURITY origin ('null' in opaque contexts such as a sandboxed preview iframe);
// location.origin is computed from the URL and stays 'https://…' even when the document is sandboxed, which would
// misgate every opaque chain. Replies are origin-addressed per hop, never '*' when an origin exists.
const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '') ? window.origin : '*';
// ── END CONSTANTS ─────────────────────────────────────────────

// ── HELPERS ───────────────────────────────────────────────────
// Show a message in the "Unpacking..." corner badge (gone once the page is swapped in).
function setStatus(msg) { const loading = document.getElementById('__bundler_loading'); if (loading) loading.textContent = msg; }
// Base64 text of a byte array, encoded B64_CHUNK bytes at a time.
function toBase64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += B64_CHUNK) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + B64_CHUNK));
  }
  return btoa(bin);
}
// True if a message event comes from an origin this document may trust: its own origin (https chains; opaque ==
// opaque), or the file:// pairing. Chrome serializes a file document's origin as 'file://' while the blob: documents it
// mints serialize as 'null', so the two legitimate shapes can never string-match; the pair is accepted in both
// directions. https origins never serialize as either, and sender identity (own child frame / direct parent) is
// checked separately.
function trustedOrigin(e) {
  if (e.origin === window.origin) return true;
  return (
    (e.origin === 'null' &&
      (window.origin === 'file://' ||
        window.location.protocol === 'file:')) ||
    (/^file:/.test(e.origin) && window.origin === 'null')
  );
}
// ── END HELPERS ───────────────────────────────────────────────

// ── ERROR SINK ────────────────────────────────────────────────
// An uncaught error shows one plain sentence on the page; the detail goes to the console only (SEC-DL-007). Failed
// resource loads (CSP-blocked links, scripts, images) fire plain events at the element and only warn; real JS errors
// carry message/error. The listener is on window, so it survives the document swap.
function onError(e) {
  if (!e.message && !e.error && e.target && e.target !== window) {
    console.warn('[bundle] resource failed to load:',
      e.target.tagName, String(e.target.src || e.target.href || ''));
    return;
  }
  console.error('[bundle] ' + (e.message || e.type) +
    (e.filename ? ' (' + e.filename.slice(0, ERR_FILE_CHARS) + ':' + e.lineno + ')' : ''), e.error || '');
  const p = document.body || document.documentElement;
  const d = document.getElementById(ERR_ID) || p.appendChild(document.createElement('div'));
  d.id = ERR_ID;
  d.setAttribute('role', 'alert');
  d.style.cssText = ERR_STYLE;
  d.textContent = ERR_TEXT;
}
// ── END ERROR SINK ────────────────────────────────────────────

// ── STARTUP ───────────────────────────────────────────────────
// Unpack and render the page once the shell document has loaded.
async function start() {
  window.addEventListener('error', onError, true);
  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }
    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // ── 4.1 NESTED-PAGE RELAY ─────────────────────────────────────
    // Nested page bundles (iframe targets) ship ONCE, in the ROOT document's manifest; frame srcs carry an
    // about:blank#<uuid> marker instead of a substitutable uuid. Every document mints the blobs for its OWN frames,
    // from local text at the root or from text its DIRECT parent sends over this relay, so each frame navigation
    // stays same-origin with its initiator and a deduped page loads at any depth on any host, including a file://
    // download's opaque origins (where a blob minted by one document cannot be navigated to by another).
    // Protocol: a document only ever SENDS to its direct parent and only ACCEPTS text from that parent; requests from
    // below are honored only for its own child frames, and the ROOT never sends upward. That last rule is
    // load-bearing: a host may let another site frame the page, so window.top can be a FOREIGN document, and a
    // top-addressed protocol would hand page uuids to it and accept forged "page text" from it. Both directions are
    // origin-gated (trustedOrigin); in opaque contexts, where every origin serializes as 'null', an embedded
    // EXTERNAL frame still fails the gate by carrying its own real origin, and a sandboxed child of such a frame is
    // excluded by the own-child-frames check plus uuid unguessability. Deny by default: one request form, one reply
    // form, no error replies.
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};
    // Non-empty only in the root document (nested bundles ship an empty island), so it doubles as the root marker:
    // the root answers from local text and treats a miss as authoritative, never relaying to its (possibly foreign)
    // parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    // Point frame el at a blob of page text (with the page's #fragment).
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    // Page text arrived: mount it in this document's waiting frames and pass it down to waiting child frames.
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    // Windows of this document's own iframes.
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    // Relay messages: a child frame's request for page text, or the direct parent's reply. The origin gate comes
    // first; the structural checks (own child frames for requests, direct parent and a solicited uuid for replies,
    // the root's never-relay rule) are what hold in fully opaque chains where origin strings cannot discriminate.
    function onMessage(e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a request spray; past the cap (far above any
        // real page count) new relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= RELAY_MAX) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited check below uses the in operator, which
        // matches prototype keys ('__proto__', 'constructor'), so an unshaped key would reach deliverPage and throw,
        // painting the error banner. Text is accepted only from the direct parent, the document that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    }
    window.addEventListener('message', onMessage);
    // ── END 4.1 NESTED-PAGE RELAY ─────────────────────────────────

    // ── 4.2 UNPACK ────────────────────────────────────────────────
    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');
    // Bytes of a gzip-compressed asset, inflated.
    async function gunzip(bytes) {
      const ds = new DecompressionStream('gzip');
      const writer = ds.writable.getWriter();
      const reader = ds.readable.getReader();
      writer.write(bytes);
      writer.close();
      const chunks = [];
      let totalLen = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        totalLen += value.length;
      }
      const out = new Uint8Array(totalLen);
      let offset = 0;
      for (const chunk of chunks) { out.set(chunk, offset); offset += chunk.length; }
      return out;
    }
    // Decode one manifest asset: a nested page becomes text, a font a data: URL (strict hosts allow font-src data:
    // but not blob:), anything else a blob: URL. A broken asset becomes an empty blob, so the page still renders.
    async function unpack(uuid) {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') finalBytes = await gunzip(bytes);
          else console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
        }
        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }
    await Promise.all(uuids.map(unpack));
    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }
    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs; consumers read these Blobs directly.
    // Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;
    // ── END 4.2 UNPACK ────────────────────────────────────────────

    // ── 4.3 RENDER ────────────────────────────────────────────────
    setStatus('Rendering...');
    // Page uuids have no blob here: they ride inside about:blank#<uuid> frame markers resolved after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }
    // Strip integrity + crossorigin: blob URLs from a file:// document inherit a null origin, so crossorigin forces a
    // CORS fetch that SRI then rejects. The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');
    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script would push the parser into quirks mode.
    // DOMParser always emits a <head> (synthesizing one if the source HTML omitted it) but may carry attributes
    // through, so match the full opening tag. slice() rather than replace() keeps clear of $-pattern substitution.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }
    // Parse the template and swap the root element. Scripts inserted via DOMParser/replaceWith are inert per spec;
    // 4.4 re-creates each one so it runs.
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    // Resolve page-frame markers: mint this document's own blob for each framed page, from local text when this is
    // the root, otherwise by asking the direct parent over the relay (4.1). An unanswered request leaves the frame on
    // about:blank, the same degraded state as a refused embed.
    const needed = [];
    for (const el of Array.from(document.querySelectorAll('iframe'))) {
      const m = FRAME_MARKER.exec(el.getAttribute('src') || '');
      if (!m) continue;
      const text = pageTexts[m[1]];
      if (typeof text === 'string') {
        mountPage(el, m[2] || '', text);
      } else if (window.parent !== window && !isPageRoot) {
        const had = pendingFrames[m[1]];
        (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
        if (!had) needed.push(m[1]);
      }
    }
    for (const uuid of needed) {
      window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
    }
    // ── END 4.3 RENDER ────────────────────────────────────────────

    // ── 4.4 SCRIPTS ───────────────────────────────────────────────
    // Re-create each script with createElement so it executes, awaiting onload for src scripts to keep their order.
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags does XHR against the src, but blob:null/
      // from a file:// origin is silently dropped; an inline babel script is handled unconditionally.
      if (BABEL_TYPES.includes(s.type) && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded, which fired before the document was
    // swapped. Trigger it manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
    // ── END 4.4 SCRIPTS ───────────────────────────────────────────
  } catch (err) {
    setStatus('Could not start the tool. Reload the page.');
    console.error('Bundle unpack error:', err);
  }
}
document.addEventListener('DOMContentLoaded', start);
// ── END STARTUP ───────────────────────────────────────────────
})();
  </script>
