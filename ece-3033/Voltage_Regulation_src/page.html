<!DOCTYPE html>
<!--
  Voltage Regulation — ECE 3033 Lecture 3
  Version: v2.0.0
  Released: not released (build for principal review, 2026-11-24)
  Author: Claude Code. Owner: Douglas Jussaume, University of Tulsa ECE.
  Changelog: v2.0.0 — redesign to the 2026-11-24 design (spec Voltage_Regulation_v2.0.0_spec.md): narrated lecture of
  8 slides (55 voiced lines), Lab tab and Experiments tab (E1–E5). Built from Voltage_Regulation_src/ with build.py.
  v1.2.0 — three-slide interactive lecture (demo release 2026-11-22).
  Model: three-phase, Y, 2.5 MVA, 4160 V, 60 Hz, R_A = 0.12 Ω, X_S = 6.2 Ω per phase (Lab: 3.1 / 6.2 / 9.3 Ω, R_A in
  or ignored). Per phase, V_φ = 4160/√3 V at full load is the reference; I_A = S/(3 V_φ) at the load power factor,
  kept unrounded. E_A = V_φ + R_A I_A + jX_S I_A. The field and the speed are held at the full-load setting (no voltage
  regulator, no saturation, steady state), so V_nl = |E_A| and VR = (|E_A| − |V_φ|) / |V_φ| × 100 %.
  Field ratio I_F/I_F,nl = |E_A|/|V_φ| (unsaturated). P_max = 3 |V_φ| |E_A| / X_S. Angles in degrees; a negative
  current angle is lagging.
  Narration: en-GB-SoniaNeural, rate −4 %, one mp3 clip per line (mono, 24 kHz, 32 kbit/s), embedded as data.
-->
