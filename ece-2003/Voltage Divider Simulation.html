<!DOCTYPE html>
<!--
  Voltage Divider Simulation
  Version:   1.0.4
  Released:  2026-09-29
  Owner:     Design (EE Interactive Teaching Simulations)
  Changelog:
    1.0.4 — Preset buttons spaced 14 px below the R2 / wiper slider.
    1.0.3 — Layout (customer screenshot, 2026-09-29): schematic view widened left (x0 −0.9 → −2.3) so the Vin label
            is not clipped; first/last log-axis tick labels edge-aligned so "10 MΩ" and "10³" stay inside the panel;
            equation-strip separators use em spaces (HTML collapsed the runs of spaces).
    1.0.2 — rich() recurses into captured text so <b>V<sub>out</sub></b> in the equation strip renders as markup, not literal tags.
    1.0.1 — si(): trailing-zero strip applied only after a decimal point (100 kΩ read "1 kΩ"); syncControls()
            scopes aria-pressed to the sidebar so the Tweaks accent swatch ring persists; --vout token declared in :root.
    1.0.0 — Initial release. Circuit per uploads/divider.tex (source left, R1/R2 right, node, output
            terminals, ground). Fixed-resistor and potentiometer modes, optional load RL, animated charge
            flow (speed and density follow I), wire potential shading, resistor heat glow by I²R, analog
            Vout gauge, transfer curve Vout/Vin vs R2/R1, loading curve Vout vs RL with the Rth marker,
            I²R power bars, equation strip with live substitution, Tutorial and Experiments pages, Tweaks.
  Model:     DC, ideal source, linear resistors. Rp = R2∥RL (RL open when load is off); I = Vin/(R1+Rp);
             Vout = I·Rp; Rth = R1∥R2; Vth = Vin·R2/(R1+R2); loading error = Rth/(RL+Rth).
             Potentiometer: R1 = (1−α)·Rpot, R2 = α·Rpot. Animation speed is a monotone function of I and
             is a cue only, not to scale.
  Standards: IEEE Std 315-1975 / IEC 60617 (graphic symbols for electrical diagrams);
             IEC 60063 (E-series preferred resistor values used by the presets)
-->

<script>
'use strict';
/* ═══ TABLE OF CONTENTS ═══
    1. CONSTANTS
    2. STATE & PERSISTENCE
    3. THEME
    4. DOM HELPERS & FORMATTING
    5. MODEL            solve() — divider with optional load
    6. CIRCUIT VIEW     symbols, potential shading, charge flow, gauge
    7. AUX PANELS       transfer curve, loading curve, power bars
    8. READOUTS / EQUATION STRIP / HUD
    9. SIDEBAR & UI BINDING
   10. TUTORIAL & EXPERIMENTS
   11. TWEAKS PANEL
   12. MAIN LOOP & BOOT
*/

/* ═══ 1. CONSTANTS ═══ */
const LS_STATE = 'vdiv_v1', LS_TWEAKS = 'vdiv_tweaks_v1';
const R_LOG_MIN = 0, R_LOG_MAX = 6;          // slider decades: 1 Ω … 1 MΩ
const RL_LOG_MIN = 0, RL_LOG_MAX = 7;        // 1 Ω … 10 MΩ
const SLIDER_STEPS = 1000;
const VIN_MAX = 24;
const I_LOG_LO = -6, I_LOG_HI = 0;           // animation speed maps log10(I) over 1 µA … 1 A
const FLOW_MIN_FRAC = 0.04, FLOW_MAX_FRAC = 0.9;   // loop fraction per second at the two ends of the map
const DOTS_PER_UNIT = 1.1;                   // charge dots per circuit unit of path at full share
const DOT_R = 3.2;
const GLOW_MAX_BLUR = 26;                    // px, resistor heat glow at the hottest resistor

/* ═══ 7. AUX PANELS ═══ */
function auxFrame(cv, title) {
  const { ctx, w, h } = fit(cv);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, w, h);
  ctx.font = sans(10, 800); ctx.fillStyle = COL.mut; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(title.toUpperCase(), 10, 8);
  return { ctx, w, h, L: AUX_L, T: AUX_T, pw: w - AUX_L - AUX_R, ph: h - AUX_T - AUX_B };
}
function hGrid(ctx, x0, x1, y, lbl) {
  ctx.strokeStyle = COL.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  ctx.fillStyle = COL.mut2; ctx.font = mono(9, 500); ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(lbl, x0 - 5, y);
}
function vGrid(ctx, x, y0, y1, lbl, align) {
  ctx.strokeStyle = COL.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
  ctx.fillStyle = COL.mut2; ctx.font = mono(9, 500); ctx.textAlign = align || 'center'; ctx.textBaseline = 'top'; ctx.fillText(lbl, x, y1 + 5);
}
function marker(ctx, x, y, col) {
  ctx.fillStyle = col; ctx.strokeStyle = COL.bg; ctx.lineWidth = 2; ctx.shadowColor = col; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
}
// Vout/Vin vs R2/R1 (log axis), unloaded (dashed) and loaded (solid) curves, marker at the operating point.
function drawXfer(st) {
  const f = auxFrame($('cvXfer'), 'Transfer  Vout / Vin  vs  R2 / R1'), { ctx, L, T, pw, ph } = f;
  if (ph < 20) return;
  const X = r => L + (Math.log10(r) - XFER_LOG_LO) / (XFER_LOG_HI - XFER_LOG_LO) * pw, Y = v => T + (1 - v) * ph;
  for (const v of [0, 0.25, 0.5, 0.75, 1]) hGrid(ctx, L, L + pw, Y(v), v.toFixed(2));
  for (let e = XFER_LOG_LO; e <= XFER_LOG_HI; e++) vGrid(ctx, X(Math.pow(10, e)), T, T + ph, e === 0 ? '1' : '10' + (e < 0 ? '⁻' : '') + '⁰¹²³⁴⁵⁶⁷⁸⁹'[Math.abs(e)], e === XFER_LOG_LO ? 'left' : e === XFER_LOG_HI ? 'right' : 'center');
  ctx.save(); ctx.beginPath(); ctx.rect(L, T, pw, ph); ctx.clip();
  const curve = (fn, col, dash) => {
    ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.setLineDash(dash || []); ctx.beginPath();
    for (let k = 0; k <= 200; k++) { const r = Math.pow(10, XFER_LOG_LO + (XFER_LOG_HI - XFER_LOG_LO) * k / 200), y = Y(fn(r)); k ? ctx.lineTo(X(r), y) : ctx.moveTo(X(r), y); }
    ctx.stroke(); ctx.setLineDash([]);
  };
  curve(r => r / (1 + r), P.load ? COL.mut2 : COL.acc, P.load ? [4, 4] : null);
  if (P.load) curve(r => { const R2 = r * st.R1, Rp = R2 * st.RL / (R2 + st.RL); return Rp / (st.R1 + Rp); }, COL.acc);
  ctx.restore();
  const r = st.R2 / st.R1;
  marker(ctx, Math.max(L, Math.min(L + pw, X(r))), Y(st.Vin > 0 ? st.Vout / st.Vin : 0), potCol(st.Vout, st.Vin));
  ctx.font = mono(10, 700); ctx.fillStyle = COL.txt; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText('R2/R1 = ' + r.toPrecision(3) + (P.load ? '  (dashed: unloaded)' : ''), L + pw, T + 4);
}
// Vout vs RL (log axis) for the present R1, R2: Vout = Vth·RL/(RL+Rth); Rth marker where Vout = Vth/2.
function drawLoad(st) {
  const f = auxFrame($('cvLoad'), 'Loading  Vout  vs  RL   (Vth = ' + si(st.Vth, 'V') + ', Rth = ' + si(st.Rth, 'Ω') + ')'), { ctx, L, T, pw, ph } = f;
  if (ph < 20) return;
  const lo = RL_LOG_MIN, hi = RL_LOG_MAX, X = r => L + (Math.log10(r) - lo) / (hi - lo) * pw, top = Math.max(st.Vth, 1e-9), Y = v => T + (1 - v / top) * ph;
  for (const v of nice(0, top, 4)) hGrid(ctx, L, L + pw, Y(v), si(v, 'V', 2));
  for (let e = lo; e <= hi; e++) vGrid(ctx, X(Math.pow(10, e)), T, T + ph, si(Math.pow(10, e), 'Ω', 1), e === lo ? 'left' : e === hi ? 'right' : 'center');
  ctx.save(); ctx.beginPath(); ctx.rect(L, T, pw, ph); ctx.clip();
  ctx.strokeStyle = COL.acc; ctx.lineWidth = 2.5; ctx.beginPath();
  for (let k = 0; k <= 200; k++) { const R = Math.pow(10, lo + (hi - lo) * k / 200), v = st.Vth * R / (R + st.Rth); k ? ctx.lineTo(X(R), Y(v)) : ctx.moveTo(X(R), Y(v)); }
  ctx.stroke();
  ctx.strokeStyle = COL.mut2; ctx.setLineDash([3, 4]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(X(st.Rth), T); ctx.lineTo(X(st.Rth), T + ph); ctx.moveTo(L, Y(st.Vth / 2)); ctx.lineTo(L + pw, Y(st.Vth / 2)); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  ctx.font = mono(9, 600); ctx.fillStyle = COL.mut; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText('RL = Rth → Vth/2', Math.min(X(st.Rth) + 5, L + pw - 90), T + ph - 3);
  if (P.load) {
    marker(ctx, X(Math.max(Math.pow(10, lo), Math.min(Math.pow(10, hi), st.RL))), Y(st.Vout), potCol(st.Vout, st.Vin));
    ctx.font = mono(10, 700); ctx.fillStyle = COL.txt; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText('drop ' + (100 * st.err).toFixed(1) + ' %', L + pw, T + 4);
  } else {
    ctx.font = mono(10, 700); ctx.fillStyle = COL.mut; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText('connect RL to place the operating point', L + pw, T + 4);
  }
}
// Power bars P1, P2, PL (+ total from the source) with values.
function drawPow(st) {
  const f = auxFrame($('cvPow'), 'Power  I²R   Σ = ' + si(st.Pt, 'W')), { ctx, L, T, pw, ph } = f;
  if (ph < 20) return;
  const bars = [['R1', st.P1, COL.vhi], ['R2', st.P2, COL.vlo]];
  if (P.load) bars.push(['RL', st.PL, COL.good]);
  const top = Math.max(st.Pt, 1e-12), Y = p => T + (1 - p / top) * ph;
  for (const v of nice(0, top, 3)) hGrid(ctx, L, L + pw, Y(v), si(v, 'W', 2));
  const n = bars.length, bw = pw / n * 0.5;
  bars.forEach(([lbl, p, col], k) => {
    const cx = L + pw * (k + 0.5) / n, y = Y(p);
    ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 12; ctx.fillRect(cx - bw / 2, y, bw, T + ph - y); ctx.shadowBlur = 0;
    ctx.font = mono(10, 700); ctx.fillStyle = COL.txt; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(si(p, 'W'), cx, Math.min(y - 3, T + ph - 14));
    ctx.fillStyle = COL.mut; ctx.textBaseline = 'top'; ctx.fillText(lbl + (st.Pt > 0 ? '  ' + (100 * p / st.Pt).toFixed(0) + '%' : ''), cx, T + ph + 5);
  });
  if (P.load) {
    ctx.font = mono(10, 700); ctx.fillStyle = COL.good; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText('η to load ' + (st.Pt > 0 ? (100 * st.PL / st.Pt).toFixed(1) : '0') + ' %', L + pw, T + 4);
  }
}

  ['h2', '3. Loading and the Thévenin equivalent'],

  ['eq', 'V<sub>out</sub> = V<sub>th</sub> · R<sub>L</sub> / (R<sub>L</sub> + R<sub>th</sub>)          relative drop = R<sub>th</sub> / (R<sub>L</sub> + R<sub>th</sub>)', 'R<sub>L</sub> = R<sub>th</sub> halves the output; R<sub>L</sub> = 10·R<sub>th</sub> drops it 9.1 %; R<sub>L</sub> = 100·R<sub>th</sub> drops it 0.99 %.'],

  ['eq', 'P<sub>1</sub> = I²R<sub>1</sub>     P<sub>2</sub> = V<sub>out</sub>²/R<sub>2</sub>     P<sub>L</sub> = V<sub>out</sub>²/R<sub>L</sub>     P<sub>source</sub> = V<sub>in</sub>·I = P<sub>1</sub> + P<sub>2</sub> + P<sub>L</sub>', 'Energy conservation: the bars in the Power panel always sum to the source power.'],
  ['p', 'A divider is a poor way to power anything: the efficiency P<sub>L</sub>/P<sub>source</sub> is at most the ratio itself, and only in the limit where R<sub>2</sub> is removed. Its proper use is a reference or sense point feeding a high-impedance input.'],
  ['h2', '5. Potentiometer'],
  ['p', 'A potentiometer is a single resistor R<sub>pot</sub> with a sliding contact at fraction α of its length: R<sub>1</sub> = (1−α)·R<sub>pot</sub>, R<sub>2</sub> = α·R<sub>pot</sub>, so V<sub>out</sub> = α·V<sub>in</sub> — linear in the wiper position while the output is open. Loading bends the relation (§3), and the effect is strongest near α = 0.5 where R<sub>th</sub> = R<sub>pot</sub>/4 is largest.'],
  ['h2', '6. Sensitivity'],

  { t: 'Ratio, not size', s: { Vin: 12, R1: 1e3, R2: 1e3, mode: 'fixed', load: false }, d: 'Start at 1 kΩ / 1 kΩ. Now set R<sub>1</sub> and R<sub>2</sub> both to 10 kΩ, then both to 100 kΩ.', o: 'V<sub>out</sub> stays at 6.00 V. I falls 6.00 mA → 600 µA → 60.0 µA and the total power 72.0 mW → 7.20 mW → 720 µW. The charge dots slow and thin; the glow fades.' },
  { t: 'Loading at R<sub>L</sub> = R<sub>th</sub>', s: { Vin: 12, R1: 10e3, R2: 10e3, mode: 'fixed', load: true, RL: 5e3 }, d: 'R<sub>th</sub> = 10 kΩ ∥ 10 kΩ = 5 kΩ. The load is set exactly to R<sub>th</sub>.', o: 'V<sub>out</sub> = 3.00 V, half of V<sub>th</sub> = 6.00 V; the loading marker sits on the crossing of the dashed lines. Load drop reads 50 %.' },
  { t: 'The 10× and 100× rules', s: { Vin: 12, R1: 10e3, R2: 10e3, mode: 'fixed', load: true, RL: 50e3 }, d: 'R<sub>L</sub> = 50 kΩ = 10·R<sub>th</sub>. Then raise R<sub>L</sub> to 500 kΩ.', o: 'Drop 9.09 % (V<sub>out</sub> = 5.45 V), then 0.99 % (5.94 V). The relative drop is R<sub>th</sub>/(R<sub>L</sub>+R<sub>th</sub>) regardless of V<sub>in</sub>.' },
  { t: 'Design 5 V → 3.3 V for a 10 kΩ input', s: { Vin: 5, R1: 1e3, R2: 2e3, mode: 'fixed', load: true, RL: 10e3 }, d: 'The E24 pair 1.0 kΩ / 2.0 kΩ gives 3.33 V open. Connect the 10 kΩ input.', o: 'V<sub>out</sub> = 3.13 V (drop 6.25 %; R<sub>th</sub> = 667 Ω). Scale both resistors down by 10 (100 Ω / 200 Ω): drop 0.66 %, but I rises to 16.9 mA and P<sub>R2</sub> to 55 mW. Scale is the trade.' },
  { t: 'Heat', s: { Vin: 24, R1: 100, R2: 100, mode: 'fixed', load: false }, d: '24 V across 100 Ω + 100 Ω.', o: 'I = 120 mA; each resistor dissipates 1.44 W — far above a ¼ W part. The pill warns and both resistors glow. Raise the resistors until the pill clears (≥ 580 Ω each keeps each below 0.25 W: 24²/(4·580) = 0.248 W).' },
  { t: 'Potentiometer under load', s: { Vin: 10, mode: 'pot', Rpot: 10e3, alpha: 50, load: true, RL: 10e3 }, d: 'Sweep α from 0 to 100 % with R<sub>L</sub> = R<sub>pot</sub>. Then set the output open and sweep again.', o: 'Open: V<sub>out</sub> = α·V<sub>in</sub>, a straight line. Loaded: V<sub>out</sub> sags below the line, worst at α = 50 % where R<sub>th</sub> = 2.5 kΩ and the drop is 20 % (4.00 V instead of 5.00 V).' }
];
function buildTutorial() {
  const b = $('tutBody');
  for (const [k, a, note] of TUTORIAL) {
    if (k === 'h1') b.appendChild(rich('h1', null, a));
    else if (k === 'sub') b.appendChild(rich('p', 'sub', a));
    else if (k === 'h2') b.appendChild(rich('h2', null, a));
    else if (k === 'p') b.appendChild(rich('p', null, a));
    else if (k === 'eq') { const box = el('div', 'eq-box'); box.appendChild(rich('div', 'eq', a)); if (note) box.appendChild(rich('div', 'eq-note', note)); b.appendChild(box); }
    else if (k === 'ul' || k === 'ol') { const l = el(k); for (const it of a) l.appendChild(rich('li', null, it)); b.appendChild(l); }
    else if (k === 'table') {
      const t = el('table', 'tut-table'), th = el('tr'); for (const c of a[0]) th.appendChild(rich('th', null, c)); t.appendChild(th);
      for (const row of a.slice(1)) { const tr = el('tr'); for (const c of row) tr.appendChild(rich('td', null, c)); t.appendChild(tr); } b.appendChild(t);
    }
  }
  const foot = el('div', 'exp-foot'); const go = el('button', 'nav-btn', 'Go to experiments →'); go.addEventListener('click', () => showPage('expPage')); foot.appendChild(go); b.appendChild(foot);
}
function buildExperiments() {
  const b = $('expBody');
  b.appendChild(rich('h1', null, 'Experiments'));
  b.appendChild(rich('p', 'sub', 'Each card loads its settings into the Sim tab. Stated results are the closed-form values from §1 and §3 of the Tutorial.'));
  EXPERIMENTS.forEach((x, k) => {
    const c = el('div', 'exp-card');
    c.appendChild(el('div', 'exp-num', 'Experiment ' + (k + 1)));
    c.appendChild(rich('h3', null, x.t)); c.appendChild(rich('p', null, x.d)); c.appendChild(rich('p', 'obs', 'Observe: ' + x.o));
    const f = el('div', 'exp-foot'), go = el('button', 'nav-btn', 'Load settings & open Sim');
    go.addEventListener('click', () => { Object.assign(P, x.s); changed(); showPage('simPage'); });
    f.appendChild(go); c.appendChild(f); b.appendChild(c);
  });
}

/* ═══ 11. TWEAKS PANEL ═══ */
function setTweak(k, v) { TW[k] = v; saveTweaks(); applyTheme(); renderTweaks(); }
function renderTweaks() {
  const body = $('twkBody'); clear(body);
  for (const it of TWEAK_SPEC) {
    if (it.sec) { body.appendChild(el('div', 'twk-sec', it.sec)); continue; }
    if (it.type === 'color') {
      const row = el('div', 'twk-row'); row.appendChild(el('span', null, it.label)); const sws = el('div', 'sws');
      for (const c of it.options) { const b = el('button', 'sw'); b.style.background = c; b.style.color = c; b.setAttribute('aria-label', it.label + ' ' + c); b.setAttribute('aria-pressed', TW[it.k] === c ? 'true' : 'false'); b.addEventListener('click', () => setTweak(it.k, c)); sws.appendChild(b); }
      row.appendChild(sws); body.appendChild(row);
    } else if (it.type === 'radio') {
      const row = el('div', 'twk-row col'); row.appendChild(el('span', null, it.label)); const seg = el('div', 'seg-btns'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', it.label);
      for (const o of it.options) { const b = el('button', TW[it.k] === o ? 'active' : '', o); b.setAttribute('aria-pressed', TW[it.k] === o ? 'true' : 'false'); b.addEventListener('click', () => setTweak(it.k, o)); seg.appendChild(b); }
      row.appendChild(seg); body.appendChild(row);
    } else if (it.type === 'slider') {
      const row = el('div', 'twk-row col'), lbl = el('div', 'lbl'); lbl.appendChild(el('span', null, it.label)); lbl.appendChild(el('span', 'val', TW[it.k] + ' ' + it.unit));
      const inp = el('input'); inp.type = 'range'; inp.min = it.min; inp.max = it.max; inp.step = it.step; inp.value = TW[it.k]; inp.setAttribute('aria-label', it.label);
      inp.addEventListener('input', () => { TW[it.k] = +inp.value; lbl.lastChild.textContent = inp.value + ' ' + it.unit; applyTheme(); });
      inp.addEventListener('change', saveTweaks);
      row.appendChild(lbl); row.appendChild(inp); body.appendChild(row);
    } else if (it.type === 'toggle') {
      const row = el('div', 'twk-row'); row.appendChild(el('span', null, it.label));
      const b = el('button', 'tg'); b.setAttribute('role', 'switch'); b.setAttribute('aria-checked', TW[it.k] ? 'true' : 'false'); b.setAttribute('aria-label', it.label);
      b.addEventListener('click', () => setTweak(it.k, !TW[it.k])); row.appendChild(b); body.appendChild(row);
    }
  }
}
function toggleTweaks() { const p = $('tweaks'), open = !p.classList.contains('open'); p.classList.toggle('open', open); $('tweaksBtn').setAttribute('aria-expanded', open ? 'true' : 'false'); }

/* ═══ 12. MAIN LOOP & BOOT ═══ */
let last = performance.now(), saveT = 0;
// Flow speed in loop fractions per second: log map of I over [1 µA, 1 A], times the user multiplier.
function flowRate(I) {
  if (I <= 0) return 0;
  const u = Math.max(0, Math.min(1, (Math.log10(I) - I_LOG_LO) / (I_LOG_HI - I_LOG_LO)));
  return (FLOW_MIN_FRAC + (FLOW_MAX_FRAC - FLOW_MIN_FRAC) * u) * P.spd;
}
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (curPage === 'simPage') {
    const st = state();
    if (P.run && TW.flow && st.I > 0) { phase = (phase + flowRate(st.I) * dt) % 1; saveT += dt; if (saveT > 2) { saveT = 0; saveLS(); } }
    if (dirty) { drawXfer(st); drawLoad(st); drawPow(st); updateReadouts(st); dirty = false; }
    drawCircuit(st);
  }
  requestAnimationFrame(frame);
}
function boot() {
  loadLS(); loadTweaks();
  buildTutorial(); buildExperiments(); bindUI(); renderTweaks();
  applyTheme(); syncControls(); showPage(curPage);
  requestAnimationFrame(frame);
}
boot();
</script>
