  Power Divider Designer
  Version: v2.0.0
  Released: 2026-10-28
  Changelog:
    v2.0.0 - Wilkinson Power Divider Designer v1.0.0 rebuilt as the Power Divider Designer (briefing 2026-10-28 rev 1): vanilla JS, one offline file, light theme default with a dark toggle. Topologies: Wilkinson (equal N-way star, unequal 2-way, 1-4 binomial or Chebyshev sections; unequal multisection with tapered arms and output transformers), lossless T-junction (optional lambda/4 transformers), resistive Y and Delta, and the N-way branching tree (any N, a module and ratio per junction: Wilkinson, branching line or resistive Y; uniform or cosine-on-pedestal output taper). Isolation resistors by even/odd-mode minimax over the S11 <= -20 dB band (checked against Cohn), refined with the full solver for unequal splits (D1); bandwidths of every port, the narrowest as the usable bandwidth (D5); phase of every output and the imbalance (D4); microstrip relabelled Pozar (Wheeler) with Hammerstad-Jensen + Kirschning-Jansen as an option (D6); corrected mismatch text (D2). To-scale layout as the centrepiece: true widths and lengths, 0402/0603 pads, launches, scale bar, hover shared with the schematic, growth animation, power-flow overlay, binary or H-tree placement with interconnects and delay lines for equal paths; straight, arc (ring), meander and mitred sections held at lambda_g/4 along the centreline, with radius and spacing warnings, footprint and saving, side-by-side with straight. Input power in W or dBm, output power in W, dBm and % solved beside ideal, width-vs-ratio plot and minimum-width flag. Performance page (plot, markers, range, phase, pinned comparison, power flow at f0 and the marker, S-matrix checks, three-port theorem, tree vs direct N-way), Parameters page (build sheet, CSV, print), Theory, Experiments and an in-page Tests page. SMA connectors (edge launch at the board edge, vertical inside an H-tree) and a 3D view of the board (orbit, zoom, height exaggeration); the two outputs of every 2-way stage leave the output node as separate lines.
  Author: Claude Code
  References: D. M. Pozar, Microwave Engineering, 4th ed., Wiley, 2012 (§3.8, §5.6-5.8, §7.1-7.3);
    E. J. Wilkinson, "An N-way hybrid power divider," IRE Trans. MTT 8(1), 1960;
    S. B. Cohn, "A class of broadband three-port TEM-mode hybrids," IEEE Trans. MTT 16(2), 1968;
    E. Hammerstad, O. Jensen, "Accurate models for microstrip computer-aided design," IEEE MTT-S Digest, 1980;
    M. Kirschning, R. H. Jansen, Electron. Lett. 18(6), 1982; R. J. P. Douville, D. S. James, IEEE Trans. MTT 26(3), 1978;
    briefing 2026-10-28_ClaudeCode_briefing_PowerDividerDesigner_v2.0.0 (rev 1).

/* ── THEMES ── light is the default (dark text on white); dark is a toggle (D8) */
:root{
  --bg:#ffffff; --bg2:#f1f4f8; --panel:#f7f9fc; --line:#c3cad5; --txt:#111827; --mut:#4b5563; --focus:#1d4ed8;
  --board:#e6eedf; --board-edge:#b9c8a8; --cu:#b8742f; --cu-hi:#1d4ed8; --res:#1f2937; --pad:#c99a3d;
  --s11:#b45309; --s21:#15803d; --s31:#1d4ed8; --s23:#6d28d9; --sR:#6d28d9; --loss:#6b7280; --bad:#b91c1c; --warn:#b45309; --ok:#15803d;
}
body.dark{
  --bg:#0f1218; --bg2:#161b22; --panel:#1c222b; --line:#2f3845; --txt:#e6ebf2; --mut:#a7b1c2; --focus:#ffd479;
  --board:#15261b; --board-edge:#2c4634; --cu:#e0a35c; --cu-hi:#7cc4ff; --res:#d1d5db; --pad:#e0b866;
  --s11:#ffb02e; --s21:#3ddc84; --s31:#60a5fa; --s23:#c4b5fd; --sR:#c4b5fd; --loss:#9ca3af; --bad:#ff8a80; --warn:#ffb02e; --ok:#3ddc84;
}
*{ box-sizing:border-box; margin:0; padding:0 }
html,body{ height:100% }
body{ background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; line-height:1.35;
  display:flex; flex-direction:column; overflow:hidden }
.num, input, table.sheet td, .mono{ font-family:'IBM Plex Mono','DejaVu Sans Mono',Menlo,Consolas,ui-monospace,monospace }
button,input,select{ font:inherit; color:inherit }
button,select{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:.2em .55em; cursor:pointer; min-height:28px }
button:hover,select:hover{ border-color:var(--mut) }
button[aria-pressed="true"]{ background:var(--txt); color:var(--bg); border-color:var(--txt) }
button.wide{ width:100% }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px }
input[type=text],input[type=number]{ background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:.1em .35em; width:6.2em; font-size:13px }
input.invalid{ border-color:var(--bad); outline:2px solid var(--bad) }
input[type=range]{ flex:1; min-width:80px; accent-color:var(--txt) }
.math{ font-family:'Cambria Math','STIX Two Math','Latin Modern Math','Times New Roman',serif; font-size:1.08em }
.math i{ font-style:italic } .math sub,.math sup{ font-style:normal; font-size:.75em }
.hint{ color:var(--mut); font-size:12px } .mut{ color:var(--mut) } .bad{ color:var(--bad) } .okc{ color:var(--ok) }
.warnline{ color:var(--warn); font-size:12px; overflow-wrap:anywhere }
/* ── TOP BAR ── */
#top{ flex:none; display:flex; align-items:center; gap:12px; padding:6px 12px; border-bottom:1px solid var(--line); background:var(--bg2); flex-wrap:wrap }
#brand{ font-weight:700; font-size:16px; white-space:nowrap } #ver{ color:var(--mut); font-size:12px }
#tabs{ display:flex; margin-right:auto; flex-wrap:wrap } #tabs button{ border-radius:0; font-weight:600 } #tabs button:first-child{ border-radius:6px 0 0 6px } #tabs button:last-child{ border-radius:0 6px 6px 0 }
#tabs button[aria-selected="true"]{ background:var(--txt); color:var(--bg); border-color:var(--txt) }
.page{ display:none; flex:1; min-height:0 } .page.on{ display:flex }
.scroll{ overflow-y:auto; display:none; flex:1; min-height:0 } .scroll.on{ display:block }
/* ── DESIGNER ── sidebar | layout (2D or 3D) over the outputs */
#side{ flex:none; width:310px; overflow-y:auto; border-right:1px solid var(--line); padding:8px 12px 20px; display:flex; flex-direction:column; gap:10px; background:var(--panel) }
.grp h3{ font-size:12px; letter-spacing:.06em; color:var(--mut); margin-bottom:4px; font-weight:700 }
.row{ display:flex; align-items:center; gap:6px; margin:3px 0 } .row.wrap{ flex-wrap:wrap } .row label, .row .lbl{ flex:1; min-width:6.5em } .unit{ color:var(--mut); font-size:12px }
.seg{ display:inline-flex; flex-wrap:wrap } .seg button{ border-radius:0; min-width:2em; margin-left:-1px } .seg button:first-child{ border-radius:6px 0 0 6px; margin-left:0 } .seg button:last-child{ border-radius:0 6px 6px 0 }
.persec{ flex-wrap:wrap } .persec select{ font-size:12px; padding:0 .2em }
.junction-box{ border:1px solid var(--txt); border-radius:6px; padding:6px; margin-top:4px }
#work{ flex:1; min-width:0; display:flex; flex-direction:column; min-height:0; position:relative }
#layoutWrap{ position:relative; flex:1 1 62%; min-height:280px; border-bottom:1px solid var(--line) }
#layoutBar{ position:absolute; top:6px; left:10px; right:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; z-index:1; pointer-events:none }
#layoutBar > *{ pointer-events:auto }
#layoutTitle{ font-weight:700 } .chip{ background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:1px 8px; font-size:12px }
#layout{ position:absolute; inset:0; width:100%; height:100% }
#tip{ position:absolute; pointer-events:none; background:var(--bg); border:1px solid var(--txt); border-radius:6px; padding:6px 8px; font-size:12px; display:none; z-index:5; max-width:340px; box-shadow:0 2px 8px rgba(0,0,0,.18) }
#below{ flex:1 1 34%; min-height:180px; overflow:hidden; display:flex }
#below > section{ padding:6px 12px; overflow:auto; flex:1 }
#outputs .cols{ display:grid; grid-template-columns:minmax(380px,1.3fr) minmax(300px,1fr); gap:14px; align-items:start }
#view3d{ position:absolute; inset:0; width:100%; height:100%; display:none; cursor:grab; touch-action:none } #view3d:active{ cursor:grabbing }
#layoutWrap.v3 #view3d{ display:block } #layoutWrap.v3 #layout{ display:none } #v3bar{ display:none } #layoutWrap.v3 #v3bar{ display:flex }
#v3bar{ position:absolute; left:10px; bottom:8px; gap:8px; align-items:center; z-index:1; flex-wrap:wrap } #v3info{ font-size:12px; color:var(--mut) }
.sma .body{ fill:#d4af37; stroke:#8a6d1f } .sma .pin{ fill:#e5e7eb; stroke:#6b7280 } .sma .leg{ fill:#d4af37; opacity:.85 } .sma text{ fill:var(--mut) }
h4{ font-size:13px; margin-bottom:4px }
svg text{ font-family:'IBM Plex Mono','DejaVu Sans Mono',Menlo,monospace; fill:var(--txt) }
table.sheet{ border-collapse:collapse; font-size:12px; width:100% } table.sheet th,table.sheet td{ border-bottom:1px solid var(--line); padding:2px 6px; text-align:right; white-space:nowrap }
table.sheet th{ color:var(--mut); font-weight:600 } table.sheet td:first-child,table.sheet th:first-child,table.sheet .l{ text-align:left } table.sheet td.l{ white-space:normal }
table.sheet tfoot td{ font-weight:600 } tr.hl td{ background:color-mix(in srgb, var(--cu-hi) 16%, transparent) } tr.warnrow td{ background:color-mix(in srgb, var(--bad) 8%, transparent) }
.kvs{ display:grid; grid-template-columns:1fr; gap:1px; margin-top:6px; font-size:12px } .kv{ display:flex; justify-content:space-between; gap:8px; border-bottom:1px dotted var(--line) } .kv b{ font-weight:600; text-align:right }
/* layout drawing */
.board{ fill:var(--board); stroke:var(--board-edge) } .fpbox{ fill:none; stroke:var(--mut) }
.el{ cursor:pointer } .el .cu{ fill:var(--cu) } .el path.cus{ fill:none; stroke:var(--cu); stroke-linecap:butt; stroke-linejoin:miter }
.el.hl .cu{ fill:var(--cu-hi) } .el.hl path.cus{ stroke:var(--cu-hi); fill:none }
.el .hit{ fill:none; stroke:transparent } .el .halo{ fill:none; stroke:var(--bad); opacity:.4; stroke-linejoin:round }
.el .pad{ fill:var(--pad) } .el .rbody{ fill:var(--res) } .el.res.hl .rbody{ fill:var(--cu-hi) }
.rlab{ fill:var(--sR); paint-order:stroke; stroke:var(--board); stroke-linejoin:round } .selbox{ fill:none; stroke:var(--cu-hi) } .plab{ paint-order:stroke; stroke:var(--board); stroke-linejoin:round } .bridge{ stroke:var(--sR); fill:none } .bridgedot{ fill:var(--sR) }

<script>
(function(){
'use strict';
/* Power Divider Designer — engine. Pure functions, no DOM.
   ============================================================
   TABLE OF CONTENTS
   1. Complex arithmetic
   2. Complex matrices       — dense re/im arrays, Gauss–Jordan inverse, linear solve
   3. Nodal solver           — lossy line π stamps, resistors, Kron reduction of internal nodes, Y → S
   4. Loaded solve           — matched source, mismatched loads, node voltages, the energy balance
   5. Microstrip             — Pozar (Wheeler) synthesis; Hammerstad–Jensen with Kirschning–Jansen dispersion
   6. Impedance tapers       — binomial and Chebyshev multisection transformers
   7. Isolation resistors    — odd-mode minimax optimisation (equal split), full-solver refinement (unequal)
   8. Divider synthesis      — Wilkinson, T-junction, resistive, corporate tree (structure only; the layout adds lengths)
   9. Network build          — structure (+ interconnect lengths) → nodes, lines, resistors, ports
   10. Analysis              — sweep, operating point, bandwidths, S-matrix checks
   ============================================================
   References: D. M. Pozar, Microwave Engineering, 4th ed., Wiley, 2012 (§3.8, §5.6–5.8, §7.1–7.3);
     E. J. Wilkinson, IRE Trans. MTT 8(1), 1960; S. B. Cohn, IEEE Trans. MTT 16(2), 1968;
     E. Hammerstad, Ø. Jensen, IEEE MTT-S Digest 1980; M. Kirschning, R. H. Jansen, Electron. Lett. 18(6), 1982. */

// ── 1. COMPLEX ARITHMETIC ─────────────────────────────────────
const C0 = 299792458;                       // speed of light (m/s)
const cx = (re, im) => ({ re, im: im || 0 });
const cadd = (a, b) => ({ re: a.re + b.re, im: a.im + b.im });
const csub = (a, b) => ({ re: a.re - b.re, im: a.im - b.im });
const cmul = (a, b) => ({ re: a.re * b.re - a.im * b.im, im: a.re * b.im + a.im * b.re });
const cscale = (a, s) => ({ re: a.re * s, im: a.im * s });
const cconj = a => ({ re: a.re, im: -a.im });
function cdiv(a, b){ const d = b.re * b.re + b.im * b.im; return { re: (a.re * b.re + a.im * b.im) / d, im: (a.im * b.re - a.re * b.im) / d }; }
const cabs = a => Math.hypot(a.re, a.im);
const carg = a => Math.atan2(a.im, a.re);
const cpolar = (m, rad) => ({ re: m * Math.cos(rad), im: m * Math.sin(rad) });
const csinh = z => ({ re: Math.sinh(z.re) * Math.cos(z.im), im: Math.cosh(z.re) * Math.sin(z.im) });
const ccosh = z => ({ re: Math.cosh(z.re) * Math.cos(z.im), im: Math.sinh(z.re) * Math.sin(z.im) });
const dB20 = m => 20 * Math.log10(Math.max(m, 1e-12));
const DEG = 180 / Math.PI;
// ── END 1 ─────────────────────────────────────────────────────

// ── 2. COMPLEX MATRICES ───────────────────────────────────────
// A dense n×m complex matrix: { n, m, re: Float64Array, im: Float64Array }, row-major.
const cmat = (n, m) => ({ n, m: m || n, re: new Float64Array(n * (m || n)), im: new Float64Array(n * (m || n)) });
const mget = (M, i, j) => ({ re: M.re[i * M.m + j], im: M.im[i * M.m + j] });
// Inverse by Gauss–Jordan with partial pivoting.
function cmatInv(M){
  const n = M.n, w = 2 * n, re = new Float64Array(n * w), im = new Float64Array(n * w);
  for(let i = 0; i < n; i++){ for(let j = 0; j < n; j++){ re[i * w + j] = M.re[i * n + j]; im[i * w + j] = M.im[i * n + j]; } re[i * w + n + i] = 1; }
  for(let c = 0; c < n; c++){
    let p = c, best = -1;
    for(let r = c; r < n; r++){ const a = re[r * w + c] ** 2 + im[r * w + c] ** 2; if(a > best){ best = a; p = r; } }
    if(p !== c) for(let j = 0; j < w; j++){ let t = re[p * w + j]; re[p * w + j] = re[c * w + j]; re[c * w + j] = t; t = im[p * w + j]; im[p * w + j] = im[c * w + j]; im[c * w + j] = t; }
    const dr = re[c * w + c], di = im[c * w + c], dd = dr * dr + di * di, ir = dr / dd, ii = -di / dd;
    for(let j = 0; j < w; j++){ const a = re[c * w + j], b = im[c * w + j]; re[c * w + j] = a * ir - b * ii; im[c * w + j] = a * ii + b * ir; }
    for(let r = 0; r < n; r++){
      if(r === c) continue; const fr = re[r * w + c], fi = im[r * w + c]; if(fr === 0 && fi === 0) continue;
      for(let j = 0; j < w; j++){ const a = re[c * w + j], b = im[c * w + j]; re[r * w + j] -= fr * a - fi * b; im[r * w + j] -= fr * b + fi * a; }
    }
  }
  const out = cmat(n);
  for(let i = 0; i < n; i++) for(let j = 0; j < n; j++){ out.re[i * n + j] = re[i * w + n + j]; out.im[i * n + j] = im[i * w + n + j]; }
  return out;
}
// Solve A·x = b (A n×n, b length-n complex arrays) by Gaussian elimination with partial pivoting.
function cmatSolve(A, bre, bim){
  const n = A.n, re = Float64Array.from(A.re), im = Float64Array.from(A.im), xr = Float64Array.from(bre), xi = Float64Array.from(bim);
  for(let c = 0; c < n; c++){
    let p = c, best = -1;
    for(let r = c; r < n; r++){ const a = re[r * n + c] ** 2 + im[r * n + c] ** 2; if(a > best){ best = a; p = r; } }
    if(p !== c){ for(let j = c; j < n; j++){ let t = re[p * n + j]; re[p * n + j] = re[c * n + j]; re[c * n + j] = t; t = im[p * n + j]; im[p * n + j] = im[c * n + j]; im[c * n + j] = t; }
      let t = xr[p]; xr[p] = xr[c]; xr[c] = t; t = xi[p]; xi[p] = xi[c]; xi[c] = t; }
    const dr = re[c * n + c], di = im[c * n + c], dd = dr * dr + di * di, ir = dr / dd, ii = -di / dd;
    for(let r = c + 1; r < n; r++){
      const ar = re[r * n + c], ai = im[r * n + c]; if(ar === 0 && ai === 0) continue;
      const fr = ar * ir - ai * ii, fi = ar * ii + ai * ir;
      for(let j = c; j < n; j++){ const a = re[c * n + j], b = im[c * n + j]; re[r * n + j] -= fr * a - fi * b; im[r * n + j] -= fr * b + fi * a; }
      xr[r] -= fr * xr[c] - fi * xi[c]; xi[r] -= fr * xi[c] + fi * xr[c];
    }
  }
  for(let c = n - 1; c >= 0; c--){
    let sr = xr[c], si = xi[c];
    for(let j = c + 1; j < n; j++){ const a = re[c * n + j], b = im[c * n + j]; sr -= a * xr[j] - b * xi[j]; si -= a * xi[j] + b * xr[j]; }
    const dr = re[c * n + c], di = im[c * n + c], dd = dr * dr + di * di;
    xr[c] = (sr * dr + si * di) / dd; xi[c] = (si * dr - sr * di) / dd;
  }
  return { re: xr, im: xi };
}
// ── END 2 ─────────────────────────────────────────────────────

// ── 3. NODAL SOLVER ───────────────────────────────────────────
/* A network: { n, ports: [node…] (port 1 first), z0, lines: [{ a, b, Z, th0, id }], res: [{ a, b, R, id }] }.
   Node −1 is ground. th0 is a line's electrical length at f0 (rad); at frequency f it is th0·f/f0 (TEM, no dispersion).
   Loss is a(dB per guided wavelength), so αℓ = a·(θ/2π)/8.686 Np. A floor of 1e-7 Np keeps the matrix regular at
   exact multiples of 90°. */
const ALPHA_FLOOR = 1e-7;
// γℓ for a line at the frequency ratio u = f/f0.
function gammaL(th0, u, lossDb){ const th = th0 * u; return cx(Math.max((lossDb || 0) * th / (2 * Math.PI) / 8.685889638, ALPHA_FLOOR), th); }
// Two-port Y of a line: y11 = y22 = coth(γℓ)/Zc, y12 = y21 = −1/(Zc·sinh γℓ).
function lineY(Z, gl){
  const sh = csinh(gl), ch = ccosh(gl);
  return { y11: cscale(cdiv(ch, sh), 1 / Z), y12: cscale(cdiv(cx(1), sh), -1 / Z) };
}
// Assemble the nodal admittance matrix at u = f/f0.
function assembleY(net, u, lossDb){
  const n = net.n, Y = cmat(n);
  const add = (i, j, y) => { Y.re[i * n + j] += y.re; Y.im[i * n + j] += y.im; };
  const stamp = (a, b, y) => { if(a >= 0) add(a, a, y); if(b >= 0) add(b, b, y); if(a >= 0 && b >= 0){ add(a, b, cscale(y, -1)); add(b, a, cscale(y, -1)); } };
  for(const L of net.lines){
    const { y11, y12 } = lineY(L.Z, gammaL(L.th0, u, lossDb));
    stamp(L.a, L.b, cscale(y12, -1)); stamp(L.a, -1, cadd(y11, y12)); stamp(L.b, -1, cadd(y11, y12));
  }
  for(const r of net.res) stamp(r.a, r.b, cx(1 / r.R));
  return Y;
}
/* Kron reduction: eliminate every node not in keep (keep order preserved), one node at a time. The networks are
   chains and trees, so the fill-in stays small. */
function kron(Y, keep){
  const n = Y.n, re = Y.re, im = Y.im, isKeep = new Uint8Array(n);
  keep.forEach(k => { isKeep[k] = 1; });
  const left = []; for(let i = 0; i < n; i++) if(!isKeep[i]) left.push(i);
  if(n <= 40) kronDense(re, im, n, left, isKeep);
  else kronSparse(re, im, n, left);
  const p = keep.length, out = cmat(p);
  for(let a = 0; a < p; a++) for(let b = 0; b < p; b++){ out.re[a * p + b] = re[keep[a] * n + keep[b]]; out.im[a * p + b] = im[keep[a] * n + keep[b]]; }
  return out;
}
// Small networks: eliminate in turn the remaining internal node with the largest |Ykk| (dense updates).
function kronDense(re, im, n, left, isKeep){
  const alive = Uint8Array.from({ length: n }, () => 1);
  while(left.length){
    let bi = 0, bm = -1;
    left.forEach((c, i) => { const m = re[c * n + c] ** 2 + im[c * n + c] ** 2; if(m > bm){ bm = m; bi = i; } });
    const k = left[bi]; left.splice(bi, 1); alive[k] = 0;
    const pr = re[k * n + k], pi = im[k * n + k], pd = pr * pr + pi * pi, ir = pr / pd, ii = -pi / pd;
    for(let i = 0; i < n; i++){
      if(!alive[i]) continue; const ar = re[i * n + k], ai = im[i * n + k]; if(ar === 0 && ai === 0) continue;
      const fr = ar * ir - ai * ii, fi = ar * ii + ai * ir;
      for(let j = 0; j < n; j++){ if(!alive[j]) continue; const br = re[k * n + j], bi2 = im[k * n + j]; if(br === 0 && bi2 === 0) continue;
        re[i * n + j] -= fr * br - fi * bi2; im[i * n + j] -= fr * bi2 + fi * br; }
    }
  }
  void isKeep;
}
// Large networks (trees): lowest degree first, largest |Ykk| among equals, neighbour sets track the fill-in.
function kronSparse(re, im, n, leftArr){
  const nb = [];
  for(let i = 0; i < n; i++){ const s = new Set(); for(let j = 0; j < n; j++) if(i !== j && (re[i * n + j] !== 0 || im[i * n + j] !== 0)) s.add(j); nb.push(s); }
  const left = new Set(leftArr);
  while(left.size){
    let k = -1, kd = Infinity, km = -1;
    for(const c of left){ const d = nb[c].size, m = re[c * n + c] ** 2 + im[c * n + c] ** 2; if(d < kd || (d === kd && m > km)){ k = c; kd = d; km = m; } }
    left.delete(k);
    const pr = re[k * n + k], pi = im[k * n + k], pd = pr * pr + pi * pi, ir = pr / pd, ii = -pi / pd, js = [...nb[k]];
    for(const i of js){
      const ar = re[i * n + k], ai = im[i * n + k], fr = ar * ir - ai * ii, fi = ar * ii + ai * ir;
      for(const j of js){ const br = re[k * n + j], bi = im[k * n + j]; re[i * n + j] -= fr * br - fi * bi; im[i * n + j] -= fr * bi + fi * br; }
      nb[i].delete(k); for(const j of js) if(j !== i) nb[i].add(j);
    }
  }
}
// Port Y → S referred to z0: S = (y0·I − Y)(y0·I + Y)⁻¹.
function yToS(Yp, z0){
  const p = Yp.n, y0 = 1 / z0, A = cmat(p), B = cmat(p);
  for(let i = 0; i < p; i++) for(let j = 0; j < p; j++){ const k = i * p + j, d = i === j ? y0 : 0;
    A.re[k] = d - Yp.re[k]; A.im[k] = -Yp.im[k]; B.re[k] = d + Yp.re[k]; B.im[k] = Yp.im[k]; }
  const Bi = cmatInv(B), S = cmat(p);
  for(let i = 0; i < p; i++) for(let j = 0; j < p; j++){
    let sr = 0, si = 0;
    for(let t = 0; t < p; t++){ const ar = A.re[i * p + t], ai = A.im[i * p + t], br = Bi.re[t * p + j], bi = Bi.im[t * p + j]; sr += ar * br - ai * bi; si += ar * bi + ai * br; }
    S.re[i * p + j] = sr; S.im[i * p + j] = si;
  }
  return S;
}
// S-matrix of a network at u = f/f0.
function solveS(net, u, lossDb){ return yToS(kron(assembleY(net, u, lossDb), net.ports), net.z0); }
/* Compiled solve for sweeps: the elimination order (lowest degree first) and its fill pattern depend only on the
   network's structure, so they are found once; each frequency then only stamps and eliminates. A pivot smaller than
   1e-12 of its row falls back to the pivoting reduction above for that frequency. */
function compileNet(net){
  const n = net.n, nb = Array.from({ length: n }, () => new Set()), isKeep = new Uint8Array(n);
  net.ports.forEach(k => { isKeep[k] = 1; });
  const link = (a, b) => { if(a >= 0 && b >= 0 && a !== b){ nb[a].add(b); nb[b].add(a); } };
  net.lines.forEach(L => link(L.a, L.b)); net.res.forEach(r => link(r.a, r.b));
  const left = new Set(); for(let i = 0; i < n; i++) if(!isKeep[i]) left.add(i);
  const steps = [], touched = new Set();
  for(let i = 0; i < n; i++){ touched.add(i * n + i); nb[i].forEach(j => touched.add(i * n + j)); }
  while(left.size){
    let k = -1, kd = Infinity; for(const c of left){ const d = nb[c].size; if(d < kd){ k = c; kd = d; } }

// ── 9. NETWORK BUILD ──────────────────────────────────────────
const QW = Math.PI / 2;
// Add a two-arm stage at node j0; returns the two end nodes. Element ids: <pfx>.a<arm>.<k> and <pfx>.r<k>.
function addTwoArm(net, st, j0, pfx, endNodes){
  const nodes = st.arms.map(() => [j0]);
  st.arms.forEach((arm, a) => arm.forEach((s, k) => {
    const last = k === arm.length - 1, b = last && endNodes ? endNodes[a] : net.n++;
    net.lines.push({ a: nodes[a][k], b, Z: s.Z, th0: QW, id: pfx + '.a' + a + '.' + k });
    nodes[a].push(b);
  }));
  st.res.forEach((R, k) => { if(R != null && net.resOn !== false) net.res.push({ a: nodes[0][k + 1], b: nodes[1][k + 1], R: R * (net.rMult || 1), id: pfx + '.r' + k }); });
  return [nodes[0][nodes[0].length - 1], nodes[1][nodes[1].length - 1]];

  const nodes = st.arms.map(() => [j0]);
  st.arms.forEach((arm, a) => arm.forEach((s, k) => { const b = net.n++; net.lines.push({ a: nodes[a][k], b, Z: s.Z, th0: QW, id: pfx + '.a' + a + '.' + k }); nodes[a].push(b); }));
  st.res.forEach((R, k) => {

// A resistive Y junction at node j0: z0/3 from the input, and from each output, to a centre node. Returns the two outputs.
function addResY(net, st, j0, pfx){
  const c = net.n++, e = [net.n++, net.n++];

/* Network for a design. opts = { z0, resOn, rMult, lens: { id → electrical length at f0 (rad) } }: a tree's

   their delay lines) come from the layout; all but the stubs are z0 lines. The ports of a tree are at the end of its output lines; a single divider's ports are at its terminals. */

  const net = { n: 1, ports: [0], z0: opts.z0, lines: [], res: [], resOn: opts.resOn, rMult: opts.rMult };

    const st = design.stage, N = st.N;

// ── 10. ANALYSIS ──────────────────────────────────────────────
/* Sweep: S at nf points from uLo to uHi (f/f0), returned as per-entry arrays of complex values: get(i, j) → [{re, im}]. */

  const S = u.map(x => solveSc(c, x, lossDb));

/* −lim dB bandwidth around f0 of a magnitude curve on the sweep grid (contiguous, edges interpolated in dB);

function bandwidthOf(u, magDb, lim){

/* Bandwidths (−15 dB) for S11, the worst output match, the worst isolation; the narrowest is the usable bandwidth. */
function bandwidths(sw, lim){
  const p = sw.p, worst = (pairs) => sw.u.map((_, k) => Math.max(...pairs.map(([i, j]) => dB20(cabs(mget(sw.S[k], i, j))))));

  const rows = [{ key: 'S11', label: 'S11', curve: worst([[0, 0]]) }];

/* Power Divider Designer — layout: the to-scale microstrip top view (mm). Pure geometry, no DOM.
   ============================================================
   TABLE OF CONTENTS
   1. Footprints        — 0402 / 0603 resistor land patterns
   2. Centreline paths  — polylines with sharp, optimum-mitre or round corners; arcs; lengths; outlines
   3. Section shapes    — straight, arc (ring), mitred bracket, meander, each fitted to λg/4 along its centreline
   4. Placement         — quarter-turn transforms (a stage drawn in its own frame, placed rotated in a tree)
   5. Two-arm stage     — junction, arms, resistors, output transformers, rule checks
   6. Star stage        — N lanes, star resistors to an air-bridged centre (non-planar for N > 2)
   7. Resistive         — Y (and Δ for N = 2) single dividers; resistive-Y tree junction

// ── 1. FOOTPRINTS ─────────────────────────────────────────────
// Chip-resistor land patterns (mm): body L × W, pad length (along the resistor) × width, gap between the pads.
const FOOTPRINTS = {
  '0402': { bodyL: 1.0, bodyW: 0.5, padL: 0.5, padW: 0.6, gap: 0.5 },
  '0603': { bodyL: 1.6, bodyW: 0.8, padL: 0.8, padW: 0.9, gap: 0.8 },

// ── 2. CENTRELINE PATHS ───────────────────────────────────────
const f3 = v => (Math.round(v * 1000) / 1000).toString();

const optMitre = (W, h) => (52 + 65 * Math.exp(-1.35 * W / h)) / 100;

  }

    len += dist(cur, p1) + rb * th;

/* Copper outline of a sharp or mitred polyline of width W: offset both sides, join at the miter points; a mitred

  const nrm = u => ({ x: -u.y, y: u.x });

}

/* A section from (x0, y0) to (x0 + dx, y0), bulging toward sgn·y (−1 up, +1 down), centreline length len.
   shape = { kind: 'straight' | 'arc' | 'mitred' | 'meander', phi (arc angle, rad), turns, gap (mm, edge to edge),
   bend: 'mitre' | 'round' }. Natural dx (for the shared node spacing): */
function naturalDx(kind, len, opt, pitch){
  switch(kind){
    case 'arc': { const phi = opt.phi || Math.PI; return 2 * (len / phi) * Math.sin(phi / 2); }
    case 'mitred': return len / 2;
    case 'meander': return 2 * opt.turnsFit * pitch;
    default: return len;
  }
}
// Fit length len into the run dx. Returns { path, kind, spec, rise, warn[] }.
function fitSection(kind, x0, y0, dx, len, sgn, W, opt, pitch, h){
  const warn = [];
  if(kind === 'arc'){
    // chord dx, arc length len: sin(φ/2)/(φ/2) = dx/len, φ ∈ (0, 2π)
    const q = Math.min(dx / len, 1 - 1e-9); let lo = 1e-6, hi = 2 * Math.PI - 1e-6;
    for(let i = 0; i < 80; i++){ const m = (lo + hi) / 2; if(Math.sin(m / 2) / (m / 2) > q) lo = m; else hi = m; }
    const phi = (lo + hi) / 2, r = len / phi;
    const path = arcPath(P(x0, y0), P(x0 + dx, y0), r, phi > Math.PI, sgn < 0 ? 1 : 0, phi);
    const rise = r * (1 - Math.cos(phi / 2));
    if(r < 3 * W) warn.push('radius ' + r.toFixed(2) + ' mm < 3W = ' + (3 * W).toFixed(2) + ' mm');
    return { path, kind, rise, spec: { r, phi }, warn };
  }
  if(kind === 'mitred' || kind === 'meander'){
    const round = kind === 'meander' && opt.bend === 'round', lead = kind === 'mitred' ? opt.lead : pitch / 2;
    const N = kind === 'mitred' ? 1 : opt.turnsFit, step = kind === 'mitred' ? dx - 2 * opt.lead : pitch;
    const build = A => {
      const pts = [P(x0, y0)]; let x = x0 + lead;
      for(let t = 0; t < N; t++){
        pts.push(P(x, y0), P(x, y0 + sgn * A), P(x + step, y0 + sgn * A), P(x + step, y0));
        x += step; if(t < N - 1) x += step;
      }
      pts.push(P(x0 + dx, y0));
      return polyPath(pts, round ? 'round' : 'sharp', round ? pitch / 2 : 0);
    };
    // the centreline grows by 2N per unit of fold height: two Newton steps from the sharp-corner estimate
    let A = Math.max((len - dx) / (2 * N), W);
    for(let i = 0; i < 4; i++){ A = Math.max(A + (len - build(A).len) / (2 * N), W); }
    const path = build(A);
    const spec = kind === 'mitred' ? { rise: A, run: step, lead } : { turns: N, A, pitch, gap: pitch - W, bend: round ? 'round' : 'mitre' };
    if(Math.abs(path.len - len) > 1e-3 * len) warn.push('cannot fold ' + len.toFixed(2) + ' mm into this run');
    if(kind === 'meander' && N < (opt.turns || 2)) warn.push(N + ' turn' + (N > 1 ? 's' : '') + ' fit (asked ' + opt.turns + ')');
    if(kind === 'meander' && pitch - W < 3 * h - 1e-9) warn.push('meander gap ' + (pitch - W).toFixed(2) + ' mm < 3h = ' + (3 * h).toFixed(2) + ' mm: coupling');
    if(round && pitch / 2 < 3 * W) warn.push('bend radius ' + (pitch / 2).toFixed(2) + ' mm < 3W = ' + (3 * W).toFixed(2) + ' mm');
    return { path, kind, rise: A, spec, warn, mitred: !round };
  }
  // straight: a longer arm than the run takes up the difference in a shallow bump
  if(len <= dx + 1e-9) return { path: polyPath([P(x0, y0), P(x0 + dx, y0)], 'sharp'), kind, rise: 0, spec: {}, warn };
  const a = (len - dx) / 2, run = Math.min(dx / 3, Math.max(2 * W, 1)), xa = x0 + (dx - run) / 2;
  const path = polyPath([P(x0, y0), P(xa, y0), P(xa, y0 + sgn * a), P(xa + run, y0 + sgn * a), P(xa + run, y0), P(x0 + dx, y0)], 'sharp');
  return { path, kind, rise: a, spec: { bump: a }, warn, mitred: true };
}
// ── END 3 ─────────────────────────────────────────────────────

// ── 4. PLACEMENT ──────────────────────────────────────────────
/* A transform { x, y, q }: global = (x, y) + R(q)·local, R a quarter-turn clockwise on screen q times
   (q = 1: local +x points down). Elements keep their local geometry and carry their transform. */
const TF0 = { x: 0, y: 0, q: 0 };
function rotQ(p, q){ switch(((q % 4) + 4) % 4){ case 1: return P(-p.y, p.x); case 2: return P(-p.x, -p.y); case 3: return P(p.y, -p.x); default: return P(p.x, p.y); } }
const applyTf = (tf, p) => { const r = rotQ(p, tf.q); return P(tf.x + r.x, tf.y + r.y); };
const composeTf = (a, b) => { const o = applyTf(a, P(b.x, b.y)); return { x: o.x, y: o.y, q: (a.q + b.q) % 4 }; };
// Re-place a geometry { els, res, labels } under the transform tf (composed with any it already has).
function placeGeom(gm, tf){
  const re = x => Object.assign({}, x, { tf: composeTf(tf, x.tf || TF0) });
  return { els: gm.els.map(re), res: gm.res.map(re), labels: (gm.labels || []).map(re) };
}
// A z0 line along a polyline: modelled (an interconnect or output line) or not (a launch).
function zLine(id, role, pts, W0, h, model, extra){
  const path = polyPath(pts, 'sharp');
  return Object.assign({ id, role, W: W0, path, outline: polyOutline(pts, W0, optMitre(W0, h)), model, len: path.len }, extra || {});
}
/* Fan N lane ends (x, ys[i]) heading +x out to the port positions yp[i]: the outer lanes turn first so no two lines
   cross. Returns the polylines, all ending at xEnd. */
function fanOut(x, ys, yp, lead, step, xEnd){
  const N = ys.length, mid = (N - 1) / 2;
  return ys.map((y, i) => {
    const pts = [P(x, y)];
    if(Math.abs(yp[i] - y) > 1e-6){ const xt = x + lead + step * (Math.ceil(mid) - Math.abs(i - mid)); pts.push(P(xt, y), P(xt, yp[i])); }
    pts.push(P(xEnd, yp[i]));
    return pts;
  });
}
// ── END 4 ─────────────────────────────────────────────────────

// ── 5. TWO-ARM STAGE ──────────────────────────────────────────
/* Microstrip of every section of a stage's arms. */
const secOf = (st, ms) => st.arms.map(arm => arm.map(s => { const m = ms(s.Z); return { Z: s.Z, W: m.W, len: m.lenQ, eeff: m.eeff, role: s.role }; }));
/* Draw the sections of one lane set. lanes = [{ y, sgn, secs }]; all lanes share the node positions. Returns the
   elements, the node x positions and the largest rise. */
function drawSections(g, pfx, lanes, nSec){
  const els = [], nodesX = [0], fp = FOOTPRINTS[g.fp]; let x = 0, maxRise = 0;
  for(let k = 0; k < nSec; k++){
    const secs = lanes.map(l => l.secs[k]);
    const asked = (g.shapes && (g.shapes[k] || g.shapes[0])) || 'straight', wmax = Math.max(...secs.map(c => c.W)), lmin = Math.min(...secs.map(c => c.len));
    // a fold needs room: a meander tooth at least 7W of line (gap W/2, height 2W), a bracket 8W; else drawn straight
    const kind = (asked === 'meander' && lmin < 7 * wmax) || (asked === 'mitred' && lmin < 8 * wmax) ? 'straight' : asked;
    const tooWide = kind !== asked ? ['too wide (W = ' + wmax.toFixed(2) + ' mm) to fold ' + lmin.toFixed(1) + ' mm: drawn straight'] : [];
    let pitch = (g.shapeOpt.gap != null ? g.shapeOpt.gap : 3 * g.h) + wmax;
    const opt = Object.assign({}, g.shapeOpt, { lead: Math.max(fp.padW, 2 * wmax) });
    if(kind === 'meander'){
      /* N teeth use 2N·pitch of run and need a fold height of at least 2W: N ≤ ℓ / (2(pitch + 2W)). When even one
         tooth does not fit at the asked gap, the gap shrinks to fit (and the coupling warning shows). */
      const nmax = Math.floor(lmin / (2 * (pitch + 2 * wmax)));
      opt.turnsFit = Math.max(1, Math.min(opt.turns || 2, nmax));
      if(nmax < 1) pitch = Math.max(wmax * 1.5, lmin / 2 - 2 * wmax);
    }
    let dx = Math.min(...secs.map(c => naturalDx(kind, c.len, opt, pitch)));
    if(kind === 'mitred') dx = Math.max(dx, 2 * opt.lead + 3 * wmax);
    lanes.forEach((ln, a) => {
      const c = ln.secs[k], f = fitSection(kind, x, ln.y, dx, c.len, ln.sgn, c.W, opt, pitch, g.h);
      const it = { id: pfx + '.a' + a + '.' + k, role: c.role, arm: a, k, Z: c.Z, W: c.W, eeff: c.eeff, lenTarget: c.len, len: f.path.len, path: f.path,
        shape: kind, spec: f.spec, warn: tooWide.concat(f.warn), rise: f.rise, model: true };
      if(f.mitred || kind === 'straight') it.outline = polyOutline(f.path.pts, c.W, kind === 'straight' ? 0 : optMitre(c.W, g.h));
      if(c.W < g.minW) it.warn = it.warn.concat(['W = ' + c.W.toFixed(3) + ' mm below the ' + g.minW + ' mm minimum']);
      maxRise = Math.max(maxRise, f.rise + c.W / 2);
      els.push(it);
    });
    x += dx; nodesX.push(x);
  }
  return { els, nodesX, maxRise, lastShape: els.slice(-lanes.length).map(e => ({ kind: e.shape, spec: e.spec, W: e.W })) };
}
/* A two-arm stage (2-way Wilkinson or branching line) in its own frame: input at (0, 0) heading +x, arm 0 (to the
   first output) above, arm 1 below; ends at (xEnd, ∓s/2). */
function stageTwoArm(g, st, pfx){
  const fp = FOOTPRINTS[g.fp], sec = secOf(st, g.ms), nSec = sec[0].length, res = [];
  // arm centre spacing: the widest pair at any resistor node plus the pad gap, never below the land pattern
  let s = fp.gap + 2 * fp.padL;
  for(let k = 0; k < nSec; k++){ const w0 = Math.max(sec[0][k].W, (sec[0][k + 1] || sec[0][k]).W), w1 = Math.max(sec[1][k].W, (sec[1][k + 1] || sec[1][k]).W);
    s = Math.max(s, (w0 + w1) / 2 + fp.gap); }
  if(st.tee) s = Math.max(s, 3 * g.h + Math.max(sec[0][0].W, sec[1][0].W));
  const y = [-s / 2, s / 2];
  const d = drawSections(g, pfx, [{ y: y[0], sgn: -1, secs: sec[0] }, { y: y[1], sgn: 1, secs: sec[1] }], nSec);
  const els = [{ id: pfx + '.jn', role: 'junction', W: Math.max(sec[0][0].W, sec[1][0].W), path: polyPath([P(0, y[0]), P(0, y[1])], 'sharp'), model: false }].concat(d.els);
  st.res.forEach((R, k) => {
    if(R == null || g.resOn === false) return;
    const x = d.nodesX[k + 1], wa = Math.max(sec[0][k].W, (sec[0][k + 1] || sec[0][k]).W), wb = Math.max(sec[1][k].W, (sec[1][k + 1] || sec[1][k]).W);
    res.push({ id: pfx + '.r' + k, R: R * (g.rMult || 1), a: P(x, y[0] + wa / 2), b: P(x, y[1] - wb / 2), fp });
  });
  const xEnd = d.nodesX[nSec];
  const last = sec.map(a => a[a.length - 1]), W0 = g.ms(g.z0).W, clr = 0.3;
  /* The outputs leave as two separate z0 lines that turn straight outward at the output node (s apart, so they never
     merge). Where the last section's own copper is in the way — an arc arriving vertically, or the last leg of a meander
     or bracket closer than the z0 half-width — each arm first continues at its own width for the shortest stub that
     clears it. */
  const stub = Math.max(0, ...d.lastShape.map(ls => {
    if(ls.kind === 'arc') return ls.W / 2 + W0 / 2 + clr;
    if(ls.kind === 'meander') return W0 / 2 + clr - (ls.spec.pitch / 2 - ls.W / 2);
    if(ls.kind === 'mitred') return W0 / 2 + clr - (ls.spec.lead - ls.W / 2);
    return 0;
  }));
  return { els, res, labels: [], ends: [P(xEnd, y[0]), P(xEnd, y[1])], xEnd, s, half: s / 2 + d.maxRise, nodesX: d.nodesX,
    stub, endW: last.map(c => c.W), endZ: last.map(c => c.Z) };
}
// ── END 5 ─────────────────────────────────────────────────────

// ── 6. STAR STAGE ─────────────────────────────────────────────
/* N lanes, every section bulging up; at each resistor node every lane has a resistor down to a tap, and the taps meet
   at the star centre over an air bridge (drawn dashed: an N-way Wilkinson is not planar for N > 2). */
function stageStar(g, st, pfx){
  const fp = FOOTPRINTS[g.fp], sec = secOf(st, g.ms), N = sec.length, nSec = sec[0].length, Lr = fp.gap + 2 * fp.padL;
  // lane pitch from a trial with all lanes on one line
  const trial = drawSections(g, pfx, sec.map(c => ({ y: 0, sgn: -1, secs: c })), nSec);
  const wmax = Math.max(...sec.flat().map(c => c.W)), hasR = st.res.some(r => r != null) && g.resOn !== false;
  const Ls = trial.maxRise + wmax / 2 + Math.max(3 * g.h, 1) + (hasR ? Lr + 0.5 : 0);
  const ys = sec.map((c, i) => (i - (N - 1) / 2) * Ls);
  const d = drawSections(g, pfx, sec.map((c, i) => ({ y: ys[i], sgn: -1, secs: c })), nSec);
  const els = [{ id: pfx + '.jn', role: 'junction', W: Math.max(...sec.map(c => c[0].W)), path: polyPath([P(0, ys[0]), P(0, ys[N - 1])], 'sharp'), model: false }].concat(d.els);
  const res = [], labels = [];
  st.res.forEach((R, k) => {
    if(R == null || g.resOn === false) return;
    const x = d.nodesX[k + 1], taps = [];
    ys.forEach((yy, i) => { const w = Math.max(sec[i][k].W, (sec[i][k + 1] || sec[i][k]).W), a0 = P(x, yy + w / 2), b0 = P(x, yy + w / 2 + Lr);
      res.push({ id: pfx + '.r' + k + '.' + i, R: R * (g.rMult || 1), a: a0, b: b0, fp }); taps.push(b0); });
    if(N > 1) labels.push({ kind: 'bridge', id: pfx + '.r' + k, pts: [taps[0], taps[N - 1]], x, y: (ys[0] + ys[N - 1]) / 2 });
  });
  const xEnd = d.nodesX[nSec];
  return { els, res, labels, ends: ys.map(yy => P(xEnd, yy)), xEnd, s: Ls, half: ys[N - 1] + Ls / 2, ys };
}
// ── END 6 ─────────────────────────────────────────────────────

// ── 7. RESISTIVE ──────────────────────────────────────────────
// Copper pad (a square z0-wide stub) as a not-modelled element.
const padEl = (id, c, w) => ({ id, role: 'pad', W: w, path: polyPath([P(c.x - w / 2, c.y), P(c.x + w / 2, c.y)], 'sharp'), outline: polyOutline([P(c.x - w / 2, c.y), P(c.x + w / 2, c.y)], w, 0), model: false });
/* Resistive divider, N outputs, as a single stage. Y: input resistor to a centre bar, one resistor per output lane.
   Δ (N = 2): three resistors on a triangle of pads. Ends at (xEnd, ys[i]). */
function stageResistive(g, st, pfx){
  const fp = FOOTPRINTS[g.fp], Lr = fp.gap + 2 * fp.padL, W0 = g.ms(g.z0).W, N = st.N, pw = Math.max(W0, fp.padW);
  const els = [], res = [];
  if(st.form === 'delta'){
    const A = P(0, 0), B = P(Lr * Math.cos(Math.PI / 6) + pw, -Lr / 2 - pw / 2), Cc = P(B.x, -B.y);
    [['A', A], ['B', B], ['C', Cc]].forEach(([n, c]) => els.push(padEl(pfx + '.p' + n, c, pw)));
    res.push({ id: pfx + '.r01', R: st.R, a: A, b: B, fp }, { id: pfx + '.r02', R: st.R, a: A, b: Cc, fp }, { id: pfx + '.r12', R: st.R, a: B, b: Cc, fp });
    return { els, res, labels: [], ends: [B, Cc], xEnd: B.x + pw / 2, s: Cc.y - B.y, ys: [B.y, Cc.y] };
  }
  const lane = Math.max(pw + 1, fp.padW + 1.2), ys = Array.from({ length: N }, (_, i) => (i - (N - 1) / 2) * lane);
  const xc = Lr + pw / 2;                                             // centre bar
  els.push({ id: pfx + '.c', role: 'pad', W: pw, path: polyPath([P(xc, ys[0] - pw / 2), P(xc, ys[N - 1] + pw / 2)], 'sharp'), model: false });
  res.push({ id: pfx + '.r0', R: st.R, a: P(0, 0), b: P(xc - pw / 2, 0), fp });
  ys.forEach((yy, i) => { const e = P(xc + pw / 2 + Lr, yy); res.push({ id: pfx + '.r' + (i + 1), R: st.R, a: P(xc + pw / 2, yy), b: e, fp }); els.push(padEl(pfx + '.p' + i, P(e.x + pw / 2, yy), pw)); });
  const xEnd = xc + pw / 2 + Lr + pw;
  return { els, res, labels: [], ends: ys.map(yy => P(xEnd, yy)), xEnd, s: lane, ys };
}
/* Resistive-Y tree junction (two outputs): input resistor, centre pad, one resistor up and one down; ends heading +x. */
function stageResY(g, st, pfx){
  const fp = FOOTPRINTS[g.fp], Lr = fp.gap + 2 * fp.padL, W0 = g.ms(g.z0).W, pw = Math.max(W0, fp.padW);
  const xc = Lr + pw / 2, e0 = P(xc, -pw / 2 - Lr - pw / 2), e1 = P(xc, pw / 2 + Lr + pw / 2);
  const els = [padEl(pfx + '.c', P(xc, 0), pw), padEl(pfx + '.p0', e0, pw), padEl(pfx + '.p1', e1, pw)];
  const res = [{ id: pfx + '.r0', R: st.R, a: P(0, 0), b: P(xc - pw / 2, 0), fp }, { id: pfx + '.r1', R: st.R, a: P(xc, -pw / 2), b: P(xc, e0.y + pw / 2), fp },
    { id: pfx + '.r2', R: st.R, a: P(xc, pw / 2), b: P(xc, e1.y - pw / 2), fp }];
  return { els, res, labels: [], ends: [P(xc + pw / 2, e0.y), P(xc + pw / 2, e1.y)], xEnd: xc + pw / 2, s: e1.y - e0.y, half: e1.y + pw / 2 };
}
// ── END 7 ─────────────────────────────────────────────────────

// ── 8. SINGLE DIVIDER ─────────────────────────────────────────
/* A single divider (Wilkinson 2-way or N-way, T, resistive) with its input launch and the output launches fanned out to
   the port pitch. Launches are drawn, not modelled: the ports are at the divider's terminals. */
function layoutSingle(g, design){
  const st = design.stage, W0 = g.ms(g.z0).W, L0 = g.launch, pfx = 'x';
  const sg = st.kind === 'resistive' ? stageResistive(g, st, pfx) : st.kind === 'star' ? stageStar(g, st, pfx) : stageTwoArm(g, st, pfx);
  const els = sg.els.slice(), N = sg.ends.length;
  els.unshift(zLine(pfx + '.in', 'launch', [P(-L0, 0), P(0, 0)], W0, g.h, false));
  const ys = sg.ends.map(e => e.y), span = Math.max(g.pitch * (N - 1), ys[N - 1] - ys[0]);
  const yp = ys.map((y, i) => N === 1 ? y : -span / 2 + span * i / (N - 1));
  if(sg.stub != null){
    // two-arm: (a stub at the arm's width if needed, then) the z0 line turns straight out to the port pitch and runs to the edge
    const xs = sg.xEnd + sg.stub, half = Math.max(span / 2, sg.s / 2, (W0 + 1) / 2), xEnd = xs + Math.max(L0, W0);
    sg.ends.forEach((e, i) => {
      if(sg.stub > 1e-9) els.push({ id: pfx + '.st' + i, role: 'stub', Z: sg.endZ[i], W: sg.endW[i], path: polyPath([e, P(xs, e.y)], 'sharp'), outline: polyOutline([e, P(xs, e.y)], sg.endW[i], 0), model: false });
      const yo = (i === 0 ? -1 : 1) * half;
      els.push(zLine(pfx + '.out' + i, 'launch', [P(xs, e.y), P(xs, yo), P(xEnd, yo)], W0, g.h, false, { port: i }));
    });
    const ports = [{ name: 'P1', at: P(-L0, 0), dir: 2, i: 0 }].concat([-half, half].map((y, i) => ({ name: 'P' + (i + 2), at: P(xEnd, y), dir: 0, i: i + 1 })));
    return finish({ els, res: sg.res, labels: sg.labels, ports, s: sg.s, W0 });
  }
  const lead = Math.max(1.5 * W0, 2), step = W0 + Math.max(1, 3 * g.h), xEnd = sg.xEnd + lead + step * Math.ceil((N - 1) / 2) + L0;
  fanOut(sg.xEnd, ys, yp, lead, step, xEnd).forEach((pts, i) => { pts[0] = sg.ends[i]; els.push(zLine(pfx + '.out' + i, 'launch', pts, W0, g.h, false, { port: i })); });
  const ports = [{ name: 'P1', at: P(-L0, 0), dir: 2, i: 0 }].concat(yp.map((y, i) => ({ name: 'P' + (i + 2), at: P(xEnd, y), dir: 0, i: i + 1 })));
  return finish({ els, res: sg.res, labels: sg.labels, ports, s: sg.s, W0 });
}
// ── END 8 ─────────────────────────────────────────────────────

// ── 9. TREE ───────────────────────────────────────────────────
/* Corporate tree. Every junction is drawn in its own frame and placed: binary — all junctions heading +x, the two
   subtrees above and below, far enough apart that their boxes clear; H-tree — the subtrees turn up and down (and the
   next level left and right…), the classic H. Interconnects ('ic<path><k>') and output lines ('o<i>') are z0 lines and
   are modelled; their electrical lengths are returned in lens. Every output line carries a delay line (a square-wave
   serpentine) that brings its path to the longest path's electrical length, so all outputs are in phase at f0
   (g.equalise; g.pathErr adds an extra length to output 1 to show the imbalance). */
function layoutTree(g, design){
  const T = design.tree, W0 = g.ms(g.z0).W, lg0 = g.ms(g.z0).lambdaG, L0 = g.launch, h = g.h;
  const lead = Math.max(1.5 * W0, 2), clr = Math.max(2 * W0, 3 * h, 1.5), H = g.treeLayout === 'H' && (T.N & (T.N - 1)) === 0;
  const els = [], res = [], labels = [], lens = {}, zs = {}, leaves = [], warnings = [];
  const leafHalf = Math.max(g.pitch / 2, W0 / 2 + clr / 2), stages = new Map();      // stage geometry per junction (own frame)
  // place(nd, tf): draws the subtree at transform tf; returns its box in tf's frame

  for(let i = 1; i <= n; i++) t.push({ key: 'S' + (i + 1) + (i + 1), label: 'S' + (i + 1) + ',' + (i + 1), col: n <= 2 ? (i === 1 ? '#dc2626' : '#e11d48') : OUT_COLS[(i - 1) % 8], i, j: i, grp: 'match', dash: '6 3' });

  const pairs = []; for(let i = 1; i <= n; i++) for(let j = i + 1; j <= n; j++) pairs.push([i, j]);

// ── 3. BANDWIDTHS ─────────────────────────────────────────────

// ── 4. POWER FLOW ─────────────────────────────────────────────
/* One flow diagram: the input band on the left splits into a band per output (green, fading for small shares), the
   resistors (purple), line loss (grey) and the reflected band returning to the source (amber). Widths ∝ power. */
function flowSvg(Ld, title, n){
  const W = 420, rows = n + 3, H = Math.max(180, 24 * rows + 40), x0 = 70, x1 = W - 120, top = 30, hMax = 90;
  const svg = svgEl('svg', { width: W, height: H, role: 'img', 'aria-label': 'Power flow ' + title, class: 'flowsvg' });
  svg.append(svgEl('text', { x: 6, y: 16, 'font-size': 12, 'font-weight': 600 }, title));
  const parts = Ld.pLoad.map((p, i) => ({ v: p, label: 'P' + (i + 2), cls: 'fo' })).concat([{ v: Ld.pRes, label: 'resistors', cls: 'fr' }, { v: Ld.pLine, label: 'line loss', cls: 'fl' }]);
  const gapY = (H - top - 20) / parts.length, inW = hMax, yIn = top + (H - top - 20) / 2;
  svg.append(svgEl('rect', { x: 10, y: yIn - inW / 2, width: x0 - 10, height: inW, class: 'fin' }));
  svg.append(svgEl('text', { x: 14, y: yIn - inW / 2 - 4, 'font-size': 11 }, 'in 100 %'));
  let acc = yIn - inW / 2;
  parts.forEach((p, i) => {
    const w = Math.max(0.6, hMax * p.v), ys = acc + w / 2; acc += hMax * p.v;
    const ye = top + gapY * (i + 0.5), faded = p.v < 0.01 ? ' faded' : '';
    svg.append(svgEl('path', { d: `M${x0} ${ys} C${(x0 + x1) / 2} ${ys} ${(x0 + x1) / 2} ${ye} ${x1} ${ye}`, class: 'fband ' + p.cls + faded, 'stroke-width': w }));
    svg.append(svgEl('text', { x: x1 + 6, y: ye + 4, 'font-size': 11, class: faded ? 'fadedtxt' : '' }, `${p.label} ${(p.v * 100).toFixed(p.v < 0.1 ? 2 : 1)} %`));
  });
  const wr = Math.max(0.6, hMax * Ld.pRefl);
  svg.append(svgEl('path', { d: `M${x0} ${yIn + inW / 2 + 8 + wr / 2} H 10`, class: 'fband fre' + (Ld.pRefl < 0.01 ? ' faded' : ''), 'stroke-width': wr }));
  svg.append(svgEl('text', { x: 14, y: yIn + inW / 2 + 22 + wr, 'font-size': 11, class: Ld.pRefl < 0.01 ? 'fadedtxt' : '' }, `reflected ${(Ld.pRefl * 100).toFixed(2)} %`));
  const sum = Ld.total;
  svg.append(svgEl('text', { x: 6, y: H - 4, 'font-size': 11, fill: Math.abs(sum - 1) < 1e-3 ? 'var(--s21)' : 'var(--bad)' },
    `balance: reflected + delivered + R + lines = ${(sum * 100).toFixed(3)} %`));
  return svg;
}
function drawFlow(D){
  const n = D.net.ports.length - 1;
  $('perfFlow').replaceChildren(el('h4', { text: 'Power flow (output loads as set on the Designer)' }),
    el('div', { class: 'row wrap' }, flowSvg(D.L0, 'at f₀ = ' + (S.f0 / 1e9).toFixed(3) + ' GHz', n), flowSvg(D.Lm, 'at the marker, ' + fmtGHz(S.perf.marker), n)));

// ── 5. S-MATRIX ───────────────────────────────────────────────
const THEOREM = {
  wilkinson: 'Wilkinson: matched at every port and isolated; it gives up losslessness — power reflected by the outputs (odd mode) is absorbed in R.',
  tee: 'Lossless T: lossless and reciprocal, so it cannot be matched at all three ports: the input is matched, the outputs are not, and they are not isolated.',
  resistive: 'Resistive: matched at every port, but lossy for every signal (half the input power for N = 2) and not isolated.',
  tree: 'Tree: each junction keeps or gives up what its module does — Wilkinson junctions stay matched and isolated; branching lines are lossless but leave the outputs unmatched; resistive Y junctions lose 6 dB each.',
};
function drawSMatrix(D){
  const S0 = D.S0, p = S0.n, ck = sChecks(S0), box = $('perfS');
  let grid;
  if(p <= 5){
    let rows = '';
    for(let i = 0; i < p; i++){ rows += `<tr><th>${i + 1}</th>`; for(let j = 0; j < p; j++){ const v = mget(S0, i, j);
      rows += `<td class="${i === j ? 'diag' : ''}">${fmtDb(dB20(cabs(v)), 2)} dB<br><span class="mut">∠${fmt(carg(v) * DEG, 1)}°</span></td>`; } rows += '</tr>'; }
    grid = `<table class="sheet smat"><thead><tr><th>i \\ j</th>${[...Array(p).keys()].map(j => `<th>${j + 1}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
  } else {
    const c = 16; let cells = '';
    for(let i = 0; i < p; i++) for(let j = 0; j < p; j++){ const db = dB20(cabs(mget(S0, i, j))), t = Math.max(0, Math.min(1, (db + 60) / 60));
      cells += `<rect x="${24 + j * c}" y="${14 + i * c}" width="${c - 1}" height="${c - 1}" fill="var(--s31)" fill-opacity="${(0.06 + 0.94 * t).toFixed(3)}"><title>S${i + 1},${j + 1}: ${fmtDb(db, 2)} dB ∠${fmt(carg(mget(S0, i, j)) * DEG, 1)}°</title></rect>`; }
    grid = `<svg width="${30 + p * c}" height="${20 + p * c}" role="img" aria-label="|S| at f0 as a grid">${cells}<text x="24" y="10" font-size="10">j →</text><text x="2" y="${20 + p * c / 2}" font-size="10">i</text></svg>
      <p class="hint">|S<sub>ij</sub>| at f₀, darker = larger (0 to −60 dB); hover a cell for its value.</p>`;
  }
  const yes = (b, t, f) => `<li class="${b ? 'ok' : 'no'}">${b ? '✓' : '✗'} ${b ? t : f}</li>`;
  box.innerHTML = `<h4>S-matrix at f₀</h4>${grid}<ul class="checks">` +
    yes(ck.match, 'matched: every |Sii| < −20 dB', 'not matched at every port (some |Sii| ≥ −20 dB)') +
    yes(ck.recip, 'reciprocal: Sij = Sji', 'not reciprocal') +
    yes(ck.iso, 'outputs isolated: every |Sij| < −20 dB', 'outputs not isolated') +
    yes(ck.lossless, 'lossless: every column Σ|Sij|² = 1', 'lossy: column power sums ' + ck.col.map(x => x.toFixed(3)).join(', ')) +
    `</ul><p class="theorem"><b>Three-port theorem.</b> ${THEOREM[D.design.topology]}</p>`;
}

function downloadCsv(D, rows){

    ['f0 (GHz)', S.f0 / 1e9], ['Z0 (ohm)', S.z0], ['er', S.er], ['h (mm)', S.h], ['model', MS_MODEL_NAME[S.msModel]], [],
    ['Element', 'Z (ohm)', 'W (mm)', 'Length (mm)', 'Electrical length (deg)', 'Shape', 'Resistor']]

const mth = s => `<span class="math">${s}</span>`;
// Usable −15 dB bandwidth (%) of an equal 2-way Wilkinson with M binomial sections, and its resistors.
function wilkRow(M, taperKind){
  const d = synthesize({ topology: 'wilkinson', N: 2, ratioDB: 0, M, taper: taperKind || 'binomial', gm: 0.1, z0: 50 });
  const net = buildNetwork(d, { z0: 50, resOn: true, rMult: 1 }), sw = sweep(net, 0.05, 1.95, 361, 0), bw = bandwidths(sw, -15);
  const s11 = bandwidthOf(sw.u, sw.u.map((u, k) => dB20(cabs(mget(sw.S[k], 0, 0)))), -20);
  let worst = -Infinity; sw.u.forEach((u, k) => { if(s11 && u >= s11.lo && u <= s11.hi) [[1, 1], [2, 2], [1, 2]].forEach(([i, j]) => { worst = Math.max(worst, dB20(cabs(mget(sw.S[k], i, j)))); }); });
  return { M, R: d.stage.res, use: bw.usable.bw ? bw.usable.bw.frac * 100 : 0, s11bw: bw.rows[0].bw ? bw.rows[0].bw.frac * 100 : 0, band20: s11 ? s11.frac * 100 : 0, worst };
}
function buildTheory(){
  const rows = [1, 2, 3, 4].map(M => wilkRow(M));
  const rtab = rows.map(r => `<tr><td>${r.M}</td><td>${r.R.map(x => x.toFixed(1)).join(' / ')}</td><td>${r.band20.toFixed(1)} %</td><td>${r.M === 1 ? '—' : fmt(r.worst, 1) + ' dB'}</td><td>${r.s11bw.toFixed(1)} %</td><td>${r.use.toFixed(1)} %</td></tr>`).join('');
  $('theoryBody').innerHTML = `<article class="doc">
  <h1>Power dividers</h1>
  <p class="lede">A power divider takes one input and shares its power among N outputs. This tool designs four kinds — the Wilkinson, the lossless T-junction (branching line), the resistive divider and the corporate tree built from 2-way junctions — and draws each to scale in microstrip. Every curve comes from a circuit solve of the drawn design, not from a formula.</p>

  <h2>1 · The three-port theorem</h2>
  <p>A three-port cannot be at once lossless, reciprocal and matched at all three ports (Pozar §7.1). Every divider gives one property up:</p>
  <table class="sheet doc-t"><thead><tr><th>Divider</th><th>Lossless</th><th>Reciprocal</th><th>All ports matched</th><th>Outputs isolated</th><th>Gives up</th></tr></thead><tbody>
  <tr><td>Wilkinson</td><td>for the input signal; R absorbs power reflected by the outputs</td><td>yes</td><td>yes</td><td>yes</td><td>losslessness (odd mode)</td></tr>
  <tr><td>Lossless T / branching line</td><td>yes</td><td>yes</td><td>input only</td><td>no</td><td>output match</td></tr>
  <tr><td>Resistive (Y or Δ)</td><td>no: half the power for N = 2</td><td>yes</td><td>yes</td><td>no (−6.02 dB between outputs)</td><td>losslessness</td></tr>
  <tr><td>Circulator (not here)</td><td>yes</td><td>no</td><td>yes</td><td>—</td><td>reciprocity</td></tr></tbody></table>

  <h2>2 · The Wilkinson: even and odd modes</h2>
  <p>Drive ports 2 and 3 of the equal 2-way together (even mode): the two output nodes sit at the same voltage, no current flows in ${mth('<i>R</i>')}, and the plane of symmetry is an open circuit. Each half is a λ/4 line of ${mth('<i>Z</i>')} between port 2 (${mth('<i>Z</i><sub>0</sub>')}) and the input seen as ${mth('2<i>Z</i><sub>0</sub>')}: it matches when ${mth('<i>Z</i> = √2 <i>Z</i><sub>0</sub> = 70.7 Ω')}.</p>
  <p>Drive them in antiphase (odd mode): the plane of symmetry is a virtual ground, so the λ/4 line is shorted at the input end and looks open at port 2; the half resistor ${mth('<i>R</i>/2')} to ground is all port 2 sees, and it matches when ${mth('<i>R</i> = 2<i>Z</i><sub>0</sub> = 100 Ω')}.</p>
  <div class="eq">${mth('<i>S</i><sub>21</sub> = <i>S</i><sub>31</sub> = −j/√2 &nbsp;(−3.01 dB ∠−90°), &nbsp; <i>S</i><sub>11</sub> = <i>S</i><sub>22</sub> = <i>S</i><sub>33</sub> = <i>S</i><sub>23</sub> = 0')}</div>
  <p>For N outputs the arms are ${mth('√<i>N</i> <i>Z</i><sub>0</sub>')} and a star of N resistors ${mth('<i>R</i> = <i>Z</i><sub>0</sub>')} meets at a floating centre — not planar for N > 2 (air bridges).</p>

  <h2>3 · Unequal split</h2>
  <p>With ${mth('<i>K</i><sup>2</sup> = <i>P</i><sub>2</sub>/<i>P</i><sub>3</sub>')} (port 2 the stronger), the arms bring the input to ${mth('<i>Z</i><sub>0</sub>/<i>K</i>')} and ${mth('<i>K Z</i><sub>0</sub>')} at the resistor plane (Pozar §7.3, with the ports named so that port 2 is the stronger):</p>
  <div class="eq">${mth('<i>Z</i><sub>arm,2</sub> = <i>Z</i><sub>0</sub> √((1 + <i>K</i><sup>2</sup>)/<i>K</i><sup>3</sup>), &nbsp; <i>Z</i><sub>arm,3</sub> = <i>Z</i><sub>0</sub> √(<i>K</i>(1 + <i>K</i><sup>2</sup>)), &nbsp; <i>R</i> = <i>Z</i><sub>0</sub>(<i>K</i> + 1/<i>K</i>)')}</div>
  <p>λ/4 transformers ${mth('<i>Z</i><sub>0</sub>/√<i>K</i>')} and ${mth('<i>Z</i><sub>0</sub>√<i>K</i>')} bring both outputs back to ${mth('<i>Z</i><sub>0</sub>')}. At 2:1 and 50 Ω: 51.5 Ω and 103.0 Ω arms, ${mth('<i>R</i>')} = 106.1 Ω, transformers 42.0 Ω and 59.5 Ω. The weak arm narrows fast (0.65 mm at 2:1 on 1.6 mm FR-4, 0.14 mm at 4:1): beyond about 3:1–4:1 a thinner substrate or another topology is needed. The Designer flags any width below the minimum you set.</p>
  <p>Multisection unequal: both arms are the same normalised taper from ${mth('(1 + <i>K</i><sup>2</sup>)/<i>K</i>')} to 1, scaled to their plane impedance, and the output transformers are tapers too; the resistors start from the scaled equal-split values and are refined with the full circuit solver (below).</p>

  <h2>4 · Output mismatch: where the reflected power goes</h2>
  <p>With matched, isolated outputs the input reflection is set by the loads alone:</p>
  <div class="eq">${mth('Γ<sub>in</sub> = <i>S</i><sub>21</sub><sup>2</sup> Γ<sub>2</sub> + <i>S</i><sub>31</sub><sup>2</sup> Γ<sub>3</sub> &nbsp; (equal split: Γ<sub>in</sub> = −(Γ<sub>2</sub> + Γ<sub>3</sub>)/2)')}</div>
  <p><b>A single mismatch is not hidden from the input.</b> Port 3 with |Γ<sub>3</sub>| = 0.5 reflects 0.25 × 50 % = 12.5 % of the input. That wave splits like any wave entering port 3: half (6.25 %) into ${mth('<i>R</i>')}, half (6.25 %) back to the source — |Γ<sub>in</sub>| = 0.25. The other output is untouched (50 %), and port 3 delivers 37.5 %. A <b>symmetric</b> mismatch (Γ<sub>2</sub> = Γ<sub>3</sub>) is pure even mode: nothing flows in ${mth('<i>R</i>')}, and all the reflected power (25 % at |Γ| = 0.5) returns to the input. The resistor protects the <i>other</i> output, not the source.</p>

  <h2>5 · Multisection: bandwidth and the isolation resistors</h2>
  <p>A single λ/4 section is narrowband. Cascading M sections with a binomial (maximally flat) or Chebyshev (equal-ripple) taper from ${mth('<i>N Z</i><sub>0</sub>')} at the junction to ${mth('<i>Z</i><sub>0</sub>')} widens the match, and a resistor at every section plane keeps the outputs matched and isolated (Cohn 1968).</p>
  <p><b>Method used here.</b> In the even mode one arm sees ${mth('<i>N Z</i><sub>0</sub>')} at the junction end; in the odd mode the junction is a virtual ground and each resistor is a shunt ${mth('<i>R</i>/2')} (2-way bridge) or ${mth('<i>R</i>')} (star). With Γ<sub>e</sub> and Γ<sub>o</sub> seen from an output,</p>
  <div class="eq">${mth('<i>S</i><sub>jj</sub> = (Γ<sub>e</sub> + (<i>N</i> − 1)Γ<sub>o</sub>)/<i>N</i>, &nbsp; <i>S</i><sub>ij</sub> = (Γ<sub>e</sub> − Γ<sub>o</sub>)/<i>N</i>')}</div>
  <p>The resistors minimise the largest ${mth('|<i>S</i><sub>jj</sub>|')} or ${mth('|<i>S</i><sub>ij</sub>|')} over the band where ${mth('|<i>S</i><sub>11</sub>| ≤ −20 dB')} (Nelder–Mead on ln <i>R</i>). For an unequal split they are then refined with the full three-port solver over the same band. Check against Cohn's closed form for his two-section 2:1-band design (sections 1.6398 and 1.2197 × <i>Z</i><sub>0</sub>): Cohn 98.0 / 241.0 Ω, this method 96.7 / 236 Ω, with the same worst odd-mode ripple (−28.9 dB).</p>
  <p><b>Why the −20 dB band.</b> Since Γ<sub>e</sub> has the magnitude of ${mth('<i>S</i><sub>11</sub>')}, ${mth('|<i>S</i><sub>22</sub>|')} or ${mth('|<i>S</i><sub>23</sub>|')} is at least ${mth('|<i>S</i><sub>11</sub>|/2')} wherever Γ<sub>o</sub> is small: at the edge of the −15 dB ${mth('<i>S</i><sub>11</sub>')} band that is already −21 dB, so −20 dB output match and isolation can be met only inside the band where ${mth('<i>S</i><sub>11</sub>')} itself is below −20 dB.</p>
  <table class="sheet doc-t"><thead><tr><th>Sections (binomial, 50 Ω)</th><th>R, junction → output (Ω)</th><th>S11 ≤ −20 dB band</th><th>worst S22, S33, S23 in it</th><th>S11 −15 dB band</th><th>usable −15 dB band</th></tr></thead><tbody>${rtab}</tbody></table>

  <h2>6 · Lossless T-junction and resistive divider</h2>
  <p>T-junction (branching line): the output lines ${mth('<i>Z</i><sub>i</sub> = <i>Z</i><sub>0</sub>/<i>p</i><sub>i</sub>')} (${mth('<i>p</i><sub>i</sub>')} the share of power) are in parallel at the junction, so ${mth('1/<i>Z</i><sub>2</sub> + 1/<i>Z</i><sub>3</sub> = 1/<i>Z</i><sub>0</sub>')} and the input is matched — but only while each line ends in its own ${mth('<i>Z</i><sub>i</sub>')}. λ/4 transformers ${mth('√(<i>Z</i><sub>0</sub><i>Z</i><sub>i</sub>)')} make the outputs ${mth('<i>Z</i><sub>0</sub>')} loads possible. The outputs stay unmatched (|<i>S</i><sub>22</sub>| = 0.5 for the equal split) and see each other (|<i>S</i><sub>23</sub>| = 0.5).</p>
  <p>Resistive divider: N + 1 resistors ${mth('<i>R</i> = <i>Z</i><sub>0</sub>(<i>N</i> − 1)/(<i>N</i> + 1)')} from every port to a centre (Z₀/3 = 16.7 Ω for N = 2), or the equivalent Δ of ${mth('<i>Z</i><sub>0</sub>(<i>N</i> − 1)')} between every pair. Every port is matched and ${mth('|<i>S</i><sub>ij</sub>| = 1/<i>N</i>')}: −6.02 dB for N = 2, half the input lost in the resistors, no isolation, and no frequency dependence.</p>

  <h2>7 · Branching cascades (corporate trees)</h2>
  <p>N outputs from 2-way junctions: each junction splits its outputs ⌊n/2⌋ : ⌈n/2⌉ in the ratio of the power wanted below it — N = 3 is 1:2 then 1:1, N = 5 is 2:3, then 1:1 and 1:2 — and any junction's ratio can be edited (a tapered array feed sets them from an amplitude taper). The ideal split loss is ${mth('10 log<sub>10</sub><i>N</i>')} dB per output for an equal split.</p>
  <ul><li><b>Wilkinson modules</b> keep every port matched and isolated at every level.</li>
  <li><b>Branching lines</b> are lossless and small, but each junction's outputs are unmatched: reflections between stages build up, and the outputs are neither matched nor isolated.</li>
  <li><b>Resistive Y modules</b> lose 6.02 dB per stage: an 8-way resistive tree delivers −18.06 dB per output, against −9.03 dB.</li></ul>
  <p>For equal phase at the outputs every path from input to output must have the same electrical length. Interconnects are z₀ lines whose real lengths are in the model; where paths differ (non-binary N, mixed modules, an edited ratio adding transformers) the tool adds a serpentine delay line to the shorter output lines. Turn it off, or add a path error, to see the phase imbalance.</p>

  <h2>8 · Microstrip</h2>
  <p><b>Pozar (Wheeler) synthesis</b> (default; Pozar eq. 3.197): ${mth('<i>W</i>/<i>h</i>')} from ${mth('<i>Z</i>')} and ${mth('ε<sub>r</sub>')}, quasi-static ${mth('ε<sub>eff</sub> = (ε<sub>r</sub> + 1)/2 + (ε<sub>r</sub> − 1)/2 · (1 + 12<i>h</i>/<i>W</i>)<sup>−1/2</sup>')}, no dispersion, zero strip thickness. <b>Hammerstad–Jensen</b> (1980) gives ${mth('<i>Z</i>(<i>W</i>/<i>h</i>)')} and ${mth('ε<sub>eff</sub>')} to better than 0.2 %; the width is found by bisection and ${mth('ε<sub>eff</sub>')} is raised to its value at f₀ by the Kirschning–Jansen (1982) dispersion model. Each section's length is ${mth('λ<sub>g</sub>/4 = <i>c</i>/(4<i>f</i><sub>0</sub>√ε<sub>eff</sub>)')} for its own width, so wider (lower-impedance) lines are slightly shorter.</p>

  <h2>9 · Folding the λ/4 lines</h2>
  <p>A λ/4 line can be bent into an arc (the two arms of a 2-way form the classic ring), a mitred bracket or a meander. The electrical length is held by keeping the <b>centreline</b> length at λ<sub>g</sub>/4 (a mitred corner counts to its sharp corner, a round corner along its arc). The footprint readout is the copper bounding box; "saved" compares it with the straight layout at the same port pitch.</p>
  <p><b>Limits.</b> Arcs need a radius of at least 3<i>W</i>; meander legs closer than 3<i>h</i> couple — coupling speeds the odd mode and shortens the line electrically; bends add capacitance (an optimum mitre, ${mth('<i>m</i> = 52 + 65 e<sup>−1.35<i>W</i>/<i>h</i></sup>')} % of the diagonal, Douville & James 1978, cancels most of it). <b>None of these is in the circuit model</b>: the curves are those of ideal λ/4 lines, and the warnings show where the drawing would detune a real board. The junction bar, the width steps and the T-junction parasitics are drawn but not modelled either; no Kirschning–Jansen bend or T-junction correction is applied in this version.</p>
  <p><b>Outputs and connectors.</b> The two outputs of a 2-way stage leave the output node as separate z₀ lines turning straight outward; where the last section is an arc (or a tight meander or bracket) each arm first continues for a short stub at its own width. In a tree these stubs are in the model (at the arm's impedance) and cost a little match; on a single divider they are drawn only. The SMA connectors (edge launch at the board edge, vertical inside an H-tree) are drawn, not modelled: the ports are referred to the trace ends.</p>

  <h2>10 · How the curves are computed</h2>
  <p>Each line is a lossy two-port, ${mth('<i>Y</i><sub>11</sub> = coth(γℓ)/<i>Z</i>')} and ${mth('<i>Y</i><sub>12</sub> = −1/(<i>Z</i> sinh γℓ)')} with ${mth('γℓ = αℓ + jβℓ')}, stamped into a nodal admittance matrix with the resistors; the internal nodes are eliminated (Kron reduction) and the port matrix is converted to ${mth('<b>S</b> = (<i>y</i><sub>0</sub><b>I</b> − <b>Y</b>)(<i>y</i><sub>0</sub><b>I</b> + <b>Y</b>)<sup>−1</sup>')}. With loads, the node voltages are solved and every power is computed from its own element: reflected, delivered to each load, absorbed in each resistor and lost in each line. Their sum is the energy-balance check (100 % ± 0.1 %).</p>
  <p class="refs">References: D. M. Pozar, <i>Microwave Engineering</i>, 4th ed., Wiley, 2012. E. J. Wilkinson, "An N-way hybrid power divider," IRE Trans. MTT 8(1), 1960. S. B. Cohn, "A class of broadband three-port TEM-mode hybrids," IEEE Trans. MTT 16(2), 1968. E. Hammerstad, Ø. Jensen, IEEE MTT-S Digest, 1980. M. Kirschning, R. H. Jansen, Electron. Lett. 18(6), 1982. R. J. P. Douville, D. S. James, IEEE Trans. MTT 26(3), 1978. "Design forms of branching lines for microstrip power dividers" (ResearchGate 224140169). Marki Microwave, "How to make an N-way power splitter".</p>
  </article>`;
}

      worstL = Math.max(worstL, Math.abs(hit.getTotalLength() - e.path.len) * k);
      if(cu.tagName === 'path') worstW = Math.max(worstW, Math.abs(parseFloat(cu.getAttribute('stroke-width')) - e.W) * k);
      else { const r = cu.getBBox(), horiz = Math.abs(e.path.pts[0].y - e.path.pts[e.path.pts.length - 1].y) < 1e-9 && e.path.pts.length === 2;
        if(horiz) worstW = Math.max(worstW, Math.abs(r.height - e.W) * k); } });
    const rect = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, scale = rect.width / vb.width;
    document.body.removeChild(svg);
    return { pass: n > 0 && worstL <= 1 && worstW <= 1 && near(scale, k, 0.01), got: `${n} sections at ${k} px/mm: worst length ${worstL.toFixed(3)} px, worst width ${worstW.toFixed(3)} px; scale ${scale.toFixed(3)} px/mm` }; }],
  ['§6 Performance: a full update of a 16-output tree with 4 sections takes < 100 ms (layout, sweep, drawing)', async () => {
    const keep = JSON.stringify(S), was = currentPage;
    Object.assign(S, { topology: 'tree', M: 4, shapes: new Array(MAX_SEC).fill('straight') }); S.tree = tTree(16); S.tree.layout = 'binary'; S.tree.equalise = true; S.tree.pathErr = 0;
    showPage('designer'); update(true); await new Promise(r => setTimeout(r, 30));
    const times = [];
    for(let i = 0; i < 5; i++){ S.ratioDB = 0.1 * i; const t0 = performance.now(); update(false); times.push(performance.now() - t0); }
    for(let i = 0; i < 3; i++){ S.tree.pathErr = i; const t0 = performance.now(); update(true); times.push(performance.now() - t0); }
    mergeInto(S, JSON.parse(keep)); showPage(was); update(true);
    const med = times.slice().sort((a, b) => a - b)[Math.floor(times.length / 2)], mx = Math.max(...times);
    return { pass: med < 100, got: `median ${med.toFixed(0)} ms, worst ${mx.toFixed(0)} ms over ${times.length} updates` }; }],
];}
function mergeInto(dst, src){ for(const k in src) dst[k] = src[k]; }
function testSvg(){ const s = svgEl('svg', { class: 'testsvg', width: 400, height: 300, viewBox: '0 0 40 30' }); document.body.append(s); return s; }
// Rasterise the copper of a layout (pads included) at 20 px/mm and return the inked bounding box in mm.
async function rasterBox(t){
  const k = 20, b = t.lay.bbox, m = 3, svg = testSvg();
  const vb = [b.x0 - m, b.y0 - m, b.w + 2 * m, b.h + 2 * m];
  svg.setAttribute('viewBox', vb.join(' ')); svg.setAttribute('width', vb[2] * k); svg.setAttribute('height', vb[3] * k);
  drawOneLayout(svg, t.lay, t, k, 0, { main: false });
  svg.querySelectorAll('.board, .fpbox, text, .halo, .hit, .rbody, .bridge, .bridgedot').forEach(n => n.remove());
  svg.querySelectorAll('polygon, rect').forEach(n => n.setAttribute('fill', '#000'));
  svg.querySelectorAll('path.cu').forEach(n => { n.setAttribute('stroke', '#000'); n.setAttribute('fill', 'none'); });
  svg.setAttribute('xmlns', NS);
  const src = new XMLSerializer().serializeToString(svg); document.body.removeChild(svg);
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
  const cv = document.createElement('canvas'); cv.width = Math.ceil(vb[2] * k); cv.height = Math.ceil(vb[3] * k);
  const g2 = cv.getContext('2d'); g2.drawImage(img, 0, 0, cv.width, cv.height);
  const d = g2.getImageData(0, 0, cv.width, cv.height).data; let x0 = Infinity, y0 = Infinity, x1 = -1, y1 = -1;
  for(let y = 0; y < cv.height; y++) for(let x = 0; x < cv.width; x++) if(d[(y * cv.width + x) * 4 + 3] > 127){ if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; }
  return { x0: vb[0] + x0 / k, x1: vb[0] + (x1 + 1) / k, y0: vb[1] + y0 / k, y1: vb[1] + (y1 + 1) / k };
}
async function runTests(){
  const box = $('testsBody'), rows = [];
  box.innerHTML = '<p class="hint">Running…</p>';
  const run = async ([name, fn]) => { const t0 = performance.now(); let r; try { r = await fn(); } catch(e){ r = { pass: false, got: 'error: ' + e.message }; }
    rows.push({ name, pass: r.pass, got: r.got, ms: performance.now() - t0 }); };
  for(const t of TESTS()) await run(t);
  for(const t of ASYNC_TESTS()) await run(t);
  const np = rows.filter(r => r.pass).length;
  box.innerHTML = `<article class="doc"><h1>Tests</h1><p class="lede"><b class="${np === rows.length ? 'okc' : 'bad'}">${np} of ${rows.length} passed.</b> Each test builds its own design; values are computed now, in this page.</p>
    <table class="sheet tests"><thead><tr><th>Result</th><th class="l">Test</th><th class="l">Measured</th><th>ms</th></tr></thead><tbody>` +
    rows.map(r => `<tr class="${r.pass ? 'tpass' : 'tfail'}"><td>${r.pass ? 'PASS' : 'FAIL'}</td><td class="l">${r.name}</td><td class="l num">${r.got}</td><td>${r.ms.toFixed(0)}</td></tr>`).join('') +
    `</tbody></table><p><button id="rerun">Run again</button></p></article>`;
  $('rerun').addEventListener('click', runTests);
  box.dataset.done = String(np) + '/' + rows.length;
}

/* Power Divider Designer — application shell: pages, the update cycle (synthesis → layout → solve → draw), deferred
   resistor refinement, theme, start-up. */
let D = null, pendingTimer = 0, currentPage = 'designer', docsBuilt = false;
const PAGES = ['designer', 'perf', 'params', 'theory', 'exp', 'tests'];
/* Recompute and redraw the visible page. full: also rebuild the sidebar (a button or a mode changed); while a slider is
   dragged (full = false) the sidebar is kept, so the slider keeps focus, and unequal-resistor refinement is deferred. */
function update(full){
  REFINE.defer = true;
  D = derive();
  save();
  if(currentPage === 'designer'){
    if(full) buildSide(D);
    syncSide(D); if(S.view3d) show3d(D); else drawLayout(D); drawOutputs(D);
  } else if(currentPage === 'perf') drawPerf(D);
  else if(currentPage === 'params') drawParams(D);
  $('cmpBtn').setAttribute('aria-pressed', String(!!S.compare)); $('flowBtn').setAttribute('aria-pressed', String(!!S.overlay)); $('v3Btn').setAttribute('aria-pressed', String(!!S.view3d));
  $('layoutWrap').classList.toggle('v3', !!S.view3d); $('cmpBtn').disabled = $('flowBtn').disabled = !!S.view3d;
  clearTimeout(pendingTimer);
  if(REFINE.pending.size) pendingTimer = setTimeout(function step(){ const more = runPending(); if(!more) update(false); else pendingTimer = setTimeout(step, 0); }, 120);
}
// Readouts in the sidebar that change while a slider moves.
function syncSide(Dd){
  const tgt = splitTarget(Dd);
  if($('ratioVal') && tgt.enabled){
    const v = tgt.get(), fr = powerSplit(v);
    $('ratioVal').textContent = ratioText(v) + '  (' + fmt(v, 2) + ' dB)';
    $('ratioPct').textContent = (fr[0] * 100).toFixed(1) + ' / ' + (fr[1] * 100).toFixed(1) + ' %';
    const t = $('ratioText'); if(t && document.activeElement !== t){ t.value = ratioText(v); t.classList.remove('invalid'); }
    const r = $('ratioSlider'); if(r && document.activeElement !== r) r.value = String(v);
  }
  const m = microstrip(S.z0, S.er, S.h, S.f0, S.msModel);
  if($('subInfo')) $('subInfo').textContent = `Z₀ line: W ${m.W.toFixed(3)} mm, ε_eff ${m.eeff.toFixed(3)}, λg ${m.lambdaG.toFixed(2)} mm`;
  const st = Dd.design.stage, pend = st && st.refined === false || (isTree() && Dd.design.tree.junctions.some(j => j.stage.refined === false));
  const w = Dd.lay.warnings.slice(0, 12).map(x => el('div', { class: 'warnline', text: '⚠ ' + x }));
  if(Dd.lay.warnings.length > 12) w.push(el('div', { class: 'warnline', text: '… and ' + (Dd.lay.warnings.length - 12) + ' more (hover the red elements)' }));
  if(pend) w.unshift(el('div', { class: 'hint', text: 'Refining the unequal-split resistors…' }));
  $('warnBox').replaceChildren(...w);
}
function showPage(p){
  if(!PAGES.includes(p)) p = 'designer';
  currentPage = p;
  PAGES.forEach(q => { const on = q === p, b = $('tab_' + q); b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; $('pg_' + q).classList.toggle('on', on); });
  if((p === 'theory' || p === 'exp') && !docsBuilt){ buildTheory(); buildExperiments(); docsBuilt = true; }
  if(p === 'tests' && !$('testsBody').dataset.done) runTests();
  if(p === 'designer' || p === 'perf' || p === 'params') requestAnimationFrame(() => update(true));
}
function applyTheme(dark){ document.body.classList.toggle('dark', dark); $('themeBtn').textContent = dark ? 'Light' : 'Dark'; $('themeBtn').setAttribute('aria-label', 'Switch to the ' + (dark ? 'light' : 'dark') + ' theme'); }
// ── START-UP ──
PAGES.forEach(p => $('tab_' + p).addEventListener('click', () => showPage(p)));
$('tabs').addEventListener('keydown', e => { const i = PAGES.indexOf(currentPage);
  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ e.preventDefault(); const n = PAGES[(i + (e.key === 'ArrowRight' ? 1 : PAGES.length - 1)) % PAGES.length]; showPage(n); $('tab_' + n).focus(); } });
$('themeBtn').addEventListener('click', () => applyTheme(!document.body.classList.contains('dark')));
$('cmpBtn').addEventListener('click', () => { S.compare = !S.compare; update(false); });
$('flowBtn').addEventListener('click', () => { S.overlay = !S.overlay; update(false); });
$('v3Btn').addEventListener('click', () => { S.view3d = !S.view3d; update(false); if(S.view3d) $('view3d').focus(); });
wire3d();
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if(D) update(false); }, 120); });
S.sel = '';
applyTheme(false);
update(true);
})();
</script>
