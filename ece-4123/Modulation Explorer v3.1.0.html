rd.textContent = state[key].toFixed(dp);\n}\nbindAnalogSlider('sl-fm',     'rd-fm',     'fm',      2);\nbindAnalogSlider('sl-am',     'rd-am',     'Am',      2);\nbindAnalogSlider('sl-fc',     'rd-fc',     'fc',      2);\nbindAnalogSlider('sl-ac',     'rd-ac',     'Ac',      2);\nbindAnalogSlider('sl-kf',     'rd-kf',     'kf',      2);\nbindAnalogSlider('sl-ktheta', 'rd-ktheta', 'kTheta',  2);\n\ndocument.getElementById('sel-am-mode').addEventListener('change', (e) => {\n  state.amMode = e.target.value;\n  markDirty(); updateAnalogMetrics(); renderAllAnalogPanels();\n});\n\n/* §11.3  Digital scheme selector */\ndocument.querySelectorAll('.scheme-box').forEach((box) => {\n  box.addEventListener('click', () => {\n    document.querySelectorAll('.scheme-box').forEach(b => b.classList.remove('active'));\n    box.classList.add('active');\n    dstate.scheme = box.dataset.scheme;\n    document.getElementById('fsk-controls').classList.toggle('hidden', dstate.scheme !== 'FSK');\n    document.getElementById('dpanel3-label').textContent =\n      'Panel 3 \\u2014 Modulated  s(t)  [' + dstate.scheme + ']';\n    dmarkDirty(); updateDigitalMetrics(); renderAllDigitalPanels();\n  });\n});\n\nfunction bindDigitalSlider(id, readoutId, key, dp) {\n  const sl = document.getElementById(id), rd = document.getElementById(readoutId);\n  sl.addEventListener('input', () => {\n    dstate[key] = parseFloat(sl.value);\n    rd.textContent = dstate[key].toFixed(dp);\n    dmarkDirty(); updateDigitalMetrics(); renderAllDigitalPanels();\n  });\n  rd.textContent = dstate[key].toFixed(dp);\n}\nbindDigitalSlider('dsl-fc', 'drd-fc', 'fc',     2);\nbindDigitalSlider('dsl-ac', 'drd-ac', 'Ac',     2);\nbindDigitalSlider('dsl-rb', 'drd-rb', 'Rb',     2);\nbindDigitalSlider('dsl-df', 'drd-df', 'deltaF', 2);\n\n/* §11.4  Panel expand overlay — handles both domains */\nconst overlay   = document.getElementById('expand-overlay');\nconst expCanvas = document.getElementById('expand-canvas');\nconst expLabel  = document.getElementById('expand-label');\n\n/* Analog PANEL_META — unchanged from v1.1.4 */\nconst PANEL_META = [\n  { label: 'Panel 1 \\u2014 Message  m(t)',     type: 'time',     color: CLR_MESSAGE   },\n  { label: 'Panel 2 \\u2014 Carrier  c(t)',     type: 'time',     color: CLR_CARRIER   },\n  { label: 'Panel 3 \\u2014 Modulated  s(t)',   type: 'time',     color: CLR_MODULATED },\n  { label: 'Panel 4 \\u2014 Spectrum  |S(f)|',  type: 'spectrum', color: CLR_SPECTRUM  },\n  { label: 'Panel 5 \\u2014 Spectrum  |M(f)|',  type: 'spectrum', color: CLR_MESSAGE   },\n];\n\n/* Digital PANEL_META */\nconst DPANEL_META = [\n  { label: 'Panel 1 \\u2014 Bit Stream  m[n]',   type: 'dtime',         color: CLR_MESSAGE   },\n  { label: 'Panel 2 \\u2014 Carrier  c(t)',       type: 'time',          color: CLR_CARRIER   },\n  { label: 'Panel 3 \\u2014 Modulated  s(t)',     type: 'time',          color: CLR_MODULATED },\n  { label: 'Panel 4 \\u2014 Spectrum  |S(f)|',    type: 'spectrum',      color: CLR_SPECTRUM  },\n  { label: 'Panel 5 \\u2014 Spectrum  |M(f)|',    type: 'spectrum',      color: CLR_MESSAGE   },\n  { label: 'Panel 6 \\u2014 Constellation  I-Q',  type: 'constellation', color: CLR_CONST_HI  },\n];\n\n/* Research PANEL_META — DEFECT-RT-002 fix */\nconst RPANEL_META = [\n  { label: 'Panel 1 \\u2014 Constellation  I-Q', type: 'constellation', color: CLR_CONST_HI  },\n  { label: 'Panel 2 \\u2014 Modulated  s(t)',     type: 'time',          color: CLR_MODULATED },\n  { label: 'Panel 3 \\u2014 Spectrum  |S(f)|',    type: 'spectrum',      color: CLR_SPECTRUM  },\n  { label: 'Panel 4 \\u2014 Spectrum  |M(f)|',    type: 'spectrum',      color: CLR_MESSAGE   },\n];\n\nlet expandedPanel  = -1;\nlet expandedDomain = 'analog';\n\ndocument.querySelectorAll('.panel-wrap').forEach((wrap) => {\n  wrap.addEventListener('click', () => {\n    expandedPanel  = parseInt(wrap.dataset.panel, 10);\n    expandedDomain = wrap.dataset.domain;\n    let meta;\n    if      (expandedDomain === 'digital')  meta = DPANEL_META[expandedPanel];\n    else if (expandedDomain === 'research') meta = RPANEL_META[expandedPanel];\n    else                                    meta = PANEL_META[expandedPanel];\n    let lbl = meta.label;\n    if (expandedDomain === 'analog'   && expandedPanel === 2) lbl += '  [' + state.mode + ']';\n    if (expandedDomain === 'digital'  && expandedPanel === 2) lbl += '  [' + dstate.scheme + ']';\n    expLabel.textContent = lbl;\n    overlay.classList.add('visible');\n    const r = document.getElementById('expand-container').getBoundingClientRect();\n    expCanvas.width  = Math.floor(r.width);\n    expCanvas.height = Math.floor(r.height);\n    drawExpandPanel();\n  });\n});\n\nfunction drawExpandPanel() {\n  if (expandedPanel < 0) return;\n  let meta;\n  if      (expandedDomain === 'digital')  meta = DPANEL_META[expandedPanel];\n  else if (expandedDomain === 'research') meta = RPANEL_META[expandedPanel];\n  else                                    meta = PANEL_META[expandedPanel];\n  let lbl = meta.label;\n  if (expandedDomain === 'analog'  && expandedPanel === 2) lbl += '  [' + state.mode + ']';\n  if (expandedDomain === 'digital' && expandedPanel === 2) lbl += '  [' + dstate.scheme + ']';\n  expLabel.textContent = lbl;\n\n  if (expandedDomain === 'analog') {\n    recompute();\n    const fMax = specFMax(), nShow = displaySamples(state.fm);\n    const specOpts = { db: RENDER.spectrumDb, markers: RENDER.bwMarkers ? analogModMarkers() : [] };\n    switch (expandedPanel) {\n      case 0: drawTimeDomain(expCanvas, state.sigMessage,    meta.color, nShow); break;\n      case 1: drawTimeDomain(expCanvas, state.sigCarrier,    meta.color, nShow); break;\n      case 2: drawTimeDomain(expCanvas, state.sigModulated,  meta.color, nShow, { envelope: amEnvelope(nShow) }); break;\n      case 3: drawSpectrum  (expCanvas, state.specModulated, meta.color, fMax, specOpts);  break;\n      case 4: drawSpectrum  (expCanvas, state.specMessage,   meta.color, fMax, { db: RENDER.spectrumDb });  break;\n    }\n  } else if (expandedDomain === 'digital') {\n    drecompute();\n    const constl     = dstate.constellation;\n    const bitsPerSym = constl.bitsPerSym;\n    const sampPerSym = Math.round(SAMPLE_RATE / (dstate.Rb / bitsPerSym));\n    const nShow      = sampPerSym * DIGITAL_DISP_SYMS;\n    const fMax       = dspecFMax();\n    const ph         = { symIdx: dstate.currentSym, sampPerSym };\n    const hi         = dstate.symSeq[dstate.currentSym % dstate.symSeq.length];\n    switch (expandedPanel) {\n      case 0: drawDigitalBitStream(expCanvas, dstate.sigMessage,   nShow, dstate.Rb, bitsPerSym, SAMPLE_RATE, ph); break;\n      case 1: drawTimeDomain      (expCanvas, dstate.sigCarrier,   meta.color, nShow); break;\n      case 2: drawTimeDomain      (expCanvas, dstate.sigModulated, meta.color, nShow, { playhead: ph }); break;\n      case 3: drawSpectrum        (expCanvas, dstate.specModulated, meta.color, fMax, { db: RENDER.spectrumDb, markers: RENDER.bwMarkers ? digitalModMarkers() : [] }); break;\n      case 4: drawSpectrum        (expCanvas, dstate.specMessage,   meta.color, fMax, { db: RENDER.spectrumDb }); break;\n      case 5: drawConstellation   (expCanvas, constl, hi); break;\n    }\n  } else if (expandedDomain === 'research') {\n    /* DEFECT-RT-002 fix: Research panel index mapping */\n    rrecompute();\n    const pts = rstate.points;\n    if (pts.length < 2) return;\n    const constl     = buildResearchConstellation();\n    const bitsPerSym = constl.bitsPerSym;\n    const sampPerSym = Math.round(SAMPLE_RATE / (rstate.Rb / bitsPerSym));\n    const nShow      = sampPerSym * DIGITAL_DISP_SYMS;\n    const fMax       = rspecFMax();\n    const ph         = { symIdx: rstate.currentSym, sampPerSym };\n    switch (expandedPanel) {\n      case 0: drawConstellation(expCanvas, constl, rstate.currentSym);                              break;\n      case 1: drawTimeDomain   (expCanvas, rstate.sigModulated, meta.color, nShow, { playhead: ph }); break;\n      case 2: drawSpectrum     (expCanvas, rstate.specModulated, meta.color, fMax, { db: RENDER.spectrumDb, markers: RENDER.bwMarkers ? researchModMarkers() : [] }); break;\n      case 3: drawSpectrum     (expCanvas, rstate.specMessage,   meta.color, fMax, { db: RENDER.spectrumDb }); break;\n    }\n  }\n}\n\ndocument.getElementById('expand-close').addEventListener('click', () => {\n  overlay.classList.remove('visible');\n  expandedPanel = -1;\n});\noverlay.addEventListener('click', (e) => {\n  if (e.target === overlay) { overlay.classList.remove('visible'); expandedPanel = -1; }\n});\n\n/* -----------------------------------------------------------\n   §11.5  Research IQ point entry — Add / Remove handlers\n   Points stored in rstate.points; labels reassigned on every change.\n   Minimum 2 points required before signal generation triggers.\n----------------------------------------------------------- */\nfunction renderPointList() {\n  const wrap     = document.getElementById('point-list-wrap');\n  const emptyEl  = document.getElementById('point-list-empty');\n  const pts      = rstate.points;\n\n  /* Remove existing point-item elements */\n  wrap.querySelectorAll('.point-item').forEach(el => el.remove());\n\n  if (pts.length === 0) {\n    emptyEl.style.display = '';\n    return;\n  }\n  emptyEl.style.display = 'none';\n\n  pts.forEach((pt, idx) => {\n    const item = document.createElement('div');\n    item.className = 'point-item';\n\n    const labelSpan = document.createElement('span');\n    labelSpan.className = 'point-item-label';\n    labelSpan.textContent = pt.label;\n\n    const coordSpan = document.createElement('span');\n    coordSpan.className = 'point-item-coords';\n    coordSpan.textContent = 'I=' + pt.I.toFixed(3) + '  Q=' + pt.Q.toFixed(3);\n\n    const removeBtn = document.createElement('button');\n    removeBtn.className = 'point-remove-btn';\n    removeBtn.textContent = 'Remove';\n    removeBtn.dataset.idx = idx;\n    removeBtn.addEventListener('click', () => {\n      rstate.points.splice(parseInt(removeBtn.dataset.idx, 10), 1);\n      relabelPoints(rstate.points);\n      renderPointList();\n      rmarkDirty();\n      updateResearchMetrics();\n      renderAllResearchPanels();\n    });\n\n    item.appendChild(labelSpan);\n    item.appendChild(coordSpan);\n    item.appendChild(removeBtn);\n    wrap.appendChild(item);\n  });\n}\n\ndocument.getElementById('iq-add-btn').addEventListener('click', () => {\n  const iVal = parseFloat(document.getElementById('iq-i-val').value);\n  const qVal = parseFloat(document.getElementById('iq-q-val').value);\n  if (isNaN(iVal) || isNaN(qVal)) return;\n  rstate.points.push({ I: iVal, Q: qVal, label: '' });\n  relabelPoints(rstate.points);\n  renderPointList();\n  rmarkDirty();\n  updateResearchMetrics();\n  renderAllResearchPanels();\n});\n\n/* Allow Enter key in either IQ input to trigger Add */\n['iq-i-val', 'iq-q-val'].forEach((id) => {\n  document.getElementById(id).addEventListener('keydown', (e) => {\n    if (e.key === 'Enter') document.getElementById('iq-add-btn').click();\n  });\n});\n\n/* -----------------------------------------------------------\n   §11.6  Research slider bindings\n----------------------------------------------------------- */\nfunction bindResearchSlider(id, readoutId, key, dp) {\n  const sl = document.getElementById(id), rd = document.getElementById(readoutId);\n  sl.addEventListener('input', () => {\n    rstate[key] = parseFloat(sl.value);\n    rd.textContent = rstate[key].toFixed(dp);\n    rmarkDirty(); updateResearchMetrics(); renderAllResearchPanels();\n  });\n  rd.textContent = rstate[key].toFixed(dp);\n}\nbindResearchSlider('rsl-fc', 'rrd-fc', 'fc', 2);\nbindResearchSlider('rsl-ac', 'rrd-ac', 'Ac', 2);\nbindResearchSlider('rsl-rb', 'rrd-rb', 'Rb', 2);\n\n/* -----------------------------------------------------------\n   §12  ANIMATION LOOP & INIT\n   Symbol advance for constellation animation: ~3 symbols/sec\n----------------------------------------------------------- */\nconst SYM_ADVANCE_MS = 333;\nlet lastSymTime = 0;\n\n/* Animation transport (classroom control) */\nconst TRANSPORT = { playing: true, speed: 1 };\n\n/* Advance the digital symbol pointer by one and redraw the synced panels */\nfunction digitalStep() {\n  if (!dstate.constellation || !dstate.symSeq) return;\n  dstate.currentSym = (dstate.currentSym + 1) % DIGITAL_DISP_SYMS;\n  const bitsPerSym = dstate.constellation.bitsPerSym;\n  const sampPerSym = Math.round(SAMPLE_RATE / (dstate.Rb / bitsPerSym));\n  const nShow      = sampPerSym * DIGITAL_DISP_SYMS;\n  const ph         = { symIdx: dstate.currentSym, sampPerSym };\n  const hi         = dstate.symSeq[dstate.currentSym % dstate.symSeq.length];\n  drawDigitalBitStream(digitalCanvases[0], dstate.sigMessage,   nShow, dstate.Rb, bitsPerSym, SAMPLE_RATE, ph);\n  drawTimeDomain      (digitalCanvases[2], dstate.sigModulated, CLR_MODULATED, nShow, { playhead: ph });\n  drawConstellation   (digitalCanvases[5], dstate.constellation, hi);\n  if (expandedDomain === 'digital' && (expandedPanel === 0 || expandedPanel === 2 || expandedPanel === 5)) drawExpandPanel();\n}\n\n/* Advance the research symbol pointer by one and redraw the synced panels */\nfunction researchStep() {\n  if (rstate.points.length < 2) return;\n  const constl = buildResearchConstellation();\n  rstate.currentSym = (rstate.currentSym + 1) % constl.points.length;\n  const bitsPerSym = constl.bitsPerSym;\n  const sampPerSym = Math.round(SAMPLE_RATE / (rstate.Rb / bitsPerSym));\n  const nShow      = sampPerSym * DIGITAL_DISP_SYMS;\n  const ph         = { symIdx: rstate.currentSym % DIGITAL_DISP_SYMS, sampPerSym };\n  drawConstellation(researchCanvases[0], constl, rstate.currentSym);\n  drawTimeDomain   (researchCanvases[1], rstate.sigModulated, CLR_MODULATED, nShow, { playhead: ph });\n  if (expandedDomain === 'research' && (expandedPanel === 0 || expandedPanel === 1)) drawExpandPanel();\n}\n\nfunction resizeCanvases() {\n  resizeAnalogCanvases();\n  resizeDigitalCanvases();\n  resizeResearchCanvases();\n  const ec = document.getElementById('expand-canvas');\n  const ew = document.getElementById('expand-container');\n  if (ew) { const r = ew.getBoundingClientRect(); ec.width=Math.floor(r.width); ec.height=Math.floor(r.height); }\n}\n\nfunction frame(ts) {\n  const domain = state.topDomain;\n  if (domain === 'analog') {\n    if (state.dirty) {\n      renderAllAnalogPanels();\n      updateAnalogMetrics();\n      state.dirty = false;\n      if (expandedPanel >= 0 && expandedDomain === 'analog') drawExpandPanel();\n    }\n  } else if (domain === 'digital') {\n    if (dstate.dirty) {\n      renderAllDigitalPanels();\n      updateDigitalMetrics();\n      dstate.dirty = false;\n      lastSymTime = ts;\n      if (expandedPanel >= 0 && expandedDomain === 'digital') drawExpandPanel();\n    } else if (TRANSPORT.playing && ts - lastSymTime > SYM_ADVANCE_MS / TRANSPORT.speed) {\n      /* Advance the symbol pointer and re-sync constellation highlight + waveform playhead */\n      digitalStep();\n      lastSymTime = ts;\n    }\n  } else if (domain === 'research') {\n    if (rstate.dirty) {\n      renderAllResearchPanels();\n      updateResearchMetrics();\n      rstate.dirty = false;\n      lastSymTime = ts;\n    } else if (TRANSPORT.playing && ts - lastSymTime > SYM_ADVANCE_MS / TRANSPORT.speed) {\n      /* Advance research constellation symbol pointer + waveform playhead */\n      researchStep();\n      lastSymTime = ts;\n    }\n  }\n  requestAnimationFrame(frame);\n}\n\nfunction init() {\n  resizeCanvases();\n  markDirty();\n  updateAnalogMetrics();\n  updateDigitalMetrics();\n  updateResearchMetrics();\n  renderPointList();\n  requestAnimationFrame(frame);\n}\n\n/* Render toolbar wiring (classroom view controls) */\nfunction rerenderActiveDomain() {\n  if (state.topDomain === 'digital') { dmarkDirty(); renderAllDigitalPanels(); }\n  else if (state.topDomain === 'research') { rmarkDirty(); renderAllResearchPanels(); }\n  else { markDirty(); renderAllAnalogPanels(); }\n  if (expandedPanel >= 0) drawExpandPanel();\n}\ndocument.querySelectorAll('#render-toolbar .rt-btn[data-opt]').forEach((btn) => {\n  btn.addEventListener('click', () => {\n    const opt = btn.dataset.opt, val = btn.dataset.val;\n    /* Only clear siblings that belong to the same option group */\n    btn.parentElement.querySelectorAll('.rt-btn[data-opt=\"' + opt + '\"]').forEach(b => b.classList.remove('active'));\n    btn.classList.add('active');\n    if (opt === 'spec') RENDER.spectrumDb = (val === 'db');\n    else if (opt === 'bw') RENDER.bwMarkers = (val === 'on');\n    else if (opt === 'env') RENDER.envelope = (val === 'on');\n    else if (opt === 'speed') TRANSPORT.speed = parseFloat(val);\n    rerenderActiveDomain();\n  });\n});\n\n/* Play / Pause toggle */\nconst playPauseBtn = document.getElementById('rt-playpause');\nplayPauseBtn.addEventListener('click', () => {\n  TRANSPORT.playing = !TRANSPORT.playing;\n  playPauseBtn.textContent = TRANSPORT.playing ? '\\u275a\\u275a Pause' : '\\u25b6 Play';\n  playPauseBtn.classList.toggle('active', !TRANSPORT.playing);\n  lastSymTime = performance.now();\n});\n\n/* Manual single-step (advances the current domain's symbol pointer by one) */\ndocument.getElementById('rt-step').addEventListener('click', () => {\n  if (state.topDomain === 'digital') { drecompute(); digitalStep(); }\n  else if (state.topDomain === 'research') { rrecompute(); researchStep(); }\n});\n\nwindow.addEventListener('resize', () => { resizeCanvases(); markDirty(); dmarkDirty(); rmarkDirty(); });\n\ninit();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"Modulation Explorer v3.1.0"}
