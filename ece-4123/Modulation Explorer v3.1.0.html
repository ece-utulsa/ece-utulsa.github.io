olor-border);\n  border-radius: var(--radius);\n  padding: 5px 10px;\n  font-family: var(--font-mono); font-size: 11px;\n  cursor: pointer; letter-spacing: 0.04em;\n  transition: background 0.15s, color 0.15s;\n}\n.scheme-box.active {\n  background: var(--color-modulated);\n  color: #0f1117;\n  border-color: var(--color-modulated);\n  font-weight: 700;\n}\n\n/* --- 10. Utility --- */\n.hidden { display: none !important; }\n\n/* --- Render toolbar (classroom view controls) --- */\n#render-toolbar {\n  flex-shrink: 0;\n  display: flex; align-items: center; gap: 22px; flex-wrap: wrap;\n  background: var(--color-surface);\n  border: 1px solid var(--color-border);\n  border-radius: var(--radius);\n  padding: 7px 14px;\n}\n.rt-group { display: flex; align-items: center; gap: 7px; }\n.rt-label { color: var(--color-label); font-size: 12px; letter-spacing: 0.04em; }\n.rt-seg { display: flex; gap: 2px; }\n.rt-btn {\n  background: var(--color-surface2);\n  color: var(--color-label);\n  border: 1px solid var(--color-border);\n  border-radius: var(--radius);\n  padding: 5px 14px;\n  font-family: var(--font-mono); font-size: 12px; font-weight: 600;\n  cursor: pointer; letter-spacing: 0.04em;\n  transition: background 0.15s, color 0.15s;\n}\n.rt-btn.active {\n  background: var(--color-accent);\n  color: #0f1117;\n  border-color: var(--color-accent);\n}\n.rt-btn:hover:not(.active) { color: var(--color-text); border-color: var(--color-accent); }\n\n/* --- 11. Research Tab --- */\n/* Research: 2×2 equal grid */\n#canvas-grid-research {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  grid-template-rows: 1fr 1fr;\n  gap: var(--panel-gap);\n  flex: 1; min-height: 0;\n}\n\n.iq-input-row {\n  display: flex;\n  gap: 4px;\n  align-items: center;\n}\n.iq-input-row input[type=number] {\n  background: var(--color-surface2);\n  color: var(--color-text);\n  border: 1px solid var(--color-border);\n  border-radius: var(--radius);\n  padding: 4px 6px;\n  font-family: var(--font-mono);\n  font-size: 11px;\n  width: 64px;\n  -moz-appearance: textfield;\n}\n.iq-input-row input[type=number]::-webkit-inner-spin-button,\n.iq-input-row input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }\n.iq-add-btn {\n  background: var(--color-accent);\n  color: #0f1117;\n  border: none;\n  border-radius: var(--radius);\n  padding: 4px 10px;\n  font-family: var(--font-mono);\n  font-size: 11px;\n  font-weight: 700;\n  cursor: pointer;\n  white-space: nowrap;\n}\n.iq-add-btn:hover { opacity: 0.85; }\n\n.point-list {\n  max-height: 130px;\n  overflow-y: auto;\n  border: 1px solid var(--color-border);\n  border-radius: var(--radius);\n  background: var(--color-surface2);\n}\n.point-list-empty {\n  color: var(--color-dim);\n  font-size: 10px;\n  padding: 8px;\n  text-align: center;\n}\n.point-item {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 4px 8px;\n  border-bottom: 1px solid var(--color-border);\n  font-size: 11px;\n}\n.point-item:last-child { border-bottom: none; }\n.point-item-label { color: var(--color-accent); font-weight: 700; margin-right: 6px; }\n.point-item-coords { color: var(--color-label); flex: 1; }\n.point-remove-btn {\n  background: none;\n  border: 1px solid #3a2a2a;\n  border-radius: 3px;\n  color: #fc8181;\n  font-family: var(--font-mono);\n  font-size: 9px;\n  padding: 1px 5px;\n  cursor: pointer;\n}\n.point-remove-btn:hover { background: #2a1a1a; }\n.rmetrics-panel {\n  background: var(--color-surface);\n  border: 1px solid var(--color-border);\n  border-radius: var(--radius);\n  padding: 8px 12px;\n  display: flex; flex-wrap: wrap; gap: 8px 16px;\n}\n\n/* Research right sidebar — third flex column in #app-shell, Research tab only */\n#research-right-sidebar {\n  width: var(--sidebar-width);\n  min-width: var(--sidebar-width);\n  background: var(--color-surface);\n  border-left: 1px solid var(--color-border);\n  display: flex;\n  flex-direction: column;\n  overflow-y: auto;\n  padding: 12px;\n  gap: 10px;\n}\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div id=\"app-shell\">\n\n  <!-- ===== SIDEBAR ===== -->\n  <aside id=\"sidebar\">\n\n    <!-- Top-level Analog / Digital tab bar -->\n    <div id=\"top-tab-bar\">\n      <button class=\"top-tab-btn active\" data-top=\"analog\">Analog<\u002Fbutton>\n      <button class=\"top-tab-btn\" data-top=\"digital\">Digital<\u002Fbutton>\n      <button class=\"top-tab-btn\" data-top=\"research\">Research<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- ============ ANALOG SIDEBAR ============ -->\n    <div id=\"analog-sidebar\">\n\n      <div id=\"analog-tab-bar\">\n        <button class=\"tab-btn active\" data-mode=\"AM\">AM<\u002Fbutton>\n        <button class=\"tab-btn\" data-mode=\"FM\">FM<\u002Fbutton>\n        <button class=\"tab-btn\" data-mode=\"PM\">PM<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"section-header\">Message Signal  m(t)<\u002Fdiv>\n      <div class=\"control-group\">\n        <div class=\"control-row\">\n          <div class=\"control-label\"><span>Waveform<\u002Fspan><\u002Fdiv>\n          <select id=\"sel-waveform\">\n            <option value=\"sine\">Sine<\u002Foption>\n            <option value=\"square\">Square<\u002Foption>\n            <option value=\"triangle\">Triangle<\u002Foption>\n            <option value=\"custom\">Custom expression<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div id=\"custom-expr-row\" class=\"control-row hidden\">\n          <div class=\"control-label\"><span>m(t) = f(t)   — use variable t<\u002Fspan><\u002Fdiv>\n          <textarea id=\"custom-expr\" placeholder=\"e.g.  sin(2*pi*t) + 0.5*sin(6*pi*t)\"><\u002Ftextarea>\n          <div class=\"expr-error\" id=\"expr-error\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"control-row\">\n          <div class=\"control-label\">\n            <span>f<sub style=\"font-size:9px\">m<\u002Fsub> — Message freq (kHz)<\u002Fspan>\n            <span class=\"readout\" id=\"rd-fm\">1.00<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" id=\"sl-fm\" min=\"0.5\" max=\"5\" step=\"0.1\" value=\"1\">\n        <\u002Fdiv>\n        <div class=\"control-row\">\n          <div class=\"control-label\">\n            <span>A<sub style=\"font-size:9px\">M<\u002Fsub> — Message amplitude<\u002Fspan>\n            <span class=\"readout\" id=\"rd-am\">1.00<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" id=\"sl-am\" min=\"0.1\" max=\"2\" step=\"0.05\" value=\"1\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"section-header\">Carrier Signal  c(t)<\u002Fdiv>\n      <div class=\"control-group\">\n        <div class=\"control-row\">\n          <div class=\"control-label\">\n            <span>f<sub style=\"font-size:9px\">c<\u002Fsub> — Carrier freq (kHz)<\u002Fspan>\n            <span class=\"readout\" id=\"rd-fc\">10.00<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" id=\"sl-fc\" min=\"5\" max=\"30\" step=\"1\" value=\"10\">\n        <\u002Fdiv>\n        <div class=\"control-row\">\n          <div class=\"control-label\">\n            <span>A<sub style=\"font-size:9px\">C<\u002Fsub> — Carrier amplitude<\u002Fspan>\n            <span class=\"readout\" id=\"rd-ac\">1.00<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" id=\"sl-ac\" min=\"0.5\" max=\"2\" step=\"0.05\" value=\"1\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"am-controls\">\n        <div class=\"section-header\">AM Parameters<\u002Fdiv>\n        <div class=\"control-group\">\n          <div class=\"control-row\">\n            <div class=\"control-label\">\n              <span>k — Modulation index (A<sub style=\"font-size:9px\">M<\u002Fsub>/A<sub style=\"font-size:9px\">C<\u002Fsub>)<\u002Fspan>\n              <span class=\"readout\" id=\"rd-k\">1.00<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-row\">\n            <div class=\"control-label\"><span>SSB / DSB<\u002Fspan><\u002Fdiv>\n            <select id=\"sel-am-mode\">\n              <option value=\"DSB-LC\">AM — Double Sideband LC (standard)<\u002Foption>\n              <option value=\"SSB-USB\">SSB — Upper Sideband<\u002Foption>\n              <option value=\"SSB-LSB\">SSB — Lower Sideband<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"fm-controls\" class=\"hidden\">\n        <div class=\"section-header\">FM Parameters<\u002Fdiv>\n        <div class=\"control-group\">\n          <div class=\"control-row\">\n            <div class=\"control-label\">\n              <span>k<sub style=\"font-size:9px\">f<\u002Fsub> — Deviation constant (kHz/V)<\u002Fspan>\n              <span class=\"readout\" id=\"rd-kf\">5.00<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"range\" id=\"sl-kf\" min=\"0.5\" max=\"15\" step=\"0.5\" value=\"5\">\n          <\u002Fdiv>\n          <div class=\"control-row\">\n            <div class=\"control-label\">\n              <span>β<sub style=\"font-size:9px\">f<\u002Fsub> = k<sub style=\"font-size:9px\">f<\u002Fsub>·A<sub style=\"font-size:9px\">M<\u002Fsub> / W<\u002Fspan>\n              <span class=\"readout\" id=\"rd-betaf\">10.00<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-row\">\n            <div class=\"control-label\">\n              <span>Δf = k<sub style=\"font-size:9px\">f<\u002Fsub>·A<sub style=\"font-size:9px\">M<\u002Fsub> (kHz)<\u002Fspan>\n              <span class=\"readout\" id=\"rd-deltaf\">5.00<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"pm-controls\" class=\"hidden\">\n        <div class=\"section-header\">PM Parameters<\u002Fdiv>\n        <div class=\"control-group\">\n          <div class=\"control-row\">\n            <div class=\"control-label\">\n              <span>k<sub style=\"font-size:9px\">θ<\u002Fsub> — Deviation constant (rad/V)<\u002Fspan>\n              <span class=\"readout\" id=\"rd-ktheta\">1.00<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"range\" id=\"sl-ktheta\" min=\"0.1\" max=\"6.28\" step=\"0.1\" value=\"1\">\n          <\u002Fdiv>\n          <div class=\"control-row\">\n            <div class=\"control-label\">\n              <span>β<sub style=\"font-size:9px\">P<\u002Fsub> = k<sub style=\"font-size:9px\">θ<\u002Fsub>·A<sub style=\"font-size:9px\">M<\u002Fsub><\u002Fspan>\n              <span class=\"readout\" id=\"rd-betap\">1.00<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-row\">\n            <div class=\"control-label\">\n              <span>Δθ = k<sub style=\"font-size:9px\">θ<\u002Fsub>·A<sub style=\"font-size:9px\">M<\u002Fsub> (rad)<\u002Fspan>\n              <span class=\"readout\" id=\"rd-deltatheta\">1.00<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"section-header\">Live Metrics<\u002Fdiv>\n      <div id=\"metrics-panel\">\n        <div class=\"metric-item\"><div class=\"metric-label\" id=\"ml-1\">k<\u002Fdiv><div class=\"metric-value\" id=\"mv-1\">—<\u002Fdiv><\u002Fdiv>\n        <div class=\"metric-item\"><div class=\"metric-label\" id=\"ml-2\">BW<\u002Fdiv><div class=\"metric-value\" id=\"mv-2\">—<\u002Fdiv><\u002Fdiv>\n        <div class=\"metric-item\"><div class=\"metric-label\" id=\"ml-3\">P<\u002Fdiv><div class=\"metric-value\" id=\"mv-3\">—<\u002Fdiv><\u002Fdiv>\n        <div class=\"metric-item\"><div class=\"metric-label\" id=\"ml-4\">Mode<\u002Fdiv><div class=\"metric-value\" id=\"mv-4\">—<\u002Fdiv><\u002Fdiv>\n        <!-- NPR-01: overmodulation warning -->\n        <div class=\"metric-item hidden\" id=\"overmod-warning\" style=\"width:100%;\">\n          <div style=\"color:#fc8181;font-size:11px;font-weight:600;letter-spacing:0.04em;\">⚠ k &gt; 1: Overmodulated<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"color:var(--color-dim);font-size:10px;margin-top:auto;padding-top:8px;\">\n        Click any panel to expand · IEEE Std 1057\n      <\u002Fdiv>\n    <\u002Fdiv><!-- /analog-sidebar -->\n\n    <!-- ============ DIGITAL SIDEBAR ============ -->\n    <div id=\"digital-sidebar\" class=\"hidden\">\n\n      <div class=\"section-header\">Modulation Scheme<\u002Fdiv>\n      <div class=\"scheme-box-row\">\n        <button class=\"scheme-box active\" data-scheme=\"ASK\">ASK<\u002Fbutton>\n        <button class=\"scheme-box\" data-scheme=\"FSK\">FSK<\u002Fbutton>\n        <button class=\"scheme-box\" data-scheme=\"BPSK\">BPSK<\u002Fbutton>\n        <button class=\"scheme-box\" data-scheme=\"QPSK\">QPSK<\u002Fbutton>\n        <button class=\"scheme-box\" data-scheme=\"QAM16\">16-QAM<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"section-header\">Carrier Parameters<\u002Fdiv>\n      <div class=\"control-group\">\n        <div class=\"control-row\">\n          <div class=\"control-label\">\n            <span>f<sub style=\"font-size:9px\">c<\u002Fsub> — Carrier freq (kHz)<\u002Fspan>\n            <span class=\"readout\" id=\"drd-fc\">10.00<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" id=\"dsl-fc\" min=\"5\" max=\"30\" step=\"1\" value=\"10\">\n        <\u002Fdiv>\n        <div class=\"control-row\">\n          <div class=\"control-label\">\n            <span>A<sub style=\"font-size:9px\">C<\u002Fsub> — Carrier amplitude<\u002Fspan>\n            <span class=\"readout\" id=\"drd-ac\">1.00<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" id=\"dsl-ac\" min=\"0.5\" max=\"2\" step=\"0.05\" value=\"1\">\n        <\u002Fdiv>\n        <div class=\"control-row\">\n          <div class=\"control-label\">\n            <span>R<sub style=\"font-size:9px\">b<\u002Fsub> — Bit rate (kbps)<\u002Fspan>\n            <span class=\"readout\" id=\"drd-rb\">2.00<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" id=\"dsl-rb\" min=\"0.5\" max=\"8\" step=\"0.5\" value=\"2\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"fsk-controls\" class=\"hidden\">\n        <div class=\"section-header\">FSK Parameters<\u002Fdiv>\n        <div class=\"control-group\">\n          <div class=\"control-row\">\n            <div class=\"control-label\">\n              <span>Δf — Freq deviation (kHz)<\u002Fspan>\n              <span class=\"readout\" id=\"drd-df\">2.00<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"range\" id=\"dsl-df\" min=\"0.5\" max=\"8\" step=\"0.5\" value=\"2\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"section-header\">Live Metrics<\u002Fdiv>\n      <div id=\"dmetrics-panel\" style=\"background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 20px;\">\n        <div class=\"metric-item\"><div class=\"metric-label\" id=\"dml-1\">Scheme<\u002Fdiv><div class=\"metric-value\" id=\"dmv-1\">ASK<\u002Fdiv><\u002Fdiv>\n        <div class=\"metric-item\"><div class=\"metric-label\" id=\"dml-2\">n = log₂(m)<\u002Fdiv><div class=\"metric-value\" id=\"dmv-2\">1 bits/sym<\u002Fdiv><\u002Fdiv>\n        <div class=\"metric-item\"><div class=\"metric-label\" id=\"dml-3\">η_B = R/B<\u002Fdiv><div class=\"metric-value\" id=\"dmv-3\">—<\u002Fdiv><\u002Fdiv>\n        <div class=\"metric-item\"><div class=\"metric-label\" id=\"dml-4\">E_b/N_0 axis<\u002Fdiv><div class=\"metric-value\" id=\"dmv-4\">label only<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"color:var(--color-dim);font-size:10px;margin-top:auto;padding-top:8px;\">\n        Click any panel to expand · IEEE Std 1057\n      <\u002Fdiv>\n    <\u002Fdiv><!-- /digital-sidebar -->\n\n    <!-- ============ RESEARCH SIDEBAR ============ -->\n    <div id=\"research-sidebar\" class=\"hidden\">\n\n      <div class=\"section-header\">Carrier Parameters<\u002Fdiv>\n      <div class=\"control-group\">\n        <div class=\"control-row\">\n          <div class=\"control-label\">\n            <span>f<sub style=\"font-size:9px\">c<\u002Fsub> — Carrier freq (kHz)<\u002Fspan>\n            <span class=\"readout\" id=\"rrd-fc\">10.00<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" id=\"rsl-fc\" min=\"5\" max=\"30\" step=\"1\" value=\"10\">\n        <\u002Fdiv>\n        <div class=\"control-row\">\n          <div class=\"control-label\">\n            <span>A<sub style=\"font-size:9px\">C<\u002Fsub> — Carrier amplitude<\u002Fspan>\n            <span class=\"readout\" id=\"rrd-ac\">1.00<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" id=\"rsl-ac\" min=\"0.5\" max=\"2\" step=\"0.05\" value=\"1\">\n        <\u002Fdiv>\n        <div class=\"control-row\">\n          <div class=\"control-label\">\n            <span>R<sub style=\"font-size:9px\">b<\u002Fsub> — Bit rate (kbps)<\u002Fspan>\n            <span class=\"readout\" id=\"rrd-rb\">2.00<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" id=\"rsl-rb\" min=\"0.5\" max=\"8\" step=\"0.5\" value=\"2\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"section-header\">I/Q Constellation Points<\u002Fdiv>\n      <div class=\"control-group\">\n        <div class=\"control-row\">\n          <div class=\"control-label\"><span>Add point (I, Q)<\u002Fspan><\u002Fdiv>\n          <div class=\"iq-input-row\">\n            <input type=\"number\" id=\"iq-i-val\" placeholder=\"I\" step=\"0.1\" value=\"1\">\n            <input type=\"number\" id=\"iq-q-val\" placeholder=\"Q\" step=\"0.1\" value=\"0\">\n            <button class=\"iq-add-btn\" id=\"iq-add-btn\">Add<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"control-row\">\n          <div id=\"point-list-wrap\" class=\"point-list\">\n            <div class=\"point-list-empty\" id=\"point-list-empty\">No points added yet<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"rstate-hint\" style=\"color:var(--color-dim);font-size:10px;\">\n          Add at least 2 points to generate signals\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"color:var(--color-dim);font-size:10px;margin-top:auto;padding-top:8px;\">\n        Click any panel to expand · IEEE Std 1057\n      <\u002Fdiv>\n    <\u002Fdiv><!-- /research-sidebar -->\n\n  <\u002Faside><!-- /sidebar -->\n\n  <!-- ===== CANVAS AREA ===== -->\n  <main id=\"canvas-area\">\n\n    <!-- Render toolbar: classroom view controls (global across domains) -->\n    <div id=\"render-toolbar\">\n      <div class=\"rt-group\">\n        <span class=\"rt-label\">Spectrum scale<\u002Fspan>\n        <div class=\"rt-seg\">\n          <button class=\"rt-btn active\" data-opt=\"spec\" data-val=\"linear\">Linear<\u002Fbutton>\n          <button class=\"rt-btn\" data-opt=\"spec\" data-val=\"db\">dB<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rt-group\">\n        <span class=\"rt-label\">Bandwidth markers<\u002Fspan>\n        <div class=\"rt-seg\">\n          <button class=\"rt-btn active\" data-opt=\"bw\" data-val=\"on\">On<\u002Fbutton>\n          <button class=\"rt-btn\" data-opt=\"bw\" data-val=\"off\">Off<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rt-group\">\n        <span class=\"rt-label\">AM envelope<\u002Fspan>\n        <div class=\"rt-seg\">\n          <button class=\"rt-btn active\" data-opt=\"env\" data-val=\"on\">On<\u002Fbutton>\n          <button class=\"rt-btn\" data-opt=\"env\" data-val=\"off\">Off<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rt-group\" style=\"margin-left:auto\">\n        <span class=\"rt-label\">Animation<\u002Fspan>\n        <div class=\"rt-seg\">\n          <button class=\"rt-btn\" id=\"rt-playpause\" data-act=\"playpause\">❚❚ Pause<\u002Fbutton>\n          <button class=\"rt-btn\" data-opt=\"speed\" data-val=\"0.5\">0.5×<\u002Fbutton>\n          <button class=\"rt-btn active\" data-opt=\"speed\" data-val=\"1\">1×<\u002Fbutton>\n          <button class=\"rt-btn\" data-opt=\"speed\" data-val=\"2\">2×<\u002Fbutton>\n          <button class=\"rt-btn\" id=\"rt-step\" data-act=\"step\">Step ⭢<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Analog 5-panel grid -->\n    <div id=\"canvas-grid-analog\">\n      <div class=\"panel-wrap\" data-panel=\"0\" data-domain=\"analog\">\n        <div class=\"panel-label\">Panel 1 — Message  m(t)<\u002Fdiv>\n        <canvas id=\"cv0\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div class=\"panel-wrap\" data-panel=\"1\" data-domain=\"analog\">\n        <div class=\"panel-label\">Panel 2 — Carrier  c(t)<\u002Fdiv>\n        <canvas id=\"cv1\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div class=\"panel-wrap\" data-panel=\"2\" data-domain=\"analog\">\n        <div class=\"panel-label\" id=\"panel3-label\">Panel 3 — Modulated  s(t)<\u002Fdiv>\n        <canvas id=\"cv2\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div class=\"panel-wrap\" data-panel=\"3\" data-domain=\"analog\">\n        <div class=\"panel-label\" id=\"panel4-label\">Panel 4 — Spectrum  |S(f)|<\u002Fdiv>\n        <canvas id=\"cv3\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div class=\"panel-wrap\" data-panel=\"4\" data-domain=\"analog\">\n        <div class=\"panel-label\">Panel 5 — Spectrum  |M(f)|<\u002Fdiv>\n        <canvas id=\"cv4\"><\u002Fcanvas>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Digital 6-panel grid (hidden on load) -->\n    <div id=\"canvas-grid-digital\" class=\"hidden\">\n      <div class=\"panel-wrap\" data-panel=\"0\" data-domain=\"digital\">\n        <div class=\"panel-label\">Panel 1 — Bit Stream  m[n]<\u002Fdiv>\n        <canvas id=\"dcv0\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div class=\"panel-wrap\" data-panel=\"1\" data-domain=\"digital\">\n        <div class=\"panel-label\">Panel 2 — Carrier  c(t)<\u002Fdiv>\n        <canvas id=\"dcv1\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div class=\"panel-wrap\" data-panel=\"2\" data-domain=\"digital\">\n        <div class=\"panel-label\" id=\"dpanel3-label\">Panel 3 — Modulated  s(t)  [ASK]<\u002Fdiv>\n        <canvas id=\"dcv2\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div class=\"panel-wrap\" data-panel=\"3\" data-domain=\"digital\">\n        <div class=\"panel-label\">Panel 4 — Spectrum  |S(f)|<\u002Fdiv>\n        <canvas id=\"dcv3\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div class=\"panel-wrap\" data-panel=\"4\" data-domain=\"digital\">\n        <div class=\"panel-label\">Panel 5 — Spectrum  |M(f)|<\u002Fdiv>\n        <canvas id=\"dcv4\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div class=\"panel-wrap\" data-panel=\"5\" data-domain=\"digital\">\n        <div class=\"panel-label\">Panel 6 — Constellation  I-Q<\u002Fdiv>\n        <canvas id=\"dcv5\"><\u002Fcanvas>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Research 4-panel grid (hidden on load) -->\n    <div id=\"canvas-grid-research\" class=\"hidden\">\n      <div class=\"panel-wrap\" data-panel=\"0\" data-domain=\"research\">\n        <div class=\"panel-label\">Panel 1 — Constellation  I-Q<\u002Fdiv>\n        <canvas id=\"rcv0\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div class=\"panel-wrap\" data-panel=\"1\" data-domain=\"research\">\n        <div class=\"panel-label\">Panel 2 — Modulated  s(t)<\u002Fdiv>\n        <canvas id=\"rcv1\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div class=\"panel-wrap\" data-panel=\"2\" data-domain=\"research\">\n        <div class=\"panel-label\">Panel 3 — Spectrum  |S(f)|<\u002Fdiv>\n        <canvas id=\"rcv2\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <div class=\"panel-wrap\" data-panel=\"3\" data-domain=\"research\">\n        <div class=\"panel-label\">Panel 4 — Spectrum  |M(f)|<\u002Fdiv>\n        <canvas id=\"rcv3\"><\u002Fcanvas>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fmain>\n\n  <!-- ===== RESEARCH RIGHT SIDEBAR (metrics) — shown only on Research tab ===== -->\n  <aside id=\"research-right-sidebar\" class=\"hidden\">\n    <div class=\"section-header\">Live Metrics<\u002Fdiv>\n    <div class=\"control-group\">\n      <div class=\"control-row\">\n        <div class=\"control-label\"><span>η<sub style=\"font-size:9px\">B<\u002Fsub> = R/B  (bps/Hz)<\u002Fspan><\u002Fdiv>\n        <div class=\"metric-value\" id=\"rmv-etab\" style=\"color:var(--color-accent);font-size:14px;font-weight:700;padding:2px 0;\">—<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"control-row\">\n        <div class=\"control-label\"><span>Min Euclidean Distance  d<sub style=\"font-size:9px\">E<\u002Fsub><\u002Fspan><\u002Fdiv>\n        <div class=\"metric-value\" id=\"rmv-dmin\" style=\"color:var(--color-accent);font-size:14px;font-weight:700;padding:2px 0;\">—<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"control-row\">\n        <div class=\"control-label\"><span>PAPR (dB)<\u002Fspan><\u002Fdiv>\n        <div class=\"metric-value\" id=\"rmv-papr\" style=\"color:var(--color-accent);font-size:14px;font-weight:700;padding:2px 0;\">—<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"color:var(--color-dim);font-size:10px;margin-top:auto;padding-top:8px;\">\n      Metrics update on every point add/remove and slider change\n    <\u002Fdiv>\n  <\u002Faside><!-- /research-right-sidebar -->\n\n<\u002Fdiv><!-- /app-shell -->\n\n<!-- ===== EXPAND OVERLAY ===== -->\n<div id=\"expand-overlay\">\n  <div id=\"expand-container\">\n    <div id=\"expand-label\"><\u002Fdiv>\n    <canvas id=\"expand-canvas\"><\u002Fcanvas>\n  <\u002Fdiv>\n  <button id=\"expand-close\">✕  CLOSE<\u002Fbutton>\n<\u002Fdiv>\n\n<script>\n/* ============================================================\n   MODULATION EXPLORER — v3.0.0\n   TABLE OF CONTENTS\n   §1   Constants & Configuration\n   §2   OWASP Whitelist Gate & Expression Compiler\n   §3   Analog Signal Engine\n     §3.1  Primitive waveforms\n     §3.2  Message signal factory\n     §3.3  Carrier signal factory\n     §3.4  Cooley-Tukey FFT (N=4096)\n     §3.5  Spectrum computation (one-sided, peak-normalised)\n     §3.6  Hilbert transform (FFT-based, for SSB)\n     §3.7  AM modulator (DSB-LC, SSB-USB, SSB-LSB)\n     §3.8  FM modulator (phase-integration)\n     §3.9  PM modulator\n   §4   Digital Signal Engine\n     §4.1  Bit stream generator (15-bit LFSR, fixed seed)\n     §4.2  Constellation mapper\n     §4.3  ASK modulator\n     §4.4  FSK modulator (continuous-phase)\n     §4.5  BPSK modulator\n     §4.6  QPSK modulator\n     §4.7  16-QAM modulator\n   §5   Analog State Management\n   §6   Digital State Management\n   §6R  Research State Management\n   §7   Analog Rendering Layer\n     §7.1  Draw time-domain waveform\n     §7.2  Draw spectrum\n     §7.3  Analog panel orchestrator\n   §8   Digital Rendering Layer\n     §8.1  Draw NRZ bit stream\n     §8.2  Draw constellation diagram (I-Q plane)\n     §8.3  Digital panel orchestrator\n   §9   Analog Metrics Calculator\n   §10  Digital Metrics Calculator\n   §10R Research Metrics Calculator\n   §11  UI Controller\n     §11.1  Top-level Analog/Digital/Research tab\n     §11.2  Analog sub-tab (AM/FM/PM) — unchanged from v1.1.4\n     §11.3  Digital scheme selector\n     §11.4  Panel expand overlay\n     §11.5  Research IQ point entry\n     §11.6  Research slider bindings\n   §12  Animation Loop & Init\n   ============================================================ */\n\n/* -----------------------------------------------------------\n   §1  CONSTANTS & CONFIGURATION\n   DEF-02: All frequencies in kHz. SAMPLE_RATE in kSa/s (400).\n   Time unit: milliseconds. No unit conversion at engine boundary.\n----------------------------------------------------------- */\nconst FFT_N             = 4096;\nconst SAMPLE_RATE       = 400;        // kSa/s\nconst DISPLAY_CYCLES    = 4;          // analog: message cycles to display\nconst DISPLAY_N         = 4000;       // analog: max signal buffer samples\nconst DIGITAL_DISP_SYMS = 16;         // digital: symbols across time panels\nconst TWO_PI            = 2 * Math.PI;\nconst PI                = Math.PI;\n\nfunction displaySamples(fm) {\n  return Math.round(DISPLAY_CYCLES * SAMPLE_RATE / fm);\n}\n\n/* Signal colours — single source of truth */\nconst CLR_MESSAGE   = '#f59e0b';\nconst CLR_CARRIER   = '#818cf8';\nconst CLR_MODULATED = '#10b981';\nconst CLR_SPECTRUM  = '#f43f5e';\nconst CLR_GRID      = '#2e3450';\nconst CLR_AXIS      = '#4a5568';\nconst CLR_LABEL     = '#a0aec0';\nconst CLR_BG        = '#1a1d27';\nconst CLR_CONST_DIM = '#33485f';   // dim constellation dots (brightened for projection)\nconst CLR_CONST_HI  = '#10b981';   // current symbol highlight\nconst FONT_TICK     = '12px IBM Plex Mono';        // axis tick labels — projector-legible\nconst FONT_TICK_B   = 'bold 13px IBM Plex Mono';   // emphasised labels\n\n/* Global render options driven by the classroom toolbar */\nconst RENDER = { spectrumDb: false, bwMarkers: true, envelope: true };\n\n/* OWASP whitelist for user expressions */\nconst EXPR_WHITELIST = /^[0-9t\\s\\+\\-\\*\\/\\(\\)\\.\\,\\^%sincostanabqrelog10pi_]*$/i;\n\n/* -----------------------------------------------------------\n   §2  OWASP WHITELIST GATE & EXPRESSION COMPILER\n   AD-01: new Function() with whitelist gate, negative-lookbehind guard,\n   \"use strict\", dry-run syntax check.\n----------------------------------------------------------- */\nlet compiledExpr = null;\n\nfunction compileExpression(exprStr) {\n  const cleaned = exprStr.trim();\n  if (cleaned.length === 0) return { ok: false, error: 'Expression is empty.' };\n  if (!EXPR_WHITELIST.test(cleaned)) {\n    return { ok: false, error: 'Expression contains disallowed characters.' };\n  }\n  const body = cleaned\n    .replace(/\\bsin\\b/g,   'Math.sin')\n    .replace(/\\bcos\\b/g,   'Math.cos')\n    .replace(/\\btan\\b/g,   'Math.tan')\n    .replace(/\\babs\\b/g,   'Math.abs')\n    .replace(/\\bsqrt\\b/g,  'Math.sqrt')\n    .replace(/\\bexp\\b/g,   'Math.exp')\n    .replace(/\\blog\\b/g,   'Math.log')\n    .replace(/\\blog10\\b/g, 'Math.log10')\n    .replace(/\\bpi\\b/g,    'Math.PI')\n    .replace(/\\^/g,        '**');\n  const guarded = body.replace(/(?<!Math\\.)Math\\./g, 'Math.');\n  try {\n    // eslint-disable-next-line no-new-func\n    const fn = new Function('t', '\"use strict\"; return (' + guarded + ');');\n    fn(0);\n    return { ok: true, fn };\n  } catch (e) {\n    return { ok: false, error: e.message };\n  }\n}\n\n/* -----------------------------------------------------------\n   §3  ANALOG SIGNAL ENGINE — pure functions, no DOM/canvas\n----------------------------------------------------------- */\n\n/* §3.1  Primitive waveforms — AD-02: p=(phi/TWO_PI)%1 always; Math.sin exempt */\nfunction waveformValue(type, phi) {\n  const p = (phi / TWO_PI) % 1;\n  switch (type) {\n    case 'sine':     return Math.sin(phi);\n    case 'square':   return p < 0.5 ? 1.0 : -1.0;\n    case 'triangle': return p < 0.25 ? 4*p : p < 0.75 ? 2 - 4*p : 4*p - 4;\n    default:         return Math.sin(phi);\n  }\n}\n\n/* §3.2  Message signal factory */\nfunction generateMessage(params, N, fs) {\n  const sig = new Float64Array(N);\n  const { waveform, fm, Am } = params;\n  const dt = 1 / fs;\n  if (waveform === 'custom' && params.customFn) {\n    for (let i = 0; i < N; i++) {\n      const t = i * dt;\n      try { sig[i] = Am * params.customFn(t); } catch (_) { sig[i] = 0; }\n    }\n  } else {\n    for (let i = 0; i < N; i++) {\n      sig[i] = Am * waveformValue(waveform, TWO_PI * fm * i * dt);\n    }\n  }\n  return sig;\n}\n\n/* §3.3  Carrier signal — pure cosine */\nfunction generateCarrier(fc, Ac, N, fs) {\n  const sig = new Float64Array(N);\n  const dt = 1 / fs;\n  for (let i = 0; i < N; i++) sig[i] = Ac * Math.cos(TWO_PI * fc * i * dt);\n  return sig;\n}\n\n/* §3.4  Cooley-Tukey in-place FFT (radix-2, DIT) */\nfunction fft(re, im) {\n  const N = re.length;\n  let j = 0;\n  for (let i = 1; i < N; i++) {\n    let bit = N >> 1;\n    for (; j & bit; bit >>= 1) j ^= bit;\n    j ^= bit;\n    if (i < j) {\n      [re[i], re[j]] = [re[j], re[i]];\n      [im[i], im[j]] = [im[j], im[i]];\n    }\n  }\n  for (let len = 2; len <= N; len <<= 1) {\n    const ang = -TWO_PI / len;\n    const wRe = Math.cos(ang), wIm = Math.sin(ang);\n    for (let i = 0; i < N; i += len) {\n      let curRe = 1, curIm = 0;\n      for (let k = 0; k < len / 2; k++) {\n        const uRe = re[i+k], uIm = im[i+k];\n        const vRe = re[i+k+len/2]*curRe - im[i+k+len/2]*curIm;\n        const vIm = re[i+k+len/2]*curIm + im[i+k+len/2]*curRe;\n        re[i+k]       = uRe+vRe; im[i+k]       = uIm+vIm;\n        re[i+k+len/2] = uRe-vRe; im[i+k+len/2] = uIm-vIm;\n        const nRe = curRe*wRe - curIm*wIm;\n        const nIm = curRe*wIm + curIm*wRe;\n        curRe = nRe; curIm = nIm;\n      }\n    }\n  }\n}\n\n/* §3.5  Spectrum — one-sided, peak-normalised */\nfunction computeSpectrum(signal, fs) {\n  const N = FFT_N;\n  const re = new Float64Array(N), im = new Float64Array(N);\n  const copyLen = Math.min(signal.length, N);\n  /* Hann window before FFT — suppresses spectral leakage so sidebands/rolloff read cleanly */\n  const denom = Math.max(1, copyLen - 1);\n  for (let i = 0; i < copyLen; i++) {\n    const w = 0.5 - 0.5 * Math.cos(TWO_PI * i / denom);\n    re[i] = signal[i] * w;\n  }\n  fft(re, im);\n  const half = N / 2;\n  const mags = new Float64Array(half);\n  let peak = 1e-12;\n  for (let i = 0; i < half; i++) {\n    mags[i] = Math.sqrt(re[i]*re[i] + im[i]*im[i]) / N;\n    if (mags[i] > peak) peak = mags[i];\n  }\n  for (let i = 0; i < half; i++) mags[i] /= peak;\n  const df = fs / N;\n  const freqs = new Float64Array(half);\n  for (let i = 0; i < half; i++) freqs[i] = i * df;\n  return { freqs, mags };\n}\n\n/* §3.6  Hilbert transform via FFT (for SSB) */\nfunction hilbert(signal) {\n  const N = FFT_N;\n  const re = new Float64Array(N), im = new Float64Array(N);\n  const copyLen = Math.min(signal.length, N);\n  for (let i = 0; i < copyLen; i++) re[i] = signal[i];\n  fft(re, im);\n  for (let i = 1; i < N/2; i++) { const t=re[i]; re[i]=im[i]; im[i]=-t; }\n  re[0]=0; im[0]=0; re[N/2]=0; im[N/2]=0;\n  for (let i = N/2+1; i < N; i++) { const t=re[i]; re[i]=-im[i]; im[i]=t; }\n  for (let i = 0; i < N; i++) im[i] = -im[i];\n  fft(re, im);\n  const out = new Float64Array(copyLen);\n  for (let i = 0; i < copyLen; i++) out[i] = re[i] / N;\n  return out;\n}\n\n/* §3.7  AM modulator */\nfunction modulateAM(message, carrier, Ac, fc, mode, N, fs) {\n  const sig = new Float64Array(N);\n  const dt = 1 / fs;\n  if (mode === 'DSB-LC') {\n    for (let i = 0; i < N; i++) {\n      sig[i] = Ac * (1 + message[i] / Ac) * Math.cos(TWO_PI * fc * i * dt);\n    }\n  } else {\n    const mNorm = new Float64Array(N);\n    for (let i = 0; i < N; i++) mNorm[i] = message[i] / Ac;\n    const mHat = hilbert(mNorm);\n    const sign = (mode === 'SSB-USB') ? -1 : +1;\n    for (let i = 0; i < N; i++) {\n      const ct = Math.cos(TWO_PI * fc * i * dt);\n      const st = Math.sin(TWO_PI * fc * i * dt);\n      sig[i] = Ac * (mNorm[i]*ct + sign*mHat[i]*st);\n    }\n  }\n  return sig;\n}\n\n/* §3.8  FM modulator — phase integration */\nfunction modulateFM(message, Ac, fc, kf, N, fs) {\n  const sig = new Float64Array(N);\n  const dt = 1 / fs;\n  let integral = 0;\n  for (let i = 0; i < N; i++) {\n    if (i > 0) integral += (message[i-1] + message[i]) * 0.5 * dt;\n    sig[i] = Ac * Math.cos(TWO_PI * fc * i * dt + TWO_PI * kf * integral);\n  }\n  return sig;\n}\n\n/* §3.9  PM modulator */\nfunction modulatePM(message, Ac, fc, kTheta, N, fs) {\n  const sig = new Float64Array(N);\n  const dt = 1 / fs;\n  for (let i = 0; i < N; i++) {\n    sig[i] = Ac * Math.cos(TWO_PI * fc * i * dt + kTheta * message[i]);\n  }\n  return sig;\n}\n\n/* -----------------------------------------------------------\n   §4  DIGITAL SIGNAL ENGINE — pure functions, no DOM/canvas\n   Units: freq kHz, Rb kbps, dt ms, SAMPLE_RATE kSa/s\n   Symbol period T_sym = bitsPerSym/Rb  (ms)\n   Samples per symbol = round(T_sym × SAMPLE_RATE)\n----------------------------------------------------------- */\n\n/* §4.1  Bit stream — 15-bit Fibonacci LFSR, fixed seed */\nfunction generateBitStream(nBits) {\n  const bits = new Uint8Array(nBits);\n  let sr = 0b101010101010101;           // fixed seed — must be non-zero\n  for (let i = 0; i < nBits; i++) {\n    bits[i] = sr & 1;\n    const fb = (sr ^ (sr >> 1)) & 1;\n    sr = ((sr >> 1) | (fb << 14)) & 0x7FFF;\n  }\n  return bits;\n}\n\n/* §4.2  Constellation mapper\n   Returns { bitsPerSym, points: [{I, Q, label}] }\n   Amplitude scale: max |I| = max |Q| = Ac for all schemes.\n   16-QAM: grid {-3,-1,+1,+3}×(Ac/3). */\nfunction constellationForScheme(scheme, Ac) {\n  switch (scheme) {\n    case 'ASK':\n      return { bitsPerSym: 1, points: [\n        { I: 0,  Q: 0, label: '0' },\n        { I: Ac, Q: 0, label: '1' },\n      ]};\n    case 'FSK':\n      /* MATH-D02 (faculty ruling Option B): orthogonal-axes representation.\n         f₁ (bit=1) on positive I axis; f₀ (bit=0) on positive Q axis.\n         Correctly represents the two FSK signals as orthogonal. */\n      return { bitsPerSym: 1, points: [\n        { I: 0,  Q: Ac, label: 'f\\u2080' },\n        { I: Ac, Q: 0,  label: 'f\\u2081' },\n      ]};\n    case 'BPSK':\n      return { bitsPerSym: 1, points: [\n        { I: -Ac, Q: 0, label: '0' },\n        { I:  Ac, Q: 0, label: '1' },\n      ]};\n    case 'QPSK': {\n      /* MATH-D05 (faculty ruling Option B): on-axis phases 0°,90°,180°,270°.\n         Gray code: 00→0°(+I), 01→90°(+Q), 11→180°(-I), 10→270°(-Q). */\n      return { bitsPerSym: 2, points: [\n        { I:  Ac, Q:  0,  label: '00' },\n        { I:  0,  Q:  Ac, label: '01' },\n        { I: -Ac, Q:  0,  label: '11' },\n        { I:  0,  Q: -Ac, label: '10' },\n      ]};\n    }\n    case 'QAM16': {\n      const s = Ac / 3;\n      const pts = [];\n      const lvl = [-3, -1, 1, 3];\n      const gray = [0, 1, 3, 2];\n      for (let qi = 0; qi < 4; qi++) {\n        for (let ii = 0; ii < 4; ii++) {\n          const sym = (gray[qi] << 2) | gray[ii];\n          pts.push({ I: lvl[ii]*s, Q: lvl[qi]*s, label: sym.toString(2).padStart(4,'0') });\n        }\n      }\n      return { bitsPerSym: 4, points: pts };\n    }\n    default:\n      return { bitsPerSym: 1, points: [{ I: Ac, Q: 0, label: '1' }] };\n  }\n}\n\n/* §4.3  ASK: s(t) = Ac·bit·cos(2π fc t) */\nfunction modulateASK(bits, Ac, fc, Rb, N, fs) {\n  const sig = new Float64Array(N);\n  const dt = 1 / fs;\n  const sampPerSym = Math.round(fs / Rb);   // binary: 1 bit/sym\n  for (let i = 0; i < N; i++) {\n    const bit = bits[Math.floor(i / sampPerSym) % bits.length];\n    sig[i] = Ac * bit * Math.cos(TWO_PI * fc * i * dt);\n  }\n  return sig;\n}\n\n/* §4.4  FSK continuous-phase:\n   bit=1 → fc+Δf, bit=0 → fc−Δf; phase accumulated sample by sample */\nfunction modulateFSKdig(bits, Ac, fc, deltaF, Rb, N, fs) {\n  const sig = new Float64Array(N);\n  const dt = 1 / fs;\n  const sampPerSym = Math.round(fs / Rb);\n  let phase = 0;\n  for (let i = 0; i < N; i++) {\n    const bit = bits[Math.floor(i / sampPerSym) % bits.length];\n    const freq = bit ? fc + deltaF : fc - deltaF;\n    sig[i] = Ac * Math.cos(phase);\n    phase += TWO_PI * freq * dt;\n    if (phase > TWO_PI * 500) phase -= TWO_PI * 500;  // prevent float overflow\n  }\n  return sig;\n}\n\n/* §4.5  BPSK: bit=1→φ=0, bit=0→φ=π */\nfunction modulateBPSK(bits, Ac, fc, Rb, N, fs) {\n  const sig = new Float64Array(N);\n  const dt = 1 / fs;\n  const sampPerSym = Math.round(fs / Rb);\n  for (let i = 0; i < N; i++) {\n    const bit = bits[Math.floor(i / sampPerSym) % bits.length];\n    sig[i] = Ac * Math.cos(TWO_PI * fc * i * dt + (bit ? 0 : PI));\n  }\n  return sig;\n}\n\n/* §4.6  QPSK: 2 bits/symbol, Gray-coded, phases at 0°, 90°, 180°, 270° (on-axis)\n   MATH-D05 (faculty ruling Option B): 00→0°, 01→90°, 11→180°, 10→270° */\nfunction modulateQPSK(bits, Ac, fc, Rb, N, fs) {\n  const sig = new Float64Array(N);\n  const dt = 1 / fs;\n  const bitsPerSym = 2;\n  const sampPerSym = Math.round(fs / (Rb / bitsPerSym));\n  const phaseMap = { '00': 0, '01': PI/2, '11': PI, '10': 3*PI/2 };\n  for (let i = 0; i < N; i++) {\n    const si = Math.floor(i / sampPerSym);\n    const b0 = bits[(si * 2)     % bits.length];\n    const b1 = bits[(si * 2 + 1) % bits.length];\n    const phi = phaseMap['' + b0 + b1] !== undefined ? phaseMap['' + b0 + b1] : 0;\n    sig[i] = Ac * Math.cos(TWO_PI * fc * i * dt + phi);\n  }\n  return sig;\n}\n\n/* §4.7  16-QAM: 4 bits/symbol, Gray-coded I and Q axes\n   s(t) = I_k·cos(2πfc t) − Q_k·sin(2πfc t) */\nfunction modulateQAM16(bits, Ac, fc, Rb, N, fs) {\n  const sig = new Float64Array(N);\n  const dt = 1 / fs;\n  const bitsPerSym = 4;\n  const sampPerSym = Math.round(fs / (Rb / bitsPerSym));\n  const s = Ac / 3;\n  const lvl = [-3, -1, 1, 3];\n  const grayDec = [0, 1, 3, 2];\n  for (let i = 0; i < N; i++) {\n    const si = Math.floor(i / sampPerSym);\n    const base = (si * 4) % bits.length;\n    const iGray = (bits[base] << 1) | bits[(base+1) % bits.length];\n    const qGray = (bits[(base+2) % bits.length] << 1) | bits[(base+3) % bits.length];\n    const I_k = lvl[grayDec[iGray]] * s;\n    const Q_k = lvl[grayDec[qGray]] * s;\n    sig[i] = I_k * Math.cos(TWO_PI * fc * i * dt) - Q_k * Math.sin(TWO_PI * fc * i * dt);\n  }\n  return sig;\n}\n\n/* -----------------------------------------------------------\n   §5  ANALOG STATE MANAGEMENT\n----------------------------------------------------------- */\nconst state = {\n  topDomain: 'analog',\n  mode:      'AM',\n  waveform:  'sine',\n  customFn:  null,\n  fm:        1.0,    // kHz\n  Am:        1.0,    // V\n  fc:        10.0,   // kHz\n  Ac:        1.0,    // V\n  kf:        5.0,    // kHz/V\n  kTheta:    1.0,    // rad/V\n  amMode:    'DSB-LC',\n  dirty:     true,\n  sigMessage:    null,\n  sigCarrier:    null,\n  sigModulated:  null,\n  specMessage:   null,\n  specModulated: null,\n};\n\nfunction markDirty() { state.dirty = true; }\n\nfunction recompute() {\n  if (!state.dirty) return;\n  state.dirty = false;\n  const N = DISPLAY_N, fs = SAMPLE_RATE;\n  const msgP = { waveform: state.waveform, fm: state.fm, Am: state.Am, customFn: state.customFn };\n  state.sigMessage  = generateMessage(msgP, N, fs);\n  state.sigCarrier  = generateCarrier(state.fc, state.Ac, N, fs);\n  switch (state.mode) {\n    case 'AM': state.sigModulated = modulateAM(state.sigMessage, state.sigCarrier, state.Ac, state.fc, state.amMode, N, fs); break;\n    case 'FM': state.sigModulated = modulateFM(state.sigMessage, state.Ac, state.fc, state.kf, N, fs); break;\n    case 'PM': state.sigModulated = modulatePM(state.sigMessage, state.Ac, state.fc, state.kTheta, N, fs); break;\n  }\n  state.specMessage   = computeSpectrum(state.sigMessage,   fs);\n  state.specModulated = computeSpectrum(state.sigModulated, fs);\n}\n\n/* -----------------------------------------------------------\n   §6  DIGITAL STATE MANAGEMENT\n----------------------------------------------------------- */\nconst dstate = {\n  scheme:   'ASK',\n  fc:       10.0,   // kHz\n  Ac:       1.0,    // V\n  Rb:       2.0,    // kbps\n  deltaF:   2.0,    // kHz (FSK)\n  dirty:    true,\n  currentSym: 0,\n  bits:         null,\n  sigMessage:   null,\n  sigCarrier:   null,\n  sigModulated: null,\n  specModulated: null,\n  specMessage:  null,\n  constellation: null,\n  symSeq:        null,\n};\n\nfunction dmarkDirty() { dstate.dirty = true; }\n\nfunction drecompute() {\n  if (!dstate.dirty) return;\n  dstate.dirty = false;\n  const fs = SAMPLE_RATE;\n  const { scheme, fc, Ac, Rb, deltaF } = dstate;\n  const constl     = constellationForScheme(scheme, Ac);\n  const bitsPerSym = constl.bitsPerSym;\n  const sampPerSym = Math.round(fs / (Rb / bitsPerSym));\n  const N          = sampPerSym * DIGITAL_DISP_SYMS;\n\n  const nBits = DIGITAL_DISP_SYMS * bitsPerSym + 64;\n  dstate.bits = generateBitStream(nBits);\n\n  /* NRZ bit-stream signal: symbol-level step waveform */\n  dstate.sigMessage = new Float64Array(N);\n  for (let i = 0; i < N; i++) {\n    const si  = Math.floor(i / sampPerSym);\n    const bit = dstate.bits[(si * bitsPerSym) % dstate.bits.length];\n    dstate.sigMessage[i] = bit ? 1.0 : -1.0;\n  }\n\n  dstate.sigCarrier = generateCarrier(fc, Ac, N, fs);\n\n  switch (scheme) {\n    case 'ASK':   dstate.sigModulated = modulateASK   (dstate.bits, Ac, fc, Rb, N, fs); break;\n    case 'FSK':   dstate.sigModulated = modulateFSKdig(dstate.bits, Ac, fc, deltaF, Rb, N, fs); break;\n    case 'BPSK':  dstate.sigModulated = modulateBPSK  (dstate.bits, Ac, fc, Rb, N, fs); break;\n    case 'QPSK':  dstate.sigModulated = modulateQPSK  (dstate.bits, Ac, fc, Rb, N, fs); break;\n    case 'QAM16': dstate.sigModulated = modulateQAM16 (dstate.bits, Ac, fc, Rb, N, fs); break;\n  }\n\n  dstate.specModulated  = computeSpectrum(dstate.sigModulated, fs);\n  dstate.specMessage    = computeSpectrum(dstate.sigMessage,   fs);\n  dstate.constellation  = constl;\n  dstate.symSeq         = buildSymbolSequence(scheme, dstate.bits, Ac);\n  dstate.currentSym     = 0;\n}\n\n/* Map the transmitted bit stream to a sequence of constellation-point indices,\n   so the highlighted symbol matches the s(t) waveform being shown. */\nfunction buildSymbolSequence(scheme, bits, Ac) {\n  const grayDec = [0, 1, 3, 2];\n  const qpsk = { '00':0, '01':1, '11':2, '10':3 };\n  const seq = [];\n  for (let si = 0; si < DIGITAL_DISP_SYMS; si++) {\n    let idx = 0;\n    if (scheme === 'ASK' || scheme === 'FSK' || scheme === 'BPSK') {\n      idx = bits[si % bits.length];\n    } else if (scheme === 'QPSK') {\n      const b0 = bits[(si*2) % bits.length], b1 = bits[(si*2+1) % bits.length];\n      idx = qpsk['' + b0 + b1];\n    } else if (scheme === 'QAM16') {\n      const base = si*4;\n      const iGray = (bits[base % bits.length] << 1) | bits[(base+1) % bits.length];\n      const qGray = (bits[(base+2) % bits.length] << 1) | bits[(base+3) % bits.length];\n      idx = grayDec[qGray]*4 + grayDec[iGray];\n    }\n    seq.push(idx);\n  }\n  return seq;\n}\n\n/* -----------------------------------------------------------\n   §6R  RESEARCH STATE MANAGEMENT\n   Custom IQ constellation — user-defined points, IQ modulation.\n   Signal: s(t) = I_k·cos(2πfc·t) − Q_k·sin(2πfc·t) per symbol\n   Units: freq kHz, Rb kbps, SAMPLE_RATE kSa/s, t in ms.\n   Minimum 2 points required before signal generation.\n   Bit labels: ceil(log2(M)) bits, assigned in entry order (Gray not forced).\n   Points entered by user stored as {I, Q, label} in rstate.points.\n----------------------------------------------------------- */\nconst rstate = {\n  fc:         10.0,   // kHz\n  Ac:         1.0,    // V  (reference — not directly used in IQ modulation)\n  Rb:         2.0,    // kbps\n  dirty:      true,\n  currentSym: 0,\n  points:     [],     // [{I, Q, label}]  — user-placed, ordered\n  sigModulated:  null,\n  sigMessage:    null,\n  specModulated: null,\n  specMessage:   null,\n};\n\nfunction rmarkDirty() { rstate.dirty = true; }\n\n/* Assign binary bit labels to placed points in entry order.\n   Width = ceil(log2(M)); M=1 → '0'; M=2 → '0','1'; M=4 → '00'..'11' etc. */\nfunction relabelPoints(points) {\n  const M = points.length;\n  if (M === 0) return;\n  const width = M <= 1 ? 1 : Math.ceil(Math.log2(M));\n  points.forEach((p, idx) => {\n    p.label = idx.toString(2).padStart(width, '0');\n  });\n}\n\n/* Build constellation object from rstate.points for drawConstellation() */\nfunction buildResearchConstellation() {\n  return { bitsPerSym: Math.max(1, Math.ceil(Math.log2(rstate.points.length))),\n           points: rstate.points };\n}\n\n/* IQ modulator: s(t) = I_k·cos(2πfc·t) − Q_k·sin(2πfc·t) */\nfunction modulateResearch(points, fc, Rb, N, fs) {\n  const sig = new Float64Array(N);\n  const M = points.length;\n  if (M < 2) return sig;\n  const bitsPerSym = Math.max(1, Math.ceil(Math.log2(M)));\n  const sampPerSym = Math.round(fs / (Rb / bitsPerSym));\n  const dt = 1 / fs;\n  for (let i = 0; i < N; i++) {\n    const si   = Math.floor(i / sampPerSym);\n    const pt   = points[si % M];\n    const ct   = Math.cos(TWO_PI * fc * i * dt);\n    const st   = Math.sin(TWO_PI * fc * i * dt);\n    sig[i]     = pt.I * ct - pt.Q * st;\n  }\n  return sig;\n}\n\n/* NRZ message signal for Research: step waveform cycling through symbol indices */\nfunction generateResearchMessage(points, Rb, N, fs) {\n  const sig = new Float64Array(N);\n  const M = points.length;\n  if (M < 2) return sig;\n  const bitsPerSym = Math.max(1, Math.ceil(Math.log2(M)));\n  const sampPerSym = Math.round(fs / (Rb / bitsPerSym));\n  for (let i = 0; i < N; i++) {\n    const si = Math.floor(i / sampPerSym) % M;\n    /* Map symbol index to normalised level: spread evenly −1…+1 */\n    sig[i] = M > 1 ? (si / (M - 1)) * 2 - 1 : 0;\n  }\n  return sig;\n}\n\nfunction rrecompute() {\n  if (!rstate.dirty) return;\n  rstate.dirty = false;\n  const pts = rstate.points;\n  if (pts.length < 2) {\n    rstate.sigModulated  = null;\n    rstate.sigMessage    = null;\n    rstate.specModulated = null;\n    rstate.specMessage   = null;\n    return;\n  }\n  const { fc, Rb } = rstate;\n  const fs = SAMPLE_RATE;\n  const bitsPerSym = Math.max(1, Math.ceil(Math.log2(pts.length)));\n  const sampPerSym = Math.round(fs / (Rb / bitsPerSym));\n  const N = sampPerSym * DIGITAL_DISP_SYMS;\n\n  rstate.sigModulated  = modulateResearch(pts, fc, Rb, N, fs);\n  rstate.sigMessage    = generateResearchMessage(pts, Rb, N, fs);\n  rstate.specModulated = computeSpectrum(rstate.sigModulated, fs);\n  rstate.specMessage   = computeSpectrum(rstate.sigMessage,   fs);\n  rstate.currentSym    = 0;\n}\n\n\n\n/* §7.1  Draw time-domain waveform.\n   opts.envelope : Float64Array of +envelope (drawn as ± dashed guide)\n   opts.playhead : { symIdx, sampPerSym } highlights the current symbol window */\nfunction drawTimeDomain(canvas, signal, color, nShow, opts) {\n  opts = opts || {};\n  const ctx = canvas.getContext('2d');\n  const W = canvas.width, H = canvas.height;\n  ctx.clearRect(0, 0, W, H);\n  ctx.fillStyle = CLR_BG; ctx.fillRect(0, 0, W, H);\n  nShow = Math.min(nShow, signal.length);\n\n  let yMin = Infinity, yMax = -Infinity;\n  for (let i = 0; i < nShow; i++) {\n    if (signal[i] < yMin) yMin = signal[i];\n    if (signal[i] > yMax) yMax = signal[i];\n  }\n  if (opts.envelope) {\n    for (let i = 0; i < nShow; i++) {\n      const e = opts.envelope[i];\n      if (e > yMax) yMax = e;\n      if (-e < yMin) yMin = -e;\n    }\n  }\n  const yRange = yMax - yMin;\n  const yPad = yRange * 0.12 || 0.2;\n  const yLo = yMin - yPad, yHi = yMax + yPad;\n\n  const M = { l:44, r:10, t:22, b:26 };\n  const pw = W - M.l - M.r, ph = H - M.t - M.b;\n  const toX = (i) => M.l + (i / (nShow-1)) * pw;\n  const toY = (v) => M.t + (1 - (v-yLo)/(yHi-yLo)) * ph;\n\n  ctx.strokeStyle = CLR_GRID; ctx.lineWidth = 0.5;\n  for (let g = 0; g <= 4; g++) {\n    const y = M.t + g*ph/4;\n    ctx.beginPath(); ctx.moveTo(M.l,y); ctx.lineTo(M.l+pw,y); ctx.stroke();\n  }\n  for (let g = 0; g <= 8; g++) {\n    const x = M.l + g*pw/8;\n    ctx.beginPath(); ctx.moveTo(x,M.t); ctx.lineTo(x,M.t+ph); ctx.stroke();\n  }\n\n  /* Playhead band — the symbol currently highlighted on the constellation */\n  if (opts.playhead) {\n    const { symIdx, sampPerSym } = opts.playhead;\n    const x0 = toX(Math.min(nShow-1, symIdx*sampPerSym));\n    const x1 = toX(Math.min(nShow-1, (symIdx+1)*sampPerSym));\n    ctx.fillStyle = 'rgba(96,165,250,0.16)';\n    ctx.fillRect(x0, M.t, Math.max(2, x1-x0), ph);\n    ctx.strokeStyle = 'rgba(96,165,250,0.8)'; ctx.lineWidth = 1.5;\n    ctx.beginPath(); ctx.moveTo(x0, M.t); ctx.lineTo(x0, M.t+ph); ctx.stroke();\n  }\n\n  const yZero = toY(0);\n  if (yZero >= M.t && yZero <= M.t+ph) {\n    ctx.strokeStyle = CLR_AXIS; ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.moveTo(M.l,yZero); ctx.lineTo(M.l+pw,yZero); ctx.stroke();\n  }\n\n  /* Envelope guide (±|A_c + m(t)|) */\n  if (opts.envelope) {\n    const stepE = Math.max(1, Math.floor(nShow/(pw*2)));\n    ctx.strokeStyle = CLR_MESSAGE; ctx.globalAlpha = 0.9; ctx.lineWidth = 2; ctx.setLineDash([6,4]);\n    ctx.beginPath();\n    for (let i = 0; i < nShow; i += stepE) { const x = toX(i), y = toY(opts.envelope[i]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }\n    ctx.stroke();\n    ctx.beginPath();\n    for (let i = 0; i < nShow; i += stepE) { const x = toX(i), y = toY(-opts.envelope[i]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }\n    ctx.stroke();\n    ctx.setLineDash([]); ctx.globalAlpha = 1;\n  }\n\n  ctx.strokeStyle = color; ctx.lineWidth = 2.6;\n  ctx.beginPath();\n  const step = Math.max(1, Math.floor(nShow/(pw*2)));\n  for (let i = 0; i < nShow; i += step) {\n    const x = toX(i), y = toY(signal[i]);\n    i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);\n  }\n  ctx.stroke();\n\n  ctx.fillStyle = CLR_LABEL; ctx.font = FONT_TICK; ctx.textAlign = 'right';\n  for (let g = 0; g <= 4; g++) {\n    const v = yLo + (1-g/4)*(yHi-yLo);\n    ctx.fillText(v.toFixed(1), M.l-4, M.t + g*ph/4 + 4);\n  }\n  const dispMs = nShow / SAMPLE_RATE;\n  ctx.textAlign = 'center';\n  for (let g = 0; g <= 8; g += 2) {\n    const t = (g/8)*dispMs, x = M.l + g*pw/8;\n    ctx.fillText(t.toFixed(2)+' ms', x, M.t+ph+18);\n  }\n}\n\n/* §7.2  Draw one-sided magnitude spectrum.\n   opts.db      : log (dB) vertical scale, floor −80 dB\n   opts.markers : [{ f, label, color }] theoretical bandwidth / carrier lines */\nfunction drawSpectrum(canvas, specObj, color, fMax, opts) {\n  opts = opts || {};\n  const db = opts.db;\n  const markers = opts.markers || [];\n  const ctx = canvas.getContext('2d');\n  const W = canvas.width, H = canvas.height;\n  ctx.clearRect(0, 0, W, H);\n  ctx.fillStyle = CLR_BG; ctx.fillRect(0, 0, W, H);\n\n  const { freqs, mags } = specObj;\n  const M = { l:48, r:12, t:24, b:26 };\n  const pw = W - M.l - M.r, ph = H - M.t - M.b;\n  const FLOOR = -80;\n  const toX = (f) => M.l + (f/fMax)*pw;\n  const toY = db\n    ? (m) => { const d = 20*Math.log10(Math.max(m,1e-9)); const c = Math.max(0, Math.min(1,(d-FLOOR)/(0-FLOOR))); return M.t + (1-c)*ph; }\n    : (m) => M.t + (1-m)*ph;\n\n  ctx.strokeStyle = CLR_GRID; ctx.lineWidth = 0.5;\n  for (let g = 0; g <= 4; g++) {\n    const y = M.t + g*ph/4;\n    ctx.beginPath(); ctx.moveTo(M.l,y); ctx.lineTo(M.l+pw,y); ctx.stroke();\n  }\n  for (let g = 0; g <= 8; g++) {\n    const x = M.l + g*pw/8;\n    ctx.beginPath(); ctx.moveTo(x,M.t); ctx.lineTo(x,M.t+ph); ctx.stroke();\n  }\n\n  /* Theoretical bandwidth / carrier markers (behind bars).\n     Labels sit just inside the top of the plot on a dark pill so they stay\n     legible over the bars and never collide with the panel title. */\n  if (markers.length) {\n    ctx.font = FONT_TICK;\n    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';\n    markers.forEach((mk, mi) => {\n      if (mk.f < 0 || mk.f > fMax) return;\n      const x = toX(mk.f);\n      ctx.strokeStyle = mk.color || '#e2e8f0'; ctx.globalAlpha = 0.75; ctx.lineWidth = 1.5; ctx.setLineDash([5,4]);\n      ctx.beginPath(); ctx.moveTo(x, M.t + 4); ctx.lineTo(x, M.t+ph); ctx.stroke();\n      ctx.setLineDash([]); ctx.globalAlpha = 1;\n      const tw = ctx.measureText(mk.label).width;\n      const ly = M.t + 11 + (mi % 2) * 17;   // stagger adjacent labels to avoid overlap\n      ctx.fillStyle = 'rgba(10,13,20,0.82)';\n      ctx.fillRect(x - tw/2 - 4, ly - 11, tw + 8, 15);\n      ctx.fillStyle = mk.color || '#e2e8f0';\n      ctx.fillText(mk.label, x, ly + 1);\n    });\n  }\n\n  ctx.strokeStyle = color; ctx.lineWidth = 2;\n  const df = freqs[1] - freqs[0];\n  const iMax = Math.min(mags.length-1, Math.floor(fMax/df));\n  const baseline = M.t + ph;\n  const barW = Math.max(1.5, (pw/fMax)*df*0.8);\n  for (let i = 1; i <= iMax; i++) {\n    if (!db && mags[i] < 0.004) continue;\n    if (db && 20*Math.log10(Math.max(mags[i],1e-9)) < FLOOR) continue;\n    const x = toX(freqs[i]), y = toY(mags[i]);\n    ctx.fillStyle = color; ctx.globalAlpha = 0.75;\n    ctx.fillRect(x-barW/2, y, barW, baseline-y);\n    ctx.globalAlpha = 1;\n    ctx.beginPath(); ctx.moveTo(x,baseline); ctx.lineTo(x,y); ctx.stroke();\n  }\n\n  ctx.fillStyle = CLR_LABEL; ctx.font = FONT_TICK; ctx.textAlign = 'center';\n  for (let g = 0; g <= 8; g += 2) {\n    const f = (g/8)*fMax, x = M.l + g*pw/8;\n    ctx.fillText(f.toFixed(0)+' kHz', x, M.t+ph+18);\n  }\n  ctx.textAlign = 'right';\n  if (db) {\n    for (const d of [0,-20,-40,-60,-80]) {\n      const c = (d-FLOOR)/(0-FLOOR), y = M.t + (1-c)*ph;\n      ctx.fillText(d+' dB', M.l-4, y+4);\n    }\n  } else {\n    for (let g = 0; g <= 4; g++) {\n      const v = 1 - g/4;\n      ctx.fillText(v.toFixed(1), M.l-4, M.t+g*ph/4+4);\n    }\n  }\n}\n\n/* §7.3  Analog panel orchestrator */\nconst analogCanvases = [\n  document.getElementById('cv0'), document.getElementById('cv1'),\n  document.getElementById('cv2'), document.getElementById('cv3'),\n  document.getElementById('cv4'),\n];\n\nfunction resizeAnalogCanvases() {\n  analogCanvases.forEach((cv) => {\n    const r = cv.parentElement.getBoundingClientRect();\n    cv.width = Math.floor(r.width); cv.height = Math.floor(r.height);\n  });\n}\n\nfunction specFMax() {\n  return Math.min(SAMPLE_RATE/2, state.fc*3 + state.fm*4);\n}\n\n/* AM envelope ±|A_c + m(t)| — only for DSB-LC when enabled */\nfunction amEnvelope(nShow) {\n  if (!RENDER.envelope || state.mode !== 'AM' || state.amMode !== 'DSB-LC') return null;\n  const n = Math.min(nShow, state.sigMessage.length);\n  const env = new Float64Array(n);\n  for (let i = 0; i < n; i++) env[i] = Math.abs(state.Ac + state.sigMessage[i]);\n  return env;\n}\n\n/* Theoretical bandwidth / carrier markers for the analog modulated spectrum */\nfunction analogModMarkers() {\n  const { mode, fc, fm, Am, kf, kTheta } = state;\n  const C = '#f5d76e';\n  if (mode === 'AM') {\n    return [{ f: fc, label: 'f_c', color: '#ffffff' },\n            { f: fc-fm, label: '−f_m', color: C },\n            { f: fc+fm, label: '+f_m', color: C }];\n  } else if (mode === 'FM') {\n    const dF = kf*Am, BW = 2*(dF+fm);\n    return [{ f: fc, label: 'f_c', color: '#ffffff' },\n            { f: fc-BW/2, label: 'Carson', color: C },\n            { f: fc+BW/2, label: 'Carson', color: C }];\n  }\n  const bP = kTheta*Am, BW = 2*(bP+1)*fm;\n  return [{ f: fc, label: 'f_c', color: '#ffffff' },\n          { f: fc-BW/2, label: 'BW', color: C },\n          { f: fc+BW/2, label: 'BW', color: C }];\n}\n\nfunction renderAllAnalogPanels() {\n  recompute();\n  const fMax = specFMax(), nShow = displaySamples(state.fm);\n  drawTimeDomain(analogCanvases[0], state.sigMessage,    CLR_MESSAGE,   nShow);\n  drawTimeDomain(analogCanvases[1], state.sigCarrier,    CLR_CARRIER,   nShow);\n  drawTimeDomain(analogCanvases[2], state.sigModulated,  CLR_MODULATED, nShow, { envelope: amEnvelope(nShow) });\n  drawSpectrum  (analogCanvases[3], state.specModulated, CLR_SPECTRUM,  fMax, { db: RENDER.spectrumDb, markers: RENDER.bwMarkers ? analogModMarkers() : [] });\n  drawSpectrum  (analogCanvases[4], state.specMessage,   CLR_MESSAGE,   fMax, { db: RENDER.spectrumDb });\n}\n\n/* -----------------------------------------------------------\n   §8  DIGITAL RENDERING LAYER\n----------------------------------------------------------- */\n\n/* §8.1  Draw NRZ bit stream — step waveform with symbol boundaries */\nfunction drawDigitalBitStream(canvas, signal, nShow, Rb, bitsPerSym, fs, opts) {\n  opts = opts || {};\n  const ctx = canvas.getContext('2d');\n  const W = canvas.width, H = canvas.height;\n  ctx.clearRect(0, 0, W, H);\n  ctx.fillStyle = CLR_BG; ctx.fillRect(0, 0, W, H);\n  nShow = Math.min(nShow, signal.length);\n\n  const M = { l:44, r:10, t:22, b:26 };\n  const pw = W - M.l - M.r, ph = H - M.t - M.b;\n  const yLo = -1.35, yHi = 1.35;\n  const toX = (i) => M.l + (i/(nShow-1))*pw;\n  const toY = (v) => M.t + (1-(v-yLo)/(yHi-yLo))*ph;\n\n  ctx.strokeStyle = CLR_GRID; ctx.lineWidth = 0.5;\n  for (let g = 0; g <= 4; g++) {\n    const y = M.t + g*ph/4;\n    ctx.beginPath(); ctx.moveTo(M.l,y); ctx.lineTo(M.l+pw,y); ctx.stroke();\n  }\n  for (let g = 0; g <= 8; g++) {\n    const x = M.l + g*pw/8;\n    ctx.beginPath(); ctx.moveTo(x,M.t); ctx.lineTo(x,M.t+ph); ctx.stroke();\n  }\n\n  /* Playhead band — current symbol window */\n  if (opts.playhead) {\n    const { symIdx, sampPerSym } = opts.playhead;\n    const x0 = toX(Math.min(nShow-1, symIdx*sampPerSym));\n    const x1 = toX(Math.min(nShow-1, (symIdx+1)*sampPerSym));\n    ctx.fillStyle = 'rgba(96,165,250,0.16)';\n    ctx.fillRect(x0, M.t, Math.max(2, x1-x0), ph);\n    ctx.strokeStyle = 'rgba(96,165,250,0.8)'; ctx.lineWidth = 1.5;\n    ctx.beginPath(); ctx.moveTo(x0, M.t); ctx.lineTo(x0, M.t+ph); ctx.stroke();\n  }\n\n  ctx.strokeStyle = CLR_AXIS; ctx.lineWidth = 1;\n  const yZ = toY(0);\n  ctx.beginPath(); ctx.moveTo(M.l,yZ); ctx.lineTo(M.l+pw,yZ); ctx.stroke();\n\n  /* Step waveform */\n  ctx.strokeStyle = CLR_MESSAGE; ctx.lineWidth = 2.6;\n  ctx.beginPath();\n  for (let i = 0; i < nShow; i++) {\n    const x = toX(i), y = toY(signal[i]);\n    if (i === 0) {\n      ctx.moveTo(x, y);\n    } else if (signal[i] !== signal[i-1]) {\n      ctx.lineTo(x, toY(signal[i-1]));\n      ctx.lineTo(x, y);\n    } else {\n      ctx.lineTo(x, y);\n    }\n  }\n  ctx.stroke();\n\n  /* Symbol boundary dashes */\n  const sampPerSym = Math.round(fs / (Rb / bitsPerSym));\n  ctx.strokeStyle = CLR_CARRIER; ctx.lineWidth = 0.6;\n  ctx.setLineDash([2, 3]);\n  for (let i = 0; i < nShow; i += sampPerSym) {\n    const x = toX(i);\n    ctx.beginPath(); ctx.moveTo(x,M.t); ctx.lineTo(x,M.t+ph); ctx.stroke();\n  }\n  ctx.setLineDash([]);\n\n  ctx.fillStyle = CLR_LABEL; ctx.font = FONT_TICK; ctx.textAlign = 'right';\n  ctx.fillText('+1', M.l-4, toY(1)+4);\n  ctx.fillText('0',  M.l-4, toY(0)+4);\n  ctx.fillText('-1', M.l-4, toY(-1)+4);\n  const dispMs = nShow / fs;\n  ctx.textAlign = 'center';\n  for (let g = 0; g <= 8; g += 2) {\n    const t = (g/8)*dispMs, x = M.l + g*pw/8;\n    ctx.fillText(t.toFixed(2)+' ms', x, M.t+ph+18);\n  }\n}\n\n/* §8.2  Draw constellation diagram — I-Q plane */\nfunction drawConstellation(canvas, constellation, currentSymIdx) {\n  const ctx = canvas.getContext('2d');\n  const W = canvas.width, H = canvas.height;\n  ctx.clearRect(0, 0, W, H);\n  ctx.fillStyle = CLR_BG; ctx.fillRect(0, 0, W, H);\n\n  const M = { l:36, r:14, t:24, b:28 };\n  const pw = W - M.l - M.r, ph = H - M.t - M.b;\n  const { points } = constellation;\n\n  /* Axis range: derive from points */\n  let axMax = 0;\n  for (const p of points) axMax = Math.max(axMax, Math.abs(p.I), Math.abs(p.Q));\n  axMax = (axMax || 1) * 1.55;\n\n  const toX = (I) => M.l + pw * (I/axMax + 1) / 2;\n  const toY = (Q) => M.t + ph * (1 - (Q/axMax + 1) / 2);\n\n  /* Grid */\n  ctx.strokeStyle = CLR_GRID; ctx.lineWidth = 0.5;\n  for (let g = 0; g <= 4; g++) {\n    const y = M.t + g*ph/4, x = M.l + g*pw/4;\n    ctx.beginPath(); ctx.moveTo(M.l,y); ctx.lineTo(M.l+pw,y); ctx.stroke();\n    ctx.beginPath(); ctx.moveTo(x,M.t); ctx.lineTo(x,M.t+ph); ctx.stroke();\n  }\n\n  /* I and Q axes */\n  const cx = toX(0), cy = toY(0);\n  ctx.strokeStyle = CLR_AXIS; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.moveTo(M.l,cy);   ctx.lineTo(M.l+pw,cy); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(cx,M.t);   ctx.lineTo(cx,M.t+ph); ctx.stroke();\n\n  /* Axis labels */\n  ctx.fillStyle = CLR_LABEL; ctx.font = FONT_TICK;\n  ctx.textAlign = 'left';  ctx.fillText('I →', M.l+pw-24, cy-6);\n  ctx.textAlign = 'center'; ctx.fillText('↑ Q', cx, M.t+12);\n\n  /* Reference circle */\n  const refR = Math.min(pw, ph) * 0.36;\n  ctx.beginPath(); ctx.arc(cx, cy, refR, 0, TWO_PI);\n  ctx.strokeStyle = '#2a3a4a'; ctx.lineWidth = 0.5; ctx.stroke();\n\n  /* Dot radius — scale inversely with symbol count */\n  const dotR = Math.max(5, Math.min(12, 130 / Math.sqrt(points.length)));\n\n  /* All dim points */\n  for (const p of points) {\n    const px = toX(p.I), py = toY(p.Q);\n    ctx.beginPath(); ctx.arc(px, py, dotR, 0, TWO_PI);\n    ctx.fillStyle = CLR_CONST_DIM; ctx.fill();\n    ctx.strokeStyle = '#6f8aa3'; ctx.lineWidth = 1.5; ctx.stroke();\n    ctx.fillStyle = '#aebfce'; ctx.font = 'bold 12px IBM Plex Mono'; ctx.textAlign = 'center';\n    ctx.fillText(p.label, px, py - dotR - 4);\n  }\n\n  /* Current symbol — highlight */\n  const curPt = points[currentSymIdx % points.length];\n  if (curPt) {\n    const px = toX(curPt.I), py = toY(curPt.Q);\n    /* Glow */\n    ctx.beginPath(); ctx.arc(px, py, dotR+7, 0, TWO_PI);\n    ctx.fillStyle = 'rgba(16,185,129,0.22)'; ctx.fill();\n    /* Bright dot */\n    ctx.beginPath(); ctx.arc(px, py, dotR, 0, TWO_PI);\n    ctx.fillStyle = CLR_CONST_HI; ctx.fill();\n    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2; ctx.stroke();\n    /* Bright label */\n    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px IBM Plex Mono'; ctx.textAlign = 'center';\n    ctx.fillText(curPt.label, px, py - dotR - 6);\n  }\n}\n\n/* §8.3  Digital panel orchestrator */\nconst digitalCanvases = [\n  document.getElementById('dcv0'), document.getElementById('dcv1'),\n  document.getElementById('dcv2'), document.getElementById('dcv3'),\n  document.getElementById('dcv4'), document.getElementById('dcv5'),\n];\n\nfunction resizeDigitalCanvases() {\n  digitalCanvases.forEach((cv) => {\n    const r = cv.parentElement.getBoundingClientRect();\n    cv.width = Math.floor(r.width); cv.height = Math.floor(r.height);\n  });\n}\n\nfunction dspecFMax() {\n  return Math.min(SAMPLE_RATE/2, dstate.fc*2 + dstate.Rb*4);\n}\n\n/* Theoretical bandwidth / carrier markers for the digital modulated spectrum */\nfunction digitalModMarkers() {\n  const { scheme, fc, Rb, deltaF, Ac } = dstate;\n  const n = constellationForScheme(scheme, Ac).bitsPerSym;\n  const Rs = Rb / n;\n  let half;\n  switch (scheme) {\n    case 'ASK': case 'BPSK': half = Rs;          break;\n    case 'FSK':              half = deltaF + Rs;  break;\n    case 'QPSK': case 'QAM16': half = Rs / 2;     break;\n    default:                 half = Rs;\n  }\n  const C = '#f5d76e';\n  return [{ f: fc, label: 'f_c', color: '#ffffff' },\n          { f: fc-half, label: 'BW', color: C },\n          { f: fc+half, label: 'BW', color: C }];\n}\n\nfunction renderAllDigitalPanels() {\n  drecompute();\n  const constl     = dstate.constellation;\n  const bitsPerSym = constl.bitsPerSym;\n  const sampPerSym = Math.round(SAMPLE_RATE / (dstate.Rb / bitsPerSym));\n  const nShow      = sampPerSym * DIGITAL_DISP_SYMS;\n  const fMax       = dspecFMax();\n  const ph         = { symIdx: dstate.currentSym, sampPerSym };\n  const hi         = dstate.symSeq[dstate.currentSym % dstate.symSeq.length];\n\n  drawDigitalBitStream(digitalCanvases[0], dstate.sigMessage,   nShow, dstate.Rb, bitsPerSym, SAMPLE_RATE, ph);\n  drawTimeDomain      (digitalCanvases[1], dstate.sigCarrier,   CLR_CARRIER,   nShow);\n  drawTimeDomain      (digitalCanvases[2], dstate.sigModulated, CLR_MODULATED, nShow, { playhead: ph });\n  drawSpectrum        (digitalCanvases[3], dstate.specModulated, CLR_SPECTRUM,  fMax, { db: RENDER.spectrumDb, markers: RENDER.bwMarkers ? digitalModMarkers() : [] });\n  drawSpectrum        (digitalCanvases[4], dstate.specMessage,   CLR_MESSAGE,   fMax, { db: RENDER.spectrumDb });\n  drawConstellation   (digitalCanvases[5], constl, hi);\n}\n\n/* -----------------------------------------------------------\n   §9  ANALOG METRICS CALCULATOR — unchanged from v1.1.4\n----------------------------------------------------------- */\nfunction updateAnalogMetrics() {\n  const { mode, fm, Am, Ac, kf, kTheta, amMode } = state;\n  const ml = ['ml-1','ml-2','ml-3','ml-4'].map(id => document.getElementById(id));\n  const mv = ['mv-1','mv-2','mv-3','mv-4'].map(id => document.getElementById(id));\n\n  if (mode === 'AM') {\n    const k = Am/Ac, BW = 2*fm, Pc = Ac*Ac/2, Pam = Pc*(1+k*k/2);\n    ml[0].textContent='k = A_M/A_C'; mv[0].textContent=k.toFixed(3);\n    ml[1].textContent='BW = 2·f_m';  mv[1].textContent=BW.toFixed(3)+' kHz';\n    ml[2].textContent='P_AM (norm)'; mv[2].textContent=Pam.toFixed(3);\n    ml[3].textContent='Mode';        mv[3].textContent=amMode;\n    document.getElementById('rd-k').textContent = k.toFixed(3);\n    document.getElementById('overmod-warning').classList.toggle('hidden', k <= 1);\n  } else if (mode === 'FM') {\n    const deltaF = kf*Am, betaF = deltaF/fm, BW = 2*(deltaF+fm);\n    ml[0].textContent='β_f = k_f·A_M/W'; mv[0].textContent=betaF.toFixed(3);\n    ml[1].textContent='BW (Carson)';      mv[1].textContent=BW.toFixed(3)+' kHz';\n    ml[2].textContent='Δf = k_f·A_M';    mv[2].textContent=deltaF.toFixed(3)+' kHz';\n    ml[3].textContent='Mode';             mv[3].textContent='FM';\n    document.getElementById('rd-betaf').textContent  = betaF.toFixed(3);\n    document.getElementById('rd-deltaf').textContent = deltaF.toFixed(3);\n    document.getElementById('overmod-warning').classList.add('hidden');\n  } else if (mode === 'PM') {\n    const betaP = kTheta*Am;\n    ml[0].textContent='β_P = k_θ·A_M';  mv[0].textContent=betaP.toFixed(3);\n    ml[1].textContent='Δθ = β_P (rad)'; mv[1].textContent=betaP.toFixed(3)+' rad';\n    ml[2].textContent='k_θ (rad/V)';    mv[2].textContent=kTheta.toFixed(2);\n    ml[3].textContent='Mode';            mv[3].textContent='PM';\n    document.getElementById('rd-betap').textContent       = betaP.toFixed(3);\n    document.getElementById('rd-deltatheta').textContent  = betaP.toFixed(3);\n    document.getElementById('overmod-warning').classList.add('hidden');\n  }\n}\n\n/* Alias for unified frame loop */\nfunction updateMetrics() { updateAnalogMetrics(); }\n\n/* -----------------------------------------------------------\n   §10  DIGITAL METRICS CALCULATOR\n   η_B = R/B  (bps/Hz); R=Rb×1000 bps; B=BW×1000 Hz → ratio = Rb/BW_kHz\n   BW estimates (kHz):\n     ASK / BPSK: B ≈ 2·Rs\n     FSK:        B ≈ 2(Δf + Rs)\n     QPSK:       B ≈ Rs\n     16-QAM:     B ≈ Rs\n   (Rs = Rb/n in ksymbols/s = kbaud)\n----------------------------------------------------------- */\nfunction updateDigitalMetrics() {\n  const { scheme, Rb, Ac, deltaF } = dstate;\n  const constl = constellationForScheme(scheme, Ac);\n  const n  = constl.bitsPerSym;\n  const Rs = Rb / n;\n  let BW_kHz;\n  switch (scheme) {\n    case 'ASK':   BW_kHz = 2 * Rs;           break;\n    case 'FSK':   BW_kHz = 2*(deltaF + Rs);  break;\n    case 'BPSK':  BW_kHz = 2 * Rs;           break;\n    case 'QPSK':  BW_kHz = Rs;               break;\n    case 'QAM16': BW_kHz = Rs;               break;\n    default:      BW_kHz = 2 * Rs;\n  }\n  const etaB = Rb / BW_kHz;   // bps/Hz (kbps/kHz is dimensionless ratio)\n\n  document.getElementById('dml-1').textContent = 'Scheme';\n  document.getElementById('dmv-1').textContent = scheme;\n  document.getElementById('dml-2').textContent = 'n = log\\u2082(m)';\n  document.getElementById('dmv-2').textContent = n + ' bits/sym';\n  document.getElementById('dml-3').textContent = '\\u03B7_B = R/B';\n  document.getElementById('dmv-3').textContent = etaB.toFixed(3) + ' bps/Hz';\n  document.getElementById('dml-4').textContent = 'E_b/N_0 axis';\n  document.getElementById('dmv-4').textContent = 'label only';\n}\n\n/* -----------------------------------------------------------\n   §8R  RESEARCH RENDERING LAYER\n   Reuses shared drawConstellation(), drawTimeDomain(), drawSpectrum().\n   drawResearchPlaceholder() shown when < 2 points placed.\n----------------------------------------------------------- */\nconst researchCanvases = [\n  document.getElementById('rcv0'), document.getElementById('rcv1'),\n  document.getElementById('rcv2'), document.getElementById('rcv3'),\n];\n\nfunction resizeResearchCanvases() {\n  researchCanvases.forEach((cv) => {\n    const r = cv.parentElement.getBoundingClientRect();\n    cv.width  = Math.floor(r.width);\n    cv.height = Math.floor(r.height);\n  });\n}\n\nfunction drawResearchPlaceholder(canvas, msg) {\n  const ctx = canvas.getContext('2d');\n  const W = canvas.width, H = canvas.height;\n  ctx.clearRect(0, 0, W, H);\n  ctx.fillStyle = CLR_BG; ctx.fillRect(0, 0, W, H);\n  ctx.fillStyle = CLR_GRID;\n  const step = 32;\n  for (let y = 0; y < H; y += step) {\n    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.strokeStyle = CLR_GRID; ctx.lineWidth = 0.5; ctx.stroke();\n  }\n  for (let x = 0; x < W; x += step) {\n    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();\n  }\n  ctx.fillStyle = CLR_DIM || '#64748b'; ctx.font = '14px IBM Plex Mono';\n  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n  ctx.fillText(msg, W / 2, H / 2);\n  ctx.textBaseline = 'alphabetic';\n}\n\nfunction rspecFMax() {\n  return Math.min(SAMPLE_RATE / 2, rstate.fc * 2 + rstate.Rb * 4);\n}\n\n/* Bandwidth / carrier markers for the research modulated spectrum */\nfunction researchModMarkers() {\n  const M = rstate.points.length;\n  if (M < 2) return [];\n  const bps = Math.max(1, Math.ceil(Math.log2(M)));\n  const Rs = rstate.Rb / bps;\n  const C = '#f5d76e';\n  return [{ f: rstate.fc, label: 'f_c', color: '#ffffff' },\n          { f: rstate.fc-Rs, label: 'BW', color: C },\n          { f: rstate.fc+Rs, label: 'BW', color: C }];\n}\n\nfunction renderAllResearchPanels() {\n  rrecompute();\n  const pts = rstate.points;\n  if (pts.length < 2) {\n    const PLACEHOLDER = 'Add at least 2 points';\n    drawResearchPlaceholder(researchCanvases[0], PLACEHOLDER);\n    drawResearchPlaceholder(researchCanvases[1], PLACEHOLDER);\n    drawResearchPlaceholder(researchCanvases[2], PLACEHOLDER);\n    drawResearchPlaceholder(researchCanvases[3], PLACEHOLDER);\n    return;\n  }\n  const constl  = buildResearchConstellation();\n  const fMax    = rspecFMax();\n  const bitsPerSym = constl.bitsPerSym;\n  const sampPerSym = Math.round(SAMPLE_RATE / (rstate.Rb / bitsPerSym));\n  const nShow   = sampPerSym * DIGITAL_DISP_SYMS;\n  const ph      = { symIdx: rstate.currentSym, sampPerSym };\n\n  drawConstellation(researchCanvases[0], constl, rstate.currentSym);\n  drawTimeDomain   (researchCanvases[1], rstate.sigModulated, CLR_MODULATED, nShow, { playhead: ph });\n  drawSpectrum     (researchCanvases[2], rstate.specModulated, CLR_SPECTRUM,  fMax, { db: RENDER.spectrumDb, markers: RENDER.bwMarkers ? researchModMarkers() : [] });\n  drawSpectrum     (researchCanvases[3], rstate.specMessage,   CLR_MESSAGE,   fMax, { db: RENDER.spectrumDb });\n}\n\n/* -----------------------------------------------------------\n   §10R  RESEARCH METRICS CALCULATOR\n   η_B = Rb / BW_kHz  where BW ≈ 2·Rs (IQ baseband, Rs = Rb/bitsPerSym)\n   Min d_E = min over all point pairs of sqrt((I1-I2)²+(Q1-Q2)²)\n   PAPR = 10·log10( max(|s(t)|²) / mean(|s(t)|²) )  dB\n----------------------------------------------------------- */\nfunction updateResearchMetrics() {\n  const pts = rstate.points;\n  const etaEl  = document.getElementById('rmv-etab');\n  const dminEl = document.getElementById('rmv-dmin');\n  const paprEl = document.getElementById('rmv-papr');\n  const hintEl = document.getElementById('rstate-hint');\n\n  if (pts.length < 2) {\n    etaEl.textContent  = '—';\n    dminEl.textContent = '—';\n    paprEl.textContent = '—';\n    hintEl.style.display = '';\n    return;\n  }\n  hintEl.style.display = 'none';\n\n  /* η_B */\n  const M = pts.length;\n  const bitsPerSym = Math.max(1, Math.ceil(Math.log2(M)));\n  const Rs = rstate.Rb / bitsPerSym;\n  const BW_kHz = 2 * Rs;\n  const etaB = rstate.Rb / BW_kHz;\n  etaEl.textContent = etaB.toFixed(3) + ' bps/Hz';\n\n  /* Min Euclidean distance */\n  let dMin = Infinity;\n  for (let i = 0; i < pts.length; i++) {\n    for (let j = i + 1; j < pts.length; j++) {\n      const dI = pts[i].I - pts[j].I;\n      const dQ = pts[i].Q - pts[j].Q;\n      const d  = Math.sqrt(dI*dI + dQ*dQ);\n      if (d < dMin) dMin = d;\n    }\n  }\n  dminEl.textContent = isFinite(dMin) ? dMin.toFixed(4) : '—';\n\n  /* PAPR */\n  const sig = rstate.sigModulated;\n  if (sig && sig.length > 0) {\n    let peak = 0, sumSq = 0;\n    for (let i = 0; i < sig.length; i++) {\n      const p2 = sig[i] * sig[i];\n      if (p2 > peak) peak = p2;\n      sumSq += p2;\n    }\n    const mean = sumSq / sig.length;\n    const papr = mean > 1e-12 ? 10 * Math.log10(peak / mean) : 0;\n    paprEl.textContent = papr.toFixed(2) + ' dB';\n  } else {\n    paprEl.textContent = '—';\n  }\n}\n\n/* -----------------------------------------------------------\n   §11  UI CONTROLLER\n----------------------------------------------------------- */\n\n/* §11.1  Top-level Analog / Digital / Research tab switching */\ndocument.querySelectorAll('.top-tab-btn').forEach((btn) => {\n  btn.addEventListener('click', () => {\n    document.querySelectorAll('.top-tab-btn').forEach(b => b.classList.remove('active'));\n    btn.classList.add('active');\n    state.topDomain = btn.dataset.top;\n    const domain = state.topDomain;\n    const isAnalog   = (domain === 'analog');\n    const isDigital  = (domain === 'digital');\n    const isResearch = (domain === 'research');\n\n    document.getElementById('analog-sidebar').classList.toggle('hidden',   !isAnalog);\n    document.getElementById('digital-sidebar').classList.toggle('hidden',  !isDigital);\n    document.getElementById('research-sidebar').classList.toggle('hidden', !isResearch);\n    document.getElementById('research-right-sidebar').classList.toggle('hidden', !isResearch);\n    document.getElementById('canvas-grid-analog').classList.toggle('hidden',   !isAnalog);\n    document.getElementById('canvas-grid-digital').classList.toggle('hidden',  !isDigital);\n    document.getElementById('canvas-grid-research').classList.toggle('hidden', !isResearch);\n\n    if (isDigital) {\n      resizeDigitalCanvases();\n      dmarkDirty();\n      updateDigitalMetrics();\n      renderAllDigitalPanels();\n    } else if (isResearch) {\n      resizeResearchCanvases();\n      rmarkDirty();\n      updateResearchMetrics();\n      renderAllResearchPanels();\n    } else {\n      resizeAnalogCanvases();\n      markDirty();\n      updateAnalogMetrics();\n      renderAllAnalogPanels();\n    }\n  });\n});\n\n/* §11.2  Analog sub-tab wiring — unchanged from v1.1.4 */\ndocument.querySelectorAll('#analog-tab-bar .tab-btn').forEach((btn) => {\n  btn.addEventListener('click', () => {\n    document.querySelectorAll('#analog-tab-bar .tab-btn').forEach(b => b.classList.remove('active'));\n    btn.classList.add('active');\n    state.mode = btn.dataset.mode;\n    document.getElementById('am-controls').classList.toggle('hidden', state.mode !== 'AM');\n    document.getElementById('fm-controls').classList.toggle('hidden', state.mode !== 'FM');\n    document.getElementById('pm-controls').classList.toggle('hidden', state.mode !== 'PM');\n    document.getElementById('panel3-label').textContent =\n      'Panel 3 \\u2014 Modulated  s(t)  [' + state.mode + ']';\n    markDirty(); updateAnalogMetrics(); renderAllAnalogPanels();\n  });\n});\n\ndocument.getElementById('sel-waveform').addEventListener('change', (e) => {\n  state.waveform = e.target.value;\n  const isCustom = state.waveform === 'custom';\n  document.getElementById('custom-expr-row').classList.toggle('hidden', !isCustom);\n  if (!isCustom) { state.customFn = null; markDirty(); }\n});\n\ndocument.getElementById('custom-expr').addEventListener('input', (e) => {\n  const errEl = document.getElementById('expr-error');\n  const result = compileExpression(e.target.value);\n  if (result.ok) {\n    state.customFn = result.fn;\n    errEl.textContent = '';\n    markDirty(); updateAnalogMetrics(); renderAllAnalogPanels();\n  } else {\n    state.customFn = null;\n    errEl.textContent = result.error;\n  }\n});\n\nfunction bindAnalogSlider(id, readoutId, key, dp) {\n  const sl = document.getElementById(id), rd = document.getElementById(readoutId);\n  sl.addEventListener('input', () => {\n    state[key] = parseFloat(sl.value);\n    rd.textContent = state[key].toFixed(dp);\n    markDirty(); updateAnalogMetrics(); renderAllAnalogPanels();\n  });\n
