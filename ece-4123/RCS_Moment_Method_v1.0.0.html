<!DOCTYPE html>
<html lang="en">
<!--
  RCS Moment Method — radar cross section of simple shapes by the method of moments (2-D)
  Version: v1.0.0
  Released: 2026-10-26
  Changelog:
    v1.0.0 - First release. Infinitely long perfectly conducting cylinders of simple cross-section (circle, ellipse,
             rectangle, equilateral triangle, flat strip), sizes in wavelengths. TM (E along the axis): electric-field
             integral equation; TE (H along the axis): magnetic-field integral equation (closed shapes). Pulse basis,
             point matching at segment centres, LU solve. Bistatic pattern, monostatic RCS against angle and against
             size (frequency), the induced surface current drawn on the body and against arc length. The circle is
             checked against the exact eigenfunction (series) solution.
  Author: Claude Code, for ECE 4123/6423, University of Tulsa.
  References: R. F. Harrington, Field Computation by Moment Methods, Macmillan, 1968 (Ch. 4);
    W. C. Gibson, The Method of Moments in Electromagnetics, 2nd ed., CRC Press, 2015 (Ch. 3-4);
    A. F. Peterson, S. L. Ray, R. Mittra, Computational Methods for Electromagnetics, IEEE Press, 1998 (Ch. 2);
    C. A. Balanis, Advanced Engineering Electromagnetics, 2nd ed., Wiley, 2012 (Ch. 11-12);
    W. H. Press et al., Numerical Recipes, 3rd ed., 2007 (Bessel functions).
  Conventions: time dependence e^{jωt}; Hankel functions of the second kind; lengths in wavelengths (λ = 1, k = 2π);
    E0 = 1 V/m (TM) or H0 = 1 A/m (TE). 2-D RCS (echo width) σ = lim 2πρ |F_s|² / |F_i|², shown as σ/λ in dB.
  No network requests at run time. The solver is exposed read-only as window.RCSMoM for checking.
-->
<head>

<style>

}

}

html,body{ height:100% }

button,input,select{ font:inherit; color:inherit }

<script>
(function(){
'use strict';

// ── CONSTANTS ─────────────────────────────────────────────────
const TWO_PI = 2 * Math.PI, K0 = TWO_PI;           // lengths in wavelengths: λ = 1, k = 2π
const ETA = 376.730313668;                          // free-space wave impedance (Ω)
const GAMMA = 1.7810724179901979;                   // e^γ (Euler's constant γ = 0.5772…)
const DEG = Math.PI / 180;
const SHAPES = { circle: 'Circle', ellipse: 'Ellipse', rect: 'Rectangle', tri: 'Triangle', strip: 'Flat strip' };
const DIMS = {     // each shape's dimensions (in λ): [key, label, default, min, max]
  circle: [['a', 'Radius a', 0.5, 0.02, 5]],
  ellipse: [['a', 'Semi-axis a (x)', 0.8, 0.02, 5], ['b', 'Semi-axis b (y)', 0.3, 0.02, 5]],
  rect: [['w', 'Width w (x)', 1, 0.02, 8], ['h', 'Height h (y)', 1, 0.02, 8]],
  tri: [['s', 'Side s', 1, 0.05, 8]],
  strip: [['w', 'Width w (x)', 2, 0.05, 10]] };
const MODES = { bi: 'Bistatic pattern', mono: 'Monostatic vs angle', freq: 'Monostatic vs size' };
const SWEEP_PTS = 81;                               // sizes in a monostatic-vs-size sweep
const DB_RANGE = 50;                                // dB shown below the plot's maximum

// ── BESSEL FUNCTIONS (real x > 0; Numerical Recipes rational approximations, |error| < 1e-8) ──
function J0(x){ const ax = Math.abs(x);
  if(ax < 8){ const y = x * x;
    return (57568490574.0 + y * (-13362590354.0 + y * (651619640.7 + y * (-11214424.18 + y * (77392.33017 + y * (-184.9052456))))))
      / (57568490411.0 + y * (1029532985.0 + y * (9494680.718 + y * (59272.64853 + y * (267.8532712 + y))))); }
  const z = 8 / ax, y = z * z, xx = ax - 0.785398164;
  const p = 1 + y * (-0.1098628627e-2 + y * (0.2734510407e-4 + y * (-0.2073370639e-5 + y * 0.2093887211e-6)));
  const q = -0.1562499995e-1 + y * (0.1430488765e-3 + y * (-0.6911147651e-5 + y * (0.7621095161e-6 - y * 0.934935152e-7)));
  return Math.sqrt(0.636619772 / ax) * (Math.cos(xx) * p - z * Math.sin(xx) * q); }
function J1(x){ const ax = Math.abs(x); let r;
  if(ax < 8){ const y = x * x;
    r = x * (72362614232.0 + y * (-7895059235.0 + y * (242396853.1 + y * (-2972611.439 + y * (15704.48260 + y * (-30.16036606))))))
      / (144725228442.0 + y * (2300535178.0 + y * (18583304.74 + y * (99447.43394 + y * (376.9991397 + y))))); return r; }
  const z = 8 / ax, y = z * z, xx = ax - 2.356194491;
  const p = 1 + y * (0.183105e-2 + y * (-0.3516396496e-4 + y * (0.2457520174e-5 + y * (-0.240337019e-6))));
  const q = 0.04687499995 + y * (-0.2002690873e-3 + y * (0.8449199096e-5 + y * (-0.88228987e-6 + y * 0.105787412e-6)));
  r = Math.sqrt(0.636619772 / ax) * (Math.cos(xx) * p - z * Math.sin(xx) * q); return x < 0 ? -r : r; }
function Y0(x){
  if(x < 8){ const y = x * x;
    return (-2957821389.0 + y * (7062834065.0 + y * (-512359803.6 + y * (10879881.29 + y * (-86327.92757 + y * 228.4622733)))))
      / (40076544269.0 + y * (745249964.8 + y * (7189466.438 + y * (47447.26470 + y * (226.1030244 + y))))) + 0.636619772 * J0(x) * Math.log(x); }
  const z = 8 / x, y = z * z, xx = x - 0.785398164;
  const p = 1 + y * (-0.1098628627e-2 + y * (0.2734510407e-4 + y * (-0.2073370639e-5 + y * 0.2093887211e-6)));
  const q = -0.1562499995e-1 + y * (0.1430488765e-3 + y * (-0.6911147651e-5 + y * (0.7621095161e-6 + y * (-0.934945152e-7))));
  return Math.sqrt(0.636619772 / x) * (Math.sin(xx) * p + z * Math.cos(xx) * q); }
function Y1(x){
  if(x < 8){ const y = x * x;
    return x * (-0.4900604943e13 + y * (0.1275274390e13 + y * (-0.5153438139e11 + y * (0.7349264551e9 + y * (-0.4237922726e7 + y * 0.8511937935e4)))))
      / (0.2499580570e14 + y * (0.4244419664e12 + y * (0.3733650367e10 + y * (0.2245904002e8 + y * (0.1020426050e6 + y * (0.3549632885e3 + y))))))
      + 0.636619772 * (J1(x) * Math.log(x) - 1 / x); }
  const z = 8 / x, y = z * z, xx = x - 2.356194491;
  const p = 1 + y * (0.183105e-2 + y * (-0.3516396496e-4 + y * (0.2457520174e-5 + y * (-0.240337019e-6))));
  const q = 0.04687499995 + y * (-0.2002690873e-3 + y * (0.8449199096e-5 + y * (-0.88228987e-6 + y * 0.105787412e-6)));
  return Math.sqrt(0.636619772 / x) * (Math.sin(xx) * p + z * Math.cos(xx) * q); }
// J_n(x), n ≥ 0: upward recurrence above n, Miller's downward recurrence below.
function Jn(n, x){
  if(n === 0) return J0(x); if(n === 1) return J1(x); if(x === 0) return 0;
  const ax = Math.abs(x), tox = 2 / ax; let ans;
  if(ax > n){ let bjm = J0(ax), bj = J1(ax); for(let j = 1; j < n; j++){ const bjp = j * tox * bj - bjm; bjm = bj; bj = bjp; } ans = bj; }
  else { const m = 2 * Math.floor((n + Math.floor(Math.sqrt(160 * n))) / 2); let jsum = false, bjp = 0, sum = 0, bj = 1; ans = 0;
    for(let j = m; j > 0; j--){ const bjm = j * tox * bj - bjp; bjp = bj; bj = bjm;
      if(Math.abs(bj) > 1e10){ bj *= 1e-10; bjp *= 1e-10; ans *= 1e-10; sum *= 1e-10; }
      if(jsum) sum += bj; jsum = !jsum; if(j === n) ans = bjp; }
    ans /= 2 * sum - bj; }
  return x < 0 && (n & 1) ? -ans : ans; }
// Y_n(x), n ≥ 0, x > 0: upward recurrence (stable for Y).
function Yn(n, x){ if(n === 0) return Y0(x); if(n === 1) return Y1(x);
  const tox = 2 / x; let bym = Y0(x), by = Y1(x); for(let j = 1; j < n; j++){ const byp = j * tox * by - bym; bym = by; by = byp; } return by; }

// ── GEOMETRY ──────────────────────────────────────────────────
/* A closed contour (counter-clockwise) or an open strip, cut into N flat segments. Each segment: centre (x, y), length
   d, outward unit normal (nx, ny), and its two end points. The circle and ellipse are inscribed polygons whose vertices
   are spaced evenly in arc length; polygons put vertices at their corners and share segments in proportion to side
   length. */
function polygonSegments(verts, closed, N){
  const sides = []; let P = 0;
  for(let i = 0; i < verts.length - (closed ? 0 : 1); i++){ const a = verts[i], b = verts[(i + 1) % verts.length], L = Math.hypot(b[0] - a[0], b[1] - a[1]); sides.push([a, b, L]); P += L; }
  const cnt = sides.map(s => Math.max(1, Math.round(N * s[2] / P)));
  const segs = [];
  sides.forEach(([a, b, L], i) => { const n = cnt[i];
    for(let j = 0; j < n; j++){ const t0 = j / n, t1 = (j + 1) / n, x0 = a[0] + (b[0] - a[0]) * t0, y0 = a[1] + (b[1] - a[1]) * t0, x1 = a[0] + (b[0] - a[0]) * t1, y1 = a[1] + (b[1] - a[1]) * t1;
      segs.push(segment(x0, y0, x1, y1)); } });
  return segs; }
function segment(x0, y0, x1, y1){ const d = Math.hypot(x1 - x0, y1 - y0), tx = (x1 - x0) / d, ty = (y1 - y0) / d;
  return { x: (x0 + x1) / 2, y: (y0 + y1) / 2, d, nx: ty, ny: -tx, x0, y0, x1, y1 }; }   // CCW contour: outward normal = t × ẑ
/* A smooth closed curve (x(t), y(t), t in [0, 2π), counter-clockwise) cut into N arcs of equal length. Each segment keeps
   the true curve: its centre is the arc's mid-point on the curve, its normal the curve's outward normal there, its length
   the arc length, and kappa the curvature (used in the TE self term). The end points (for drawing) are on the curve. */
function smoothSegments(fx, fy, N){
  const M = 8000, pts = [], s = [0], ts = [];
  for(let i = 0; i <= M; i++){ const t = TWO_PI * i / M; ts.push(t); pts.push([fx(t), fy(t)]); if(i) s.push(s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); }
  const P = s[M], tAt = target => { let lo = 0, hi = M; while(hi - lo > 1){ const mid = (lo + hi) >> 1; if(s[mid] < target) lo = mid; else hi = mid; }
    return ts[lo] + (ts[hi] - ts[lo]) * (target - s[lo]) / (s[hi] - s[lo]); };
  const h = 1e-5, segs = [];
  for(let i = 0; i < N; i++){
    const t0 = tAt(P * i / N), t1 = tAt(P * (i + 1) / N), tm = tAt(P * (i + 0.5) / N);
    const dx = (fx(tm + h) - fx(tm - h)) / (2 * h), dy = (fy(tm + h) - fy(tm - h)) / (2 * h), ddx = (fx(tm + h) - 2 * fx(tm) + fx(tm - h)) / (h * h), ddy = (fy(tm + h) - 2 * fy(tm) + fy(tm - h)) / (h * h);
    const sp = Math.hypot(dx, dy);
    segs.push({ x: fx(tm), y: fy(tm), d: P / N, nx: dy / sp, ny: -dx / sp, kappa: (dx * ddy - dy * ddx) / (sp * sp * sp), x0: fx(t0), y0: fy(t0), x1: fx(t1), y1: fy(t1) }); }
  return segs; }
// Perimeter (λ) of a shape, used to pick the number of segments.
function perimeter(shape, d){
  switch(shape){
    case 'circle': return TWO_PI * d.a;
    case 'ellipse': { const h = ((d.a - d.b) / (d.a + d.b)) ** 2; return Math.PI * (d.a + d.b) * (1 + 3 * h / (10 + Math.sqrt(4 - 3 * h))); }   // Ramanujan
    case 'rect': return 2 * (d.w + d.h);
    case 'tri': return 3 * d.s;
  }
  return d.w; }
const closedShape = shape => shape !== 'strip';
// The segments of a shape with about perSeg segments per wavelength (at least 16).
function makeBody(shape, d, perLambda){
  const N = Math.max(16, Math.ceil(perimeter(shape, d) * perLambda));
  let segs;
  switch(shape){
    case 'circle': segs = smoothSegments(t => d.a * Math.cos(t), t => d.a * Math.sin(t), N); break;
    case 'ellipse': segs = smoothSegments(t => d.a * Math.cos(t), t => d.b * Math.sin(t), N); break;
    case 'rect': segs = polygonSegments([[-d.w / 2, -d.h / 2], [d.w / 2, -d.h / 2], [d.w / 2, d.h / 2], [-d.w / 2, d.h / 2]], true, N); break;
    case 'tri': { const r = d.s / (2 * Math.sqrt(3));   // equilateral, centroid at the origin, apex up, counter-clockwise
      segs = polygonSegments([[-d.s / 2, -r], [d.s / 2, -r], [0, 2 * r]], true, N); break; }
    default: segs = polygonSegments([[-d.w / 2, 0], [d.w / 2, 0]], false, N);
  }
  return { shape, d, segs, closed: closedShape(shape) }; }

// ── COMPLEX LINEAR ALGEBRA ────────────────────────────────────
// LU factorisation with partial pivoting of the N×N complex matrix (re, im: Float64Array, row-major), in place.
function luFactor(N, re, im){
  const piv = new Int32Array(N);
  for(let k = 0; k < N; k++){
    let p = k, mx = -1;
    for(let i = k; i < N; i++){ const a = re[i * N + k] ** 2 + im[i * N + k] ** 2; if(a > mx){ mx = a; p = i; } }
    piv[k] = p;
    if(p !== k) for(let j = 0; j < N; j++){ const a = k * N + j, b = p * N + j; let t = re[a]; re[a] = re[b]; re[b] = t; t = im[a]; im[a] = im[b]; im[b] = t; }
    const dr = re[k * N + k], di = im[k * N + k], dd = dr * dr + di * di;
    for(let i = k + 1; i < N; i++){
      const ar = re[i * N + k], ai = im[i * N + k], lr = (ar * dr + ai * di) / dd, li = (ai * dr - ar * di) / dd;
      re[i * N + k] = lr; im[i * N + k] = li;
      for(let j = k + 1; j < N; j++){ const br = re[k * N + j], bi = im[k * N + j]; re[i * N + j] -= lr * br - li * bi; im[i * N + j] -= lr * bi + li * br; } } }
  return { N, re, im, piv }; }
// Solve with an LU factorisation for one right-hand side (br, bi), returned as [xr, xi].
function luSolve(F, br, bi){
  const { N, re, im, piv } = F, xr = Float64Array.from(br), xi = Float64Array.from(bi);
  for(let k = 0; k < N; k++){ const p = piv[k]; if(p !== k){ let t = xr[k]; xr[k] = xr[p]; xr[p] = t; t = xi[k]; xi[k] = xi[p]; xi[p] = t; } }
  for(let i = 0; i < N; i++){ let sr = xr[i], si = xi[i]; for(let j = 0; j < i; j++){ const a = re[i * N + j], b = im[i * N + j]; sr -= a * xr[j] - b * xi[j]; si -= a * xi[j] + b * xr[j]; } xr[i] = sr; xi[i] = si; }
  for(let i = N - 1; i >= 0; i--){ let sr = xr[i], si = xi[i]; for(let j = i + 1; j < N; j++){ const a = re[i * N + j], b = im[i * N + j]; sr -= a * xr[j] - b * xi[j]; si -= a * xi[j] + b * xr[j]; }
    const a = re[i * N + i], b = im[i * N + i], dd = a * a + b * b; xr[i] = (sr * a + si * b) / dd; xi[i] = (si * a - sr * b) / dd; }
  return [xr, xi]; }

// ── MOMENT METHOD ─────────────────────────────────────────────
/* The impedance matrix Z of a body for polarization pol.
   TM (Ez; EFIE): E_z^inc(ρ_m) = (kη/4) Σ_n J_n ∫_n H0⁽²⁾(k|ρ_m − ρ'|) dl'. Off-diagonal: (kη/4) Δ_n H0⁽²⁾(k R_mn);
     diagonal (small-argument integral over the segment itself): (kη/4) Δ_n [1 − j(2/π) ln(γ k Δ_n / (4e))].
   TE (Hz; MFIE, closed bodies): J_m/2 + Σ_{n≠m} J_n (jk/4) Δ_n H1⁽²⁾(k R_mn) (R̂_mn · n̂_n) = −H_z^inc(ρ_m); the self term
     is 1/2 for a flat segment, plus κΔ/(4π) for an arc of curvature κ (its own principal-value integral, small-argument H1). */
function impedance(body, pol){
  const s = body.segs, N = s.length, re = new Float64Array(N * N), im = new Float64Array(N * N), k = K0;
  if(pol === 'TM'){
    const c = k * ETA / 4;
    for(let m = 0; m < N; m++) for(let n = 0; n < N; n++){
      const i = m * N + n, dn = s[n].d;
      if(m === n){ re[i] = c * dn; im[i] = -c * dn * (2 / Math.PI) * Math.log(GAMMA * k * dn / (4 * Math.E)); continue; }
      const R = Math.hypot(s[m].x - s[n].x, s[m].y - s[n].y), kr = k * R;
      re[i] = c * dn * J0(kr); im[i] = -c * dn * Y0(kr); }   // H0⁽²⁾ = J0 − jY0
  } else {

  const ang = h('input', { type: 'range', id: 'phiI', min: 0, max: 359, step: 1, value: S.phiI, attrs: { 'aria-label': 'Incidence direction φi (degrees)' } });
  const angN = h('input', { type: 'number', id: 'phiIN', min: 0, max: 359, step: 1, value: S.phiI, attrs: { 'aria-label': 'Incidence direction φi (degrees)' } });
  ang.addEventListener('input', () => { S.phiI = +ang.value; angN.value = ang.value; update(); });
  angN.addEventListener('change', () => { const v = +angN.value; if(v >= 0 && v < 360){ S.phiI = Math.round(v); ang.value = S.phiI; update(); } });
  side.replaceChildren(
    h('div', { cls: 'sec', text: 'Shape (perfect conductor, infinitely long along z)' }),
    seg('Shape', Object.entries(SHAPES), S.shape, v => { S.shape = v; buildPanel(); update(); }, 'sh_'),
    ...dims.map(([k, label, , mn, mx]) => num('d_' + k, label, S.dims[S.shape][k], mn, mx, 0.01, 'λ', v => { S.dims[S.shape][k] = v; })),
    h('div', { cls: 'sec', text: 'Polarization' }),
    seg('Polarization', [['TM', 'TM (E along z)'], ['TE', 'TE (H along z)', S.shape === 'strip']], effPol(), v => { S.pol = v; buildPanel(); update(); }, 'pol_'),
    h('p', { cls: 'note', text: S.shape === 'strip' ? 'TE is solved with the MFIE, which needs a closed body: the strip is TM only.' : effPol() === 'TM' ? 'TM: electric-field integral equation (EFIE) for Jz.' : 'TE: magnetic-field integral equation (MFIE) for the tangential Jt.' }),
    h('div', { cls: 'sec', text: 'Incident plane wave' }),
    h('div', { cls: 'row' }, h('label', { htmlFor: 'phiI', text: 'φi' }), ang, angN, h('span', { text: '°' })),
    h('p', { cls: 'note', text: 'The wave arrives from direction φi (0° = from +x, 180° = from −x). Backscatter is back toward φi.' }),
    h('div', { cls: 'sec', text: 'Result' }),
    seg('Result', Object.entries(MODES), S.mode, v => { S.mode = v; buildPanel(); update(); }, 'mode_'),
    ...(S.mode !== 'freq' ? [] : [num('f1', 'Size scale from', S.f1, 0.05, 10, 0.05, '×', v => { S.f1 = Math.min(v, S.f2 - 0.05); }), num('f2', 'to', S.f2, 0.1, 10, 0.05, '×', v => { S.f2 = Math.max(v, S.f1 + 0.05); }),
      h('p', { cls: 'note', text: 'Every dimension is scaled together: the same as sweeping frequency for a fixed body (size in wavelengths).' })]),
    h('div', { cls: 'sec', text: 'Discretisation' }),
    num('perL', 'Segments per λ', S.perLambda, 5, 60, 1, '', v => { S.perLambda = Math.round(v); }),
    h('p', { cls: 'note', text: 'Pulse basis, point matching at segment centres. About 10–20 per wavelength is typical; more is slower (N³ to factor).' }),
    h('div', { cls: 'sec', text: 'Read-outs' }), h('div', { cls: 'ro', id: 'ro' }),
    h('div', { cls: 'sec', text: 'The method' }),
    h('div', { cls: 'eq', text: effPol() === 'TM'
      ? 'EFIE (TM):\n  Ez_inc(ρm) = (kη/4) Σn Jn ∫seg n H0⁽²⁾(k|ρm−ρ′|) dl′\n  Zmn = (kη/4) Δn H0⁽²⁾(k Rmn)\n  Znn = (kη/4) Δn [1 − j(2/π) ln(γkΔn / 4e)]\n  [Z][J] = [Ez_inc]\nσ/λ = (kη²/4) |Σ Jn Δn e^{jk ρn·û}|²'
      : 'MFIE (TE, closed body):\n  Jt(ρm)/2 + Σn≠m Jn (jk/4) Δn H1⁽²⁾(k Rmn) (R̂mn·n̂n) = −Hz_inc(ρm)\n  [Z][J] = −[Hz_inc]\nσ/λ = (k/4) |Σ Jn Δn (û·n̂n) e^{jk ρn·û}|²' }),
    h('p', { cls: 'note', text: 'Both integral equations fail near the interior resonances of the body (e.g. TM circle at J_n(ka) = 0): a narrow spike in a size sweep.' }));
}
function update(){ compute(); renderGeo(); renderCur(); renderPlot(); renderRo(); }
function buildPlotStyle(){
  document.getElementById('plotStyle').replaceChildren(seg('Plot style', [['polar', 'Polar'], ['rect', 'Rectangular']], S.polar ? 'polar' : 'rect', v => { S.polar = v === 'polar'; buildPlotStyle(); renderPlot(); }, 'ps_')); }
document.getElementById('themeBtn').addEventListener('click', () => { const l = document.body.classList.toggle('light'); document.getElementById('themeBtn').textContent = l ? 'Dark' : 'Light'; });
buildPanel(); buildPlotStyle(); update();
})();
</script>
