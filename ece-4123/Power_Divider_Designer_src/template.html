<!DOCTYPE html>
<!--
  Power Divider Designer
  Version: @@VERSION@@
  Released: @@RELEASED@@
  Changelog:@@CHANGELOG@@
  Author: Claude Code
  References: D. M. Pozar, Microwave Engineering, 4th ed., Wiley, 2012 (§3.8, §5.6-5.8, §7.1-7.3);
    E. J. Wilkinson, "An N-way hybrid power divider," IRE Trans. MTT 8(1), 1960;
    S. B. Cohn, "A class of broadband three-port TEM-mode hybrids," IEEE Trans. MTT 16(2), 1968;
    E. Hammerstad, O. Jensen, "Accurate models for microstrip computer-aided design," IEEE MTT-S Digest, 1980;
    M. Kirschning, R. H. Jansen, Electron. Lett. 18(6), 1982; R. J. P. Douville, D. S. James, IEEE Trans. MTT 26(3), 1978;
    briefing 2026-10-28_ClaudeCode_briefing_PowerDividerDesigner_v2.0.0 (rev 1).
  Font: IBM Plex Mono (SIL Open Font License 1.1), embedded. No network requests at run time.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="@@VERSION@@">
<title>Power Divider Designer @@VERSION@@</title>
<style>
@@FONTFACES@@
/* ── THEMES ── light is the default (dark text on white); dark is a toggle (D8) */
:root{
  --bg:#ffffff; --bg2:#f1f4f8; --panel:#f7f9fc; --line:#c3cad5; --txt:#111827; --mut:#4b5563; --focus:#1d4ed8;
  --board:#e6eedf; --board-edge:#b9c8a8; --cu:#b8742f; --cu-hi:#1d4ed8; --res:#1f2937; --pad:#c99a3d;
  --s11:#b45309; --s21:#15803d; --s31:#1d4ed8; --s23:#6d28d9; --sR:#6d28d9; --loss:#6b7280; --bad:#b91c1c; --warn:#b45309; --ok:#15803d;
}
body.dark{
  --bg:#0f1218; --bg2:#161b22; --panel:#1c222b; --line:#2f3845; --txt:#e6ebf2; --mut:#a7b1c2; --focus:#ffd479;
  --board:#15261b; --board-edge:#2c4634; --cu:#e0a35c; --cu-hi:#7cc4ff; --res:#d1d5db; --pad:#e0b866;
  --s11:#ffb02e; --s21:#3ddc84; --s31:#60a5fa; --s23:#c4b5fd; --sR:#c4b5fd; --loss:#9ca3af; --bad:#ff8a80; --warn:#ffb02e; --ok:#3ddc84;
}
*{ box-sizing:border-box; margin:0; padding:0 }
html,body{ height:100% }
body{ background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; line-height:1.35;
  display:flex; flex-direction:column; overflow:hidden }
.num, input, table.sheet td, .mono{ font-family:'IBM Plex Mono','DejaVu Sans Mono',Menlo,Consolas,ui-monospace,monospace }
button,input,select{ font:inherit; color:inherit }
button,select{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:.2em .55em; cursor:pointer; min-height:28px }
button:hover,select:hover{ border-color:var(--mut) }
button[aria-pressed="true"]{ background:var(--txt); color:var(--bg); border-color:var(--txt) }
button.wide{ width:100% }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px }
input[type=text],input[type=number]{ background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:.1em .35em; width:6.2em; font-size:13px }
input.invalid{ border-color:var(--bad); outline:2px solid var(--bad) }
input[type=range]{ flex:1; min-width:80px; accent-color:var(--txt) }
.math{ font-family:'Cambria Math','STIX Two Math','Latin Modern Math','Times New Roman',serif; font-size:1.08em }
.math i{ font-style:italic } .math sub,.math sup{ font-style:normal; font-size:.75em }
.hint{ color:var(--mut); font-size:12px } .mut{ color:var(--mut) } .bad{ color:var(--bad) } .okc{ color:var(--ok) }
.warnline{ color:var(--warn); font-size:12px; overflow-wrap:anywhere }
/* ── TOP BAR ── */
#top{ flex:none; display:flex; align-items:center; gap:12px; padding:6px 12px; border-bottom:1px solid var(--line); background:var(--bg2); flex-wrap:wrap }
#brand{ font-weight:700; font-size:16px; white-space:nowrap } #ver{ color:var(--mut); font-size:12px }
#tabs{ display:flex; margin-right:auto; flex-wrap:wrap } #tabs button{ border-radius:0; font-weight:600 } #tabs button:first-child{ border-radius:6px 0 0 6px } #tabs button:last-child{ border-radius:0 6px 6px 0 }
#tabs button[aria-selected="true"]{ background:var(--txt); color:var(--bg); border-color:var(--txt) }
.page{ display:none; flex:1; min-height:0 } .page.on{ display:flex }
.scroll{ overflow-y:auto; display:none; flex:1; min-height:0 } .scroll.on{ display:block }
/* ── DESIGNER ── sidebar | layout over (schematic, outputs, width vs ratio) */
#side{ flex:none; width:310px; overflow-y:auto; border-right:1px solid var(--line); padding:8px 12px 20px; display:flex; flex-direction:column; gap:10px; background:var(--panel) }
.grp h3{ font-size:12px; letter-spacing:.06em; color:var(--mut); margin-bottom:4px; font-weight:700 }
.row{ display:flex; align-items:center; gap:6px; margin:3px 0 } .row.wrap{ flex-wrap:wrap } .row label, .row .lbl{ flex:1; min-width:6.5em } .unit{ color:var(--mut); font-size:12px }
.seg{ display:inline-flex; flex-wrap:wrap } .seg button{ border-radius:0; min-width:2em; margin-left:-1px } .seg button:first-child{ border-radius:6px 0 0 6px; margin-left:0 } .seg button:last-child{ border-radius:0 6px 6px 0 }
.persec{ flex-wrap:wrap } .persec select{ font-size:12px; padding:0 .2em }
.junction-box{ border:1px solid var(--txt); border-radius:6px; padding:6px; margin-top:4px }
#work{ flex:1; min-width:0; display:flex; flex-direction:column; min-height:0; position:relative }
#layoutWrap{ position:relative; flex:1 1 62%; min-height:280px; border-bottom:1px solid var(--line) }
#layoutBar{ position:absolute; top:6px; left:10px; right:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; z-index:1; pointer-events:none }
#layoutBar > *{ pointer-events:auto }
#layoutTitle{ font-weight:700 } .chip{ background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:1px 8px; font-size:12px }
#layout{ position:absolute; inset:0; width:100%; height:100% }
#tip{ position:absolute; pointer-events:none; background:var(--bg); border:1px solid var(--txt); border-radius:6px; padding:6px 8px; font-size:12px; display:none; z-index:5; max-width:340px; box-shadow:0 2px 8px rgba(0,0,0,.18) }
#below{ flex:1 1 38%; min-height:190px; display:grid; grid-template-columns:minmax(220px,.9fr) minmax(330px,1.4fr) minmax(250px,1fr); overflow:hidden }
#below > section{ padding:6px 10px; overflow:auto; border-right:1px solid var(--line) }
h4{ font-size:13px; margin-bottom:4px }
svg text{ font-family:'IBM Plex Mono','DejaVu Sans Mono',Menlo,monospace; fill:var(--txt) }
table.sheet{ border-collapse:collapse; font-size:12px; width:100% } table.sheet th,table.sheet td{ border-bottom:1px solid var(--line); padding:2px 6px; text-align:right; white-space:nowrap }
table.sheet th{ color:var(--mut); font-weight:600 } table.sheet td:first-child,table.sheet th:first-child,table.sheet .l{ text-align:left } table.sheet td.l{ white-space:normal }
table.sheet tfoot td{ font-weight:600 } tr.hl td{ background:color-mix(in srgb, var(--cu-hi) 16%, transparent) } tr.warnrow td{ background:color-mix(in srgb, var(--bad) 8%, transparent) }
.kvs{ display:grid; grid-template-columns:1fr; gap:1px; margin-top:6px; font-size:12px } .kv{ display:flex; justify-content:space-between; gap:8px; border-bottom:1px dotted var(--line) } .kv b{ font-weight:600; text-align:right }
/* layout drawing */
.board{ fill:var(--board); stroke:var(--board-edge) } .fpbox{ fill:none; stroke:var(--mut) }
.el{ cursor:pointer } .el .cu{ fill:var(--cu) } .el path.cus{ fill:none; stroke:var(--cu); stroke-linecap:butt; stroke-linejoin:miter }
.el.hl .cu{ fill:var(--cu-hi) } .el.hl path.cus{ stroke:var(--cu-hi); fill:none }
.el .hit{ fill:none; stroke:transparent } .el .halo{ fill:none; stroke:var(--bad); opacity:.4; stroke-linejoin:round }
.el .pad{ fill:var(--pad) } .el .rbody{ fill:var(--res) } .el.res.hl .rbody{ fill:var(--cu-hi) }
.rlab{ fill:var(--sR); paint-order:stroke; stroke:var(--board); stroke-linejoin:round } .selbox{ fill:none; stroke:var(--cu-hi) } .plab{ paint-order:stroke; stroke:var(--board); stroke-linejoin:round } .bridge{ stroke:var(--sR); fill:none } .bridgedot{ fill:var(--sR) }
.el.grow{ animation:grow .6s ease-out } @keyframes grow{ from{ opacity:0 } 40%{ opacity:.35 } to{ opacity:1 } }
@media (prefers-reduced-motion: reduce){ .el.grow{ animation:none } }
.flow{ opacity:.85 } .f-in{ fill:var(--txt) } .f-out{ fill:var(--s21) } .f-refl{ fill:var(--s11) } .f-res{ fill:var(--sR); opacity:.55 }
/* schematic */
.sbox{ fill:var(--bg); stroke:var(--cu); stroke-width:2 } .el.hl .sbox{ stroke:var(--cu-hi); fill:color-mix(in srgb, var(--cu-hi) 15%, var(--bg)) }
.el.sel .sbox{ stroke:var(--cu-hi); stroke-width:3 } .el.sres.hl path, .el.sres.hl line, .el.sres.hl rect{ stroke:var(--cu-hi) }
/* performance */
#pg_perf{ display:none } #pg_perf.on{ display:grid; grid-template-columns:minmax(420px,1.5fr) minmax(360px,1fr); grid-template-rows:auto auto; overflow:auto; align-items:start }
#pg_perf > section{ padding:8px 12px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); min-width:0 }
#perfPlot{ min-height:460px } .grid{ stroke:var(--line) } .ref15{ stroke:var(--mut); stroke-dasharray:3 3 } .f0line{ stroke:var(--mut); stroke-dasharray:5 4 } .marker{ stroke:var(--txt); stroke-width:1.5 }
.useband{ fill:var(--s21); opacity:.08 }
.tchip{ font-size:12px; border-left:4px solid var(--c) } .tchip[aria-pressed="true"]{ background:var(--bg); color:var(--txt); border-color:var(--c); border-left-width:4px; box-shadow:inset 0 0 0 1px var(--c) }
.tchip[aria-pressed="false"]{ opacity:.55 }
.chips{ gap:4px } .mini{ font-size:12px; color:var(--mut) } .mini input{ width:5.5em }
.markers{ font-size:12px; margin-top:4px; display:flex; flex-wrap:wrap; gap:4px 12px } .mk{ border-left:4px solid var(--c); padding-left:4px }
tr.use td{ font-weight:700; background:color-mix(in srgb, var(--s21) 10%, transparent) }
.fband{ fill:none; stroke-linecap:butt } .fo{ stroke:var(--s21); opacity:.55 } .fr{ stroke:var(--sR); opacity:.5 } .fl{ stroke:var(--loss); opacity:.5 } .fre{ stroke:var(--s11); opacity:.6 }
.fin{ fill:var(--txt); opacity:.25 } .faded{ opacity:.18 } .fadedtxt{ fill:var(--mut) }
ul.checks{ list-style:none; margin:6px 0; font-size:13px } li.ok{ color:var(--ok) } li.no{ color:var(--bad) }
.theorem{ font-size:13px; border-left:3px solid var(--txt); padding-left:8px }
table.smat td{ text-align:center } table.smat td.diag{ background:var(--bg2) } table.cmp td{ white-space:normal }
/* documents */
.doc{ max-width:980px; margin:0 auto; padding:18px 24px 60px; font-size:15px; line-height:1.55 }
.doc h1{ font-size:26px; margin-bottom:6px } .doc h2{ font-size:18px; margin:22px 0 6px; border-top:1px solid var(--line); padding-top:12px }
.doc p{ margin:6px 0 } .doc ul{ margin:6px 0 6px 22px } .doc .lede{ color:var(--mut); font-size:16px }
.doc .eq{ margin:8px 0; padding:8px 12px; background:var(--bg2); border-radius:6px; overflow-x:auto }
.doc table.doc-t{ margin:8px 0 } .doc table.doc-t td{ white-space:normal; text-align:left } .doc table.sheet td{ font-family:inherit } .doc table.sheet td.num{ font-family:'IBM Plex Mono',monospace } .refs{ font-size:13px; color:var(--mut) }
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; margin-top:12px }
.card{ border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--panel); display:flex; flex-direction:column; gap:6px }
.card .tag{ font-size:12px; color:var(--mut); font-family:'IBM Plex Mono',monospace } .card h3{ font-size:16px } .card button{ align-self:flex-start; margin-top:auto }
table.tests td{ white-space:normal; vertical-align:top } tr.tpass td:first-child{ color:var(--ok); font-weight:700 } tr.tfail td:first-child{ color:var(--bad); font-weight:700 }
/* parameters */
#paramsBody{ padding:12px 18px 40px; max-width:1300px }
.sheet-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap } .sheet-head h2{ font-size:20px }
.blocks{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; margin:10px 0 } table.full{ margin-top:6px }
.testsvg{ position:absolute; left:-10000px; top:0 }
#printLayout{ display:none }
@media print{
  body{ overflow:visible; height:auto; display:block; background:#fff; color:#000 }
  #top, #pg_designer, #pg_perf, #pg_theory, #pg_exp, #pg_tests, button{ display:none !important }
  #pg_params{ display:block !important; overflow:visible } #printLayout{ display:block; margin-top:12px; break-inside:avoid }
  table.sheet th, table.sheet td{ border-color:#999 }
}
@media (max-width:900px){ #side{ width:250px } #below{ grid-template-columns:1fr 1fr } #ratioPlot{ display:none } }
</style>
</head>
<body>
<header id="top">
  <span id="brand">Power Divider Designer</span><span id="ver">@@VERSION@@</span>
  <nav id="tabs" role="tablist" aria-label="Pages">
    <button role="tab" id="tab_designer" data-page="designer" aria-selected="true">Designer</button>
    <button role="tab" id="tab_perf" data-page="perf" aria-selected="false">Performance</button>
    <button role="tab" id="tab_params" data-page="params" aria-selected="false">Parameters</button>
    <button role="tab" id="tab_theory" data-page="theory" aria-selected="false">Theory</button>
    <button role="tab" id="tab_exp" data-page="exp" aria-selected="false">Experiments</button>
    <button role="tab" id="tab_tests" data-page="tests" aria-selected="false">Tests</button>
  </nav>
  <button id="themeBtn" aria-label="Switch to the dark theme">Dark</button>
</header>
<main id="pg_designer" class="page on" role="tabpanel" aria-labelledby="tab_designer">
  <aside id="side" aria-label="Design controls"></aside>
  <div id="work">
    <div id="layoutWrap">
      <div id="layoutBar"><span id="layoutTitle">Layout (to scale)</span><span id="layoutInfo" class="chip num"></span>
        <button id="cmpBtn" aria-pressed="false" title="Draw the straight layout above at the same scale">Compare with straight</button>
        <button id="flowBtn" aria-pressed="false" title="Arrows sized by power at f₀: in, out, reflected; discs on the resistors">Power flow</button></div>
      <svg id="layout" role="img" aria-label="Microstrip layout, top view, to scale"></svg>
    </div>
    <div id="below">
      <section id="schem" aria-label="Schematic"></section>
      <section id="outputs" aria-label="Output power and readouts"></section>
      <section id="ratioPlot" aria-label="Arm width versus ratio"></section>
    </div>
  </div>
  <div id="tip" class="num" role="tooltip"></div>
</main>
<main id="pg_perf" class="page" role="tabpanel" aria-labelledby="tab_perf">
  <section id="perfPlot"></section><section id="perfS"></section>
  <section id="perfFlow"></section><section><div id="perfBw"></div><div id="perfCmp"></div></section>
</main>
<main id="pg_params" class="scroll" role="tabpanel" aria-labelledby="tab_params"><div id="paramsBody"></div></main>
<main id="pg_theory" class="scroll" role="tabpanel" aria-labelledby="tab_theory"><div id="theoryBody"></div></main>
<main id="pg_exp" class="scroll" role="tabpanel" aria-labelledby="tab_exp"><div id="expBody"></div></main>
<main id="pg_tests" class="scroll" role="tabpanel" aria-labelledby="tab_tests"><div id="testsBody"></div></main>
<script>
@@SCRIPT@@
</script>
</body>
</html>
